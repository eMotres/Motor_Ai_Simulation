# ============================================================
# Power-device card — GuoYang (CETC) WCMS900B170E53
# 1700 V all-SiC HALF-BRIDGE power module, 1.5 mOhm per switch
# ============================================================
# Source: "WCMS900B170E53 V0" datasheet, Rev.0, published 2025-11-07,
# YangZhou GuoYang Electronics Co., Ltd. (11 pages); a copy is kept at
# docs/datasheets/WCMS900B170E53_V0.pdf.  Page numbers below are that PDF's.
#
# ONE CARD = ONE SWITCH POSITION of the module.  The module is a half-bridge
# (datasheet p.10 circuit: D1 / S1-D2 / S2, two MOSFETs with their body
# diodes, plus an NTC).  A three-phase leg is therefore ONE module; "2 modules
# in parallel per phase" is devices_parallel = 2 in the Controller.  Every
# electrical value below is per switch; the datasheet quotes them that way.
#
# Rules (same as every card in this folder): nothing invented; a value the
# datasheet leaves as "-" is null WITH a note; basis: table (exact) vs
# basis: figure (read off a curve, tolerance_pct stated).
#
# DATASHEET GAPS (Rev.0 prints "-" or nothing):
#   * R_th(j-c) per MOSFET — p.4 row present, typ and max are "-".
#   * R_th(c-h) / R_th(j-f), Z_th — not in the document.
#   * I_D continuous (T_C = 25 / 80 degC), P_tot, I_SD DC, I_SD pulse — "-".
#   * I_DM, E_AS, C_o(er) / E_oss, Q_oss, R_G,int — not in the document.
#   * No SPICE model is supplied, so the switching basis is the datasheet only.
# Units: V, A, mOhm (`_mohm`), ohm (`_ohm`), degC, K/W, nC, pF, uJ.
# ============================================================

part: WCMS900B170E53
manufacturer: "YangZhou GuoYang Electronics (CETC)"
family: "1700 V all-SiC power module, half-bridge"
technology: sic_mosfet
package: "62 mm half-bridge module (152 x 62 mm, M6 terminals)"
package_common_name: "62 mm module"
cooling: baseplate
module:
  topology: half_bridge
  switches_per_module: 2
  ntc: true
  source: "Datasheet p.1 (half-bridge symbol) and p.10 (Circuit Diagram: D1, S1/D2, S2, G1/S1, G2/S2, T1/T2 NTC)"
package_size_mm:
  source: "Datasheet p.10 Package Dimensions (nominal)"
  length_mm: 152
  width_mm: 62
  height_mm: 20.8
  mounting_hole_pitch_mm: [137, 57.5]
weight_g: 346                 # p.4 Module Characteristics, G typ
datasheet_revision: "Rev.0, 2025-11-07"
datasheet_url: null           # received from the customer as a PDF; local copy below
datasheet_file: "docs/datasheets/WCMS900B170E53_V0.pdf"
switching_source: datasheet   # no SPICE model exists for this part

# ── ratings ────────────────────────────────────────────────────────────────
ratings:
  source: "Datasheet p.1 (Absolute Maximum Ratings) and p.4 (Module Characteristics)"
  v_dss_V: 1700
  # p.1: I_D at V_GS = 18 V, T_C = 25 and 80 degC — both printed as "-".
  i_d_continuous: []
  i_d_continuous_unpublished: >-
    Datasheet p.1 prints "-" for I_D at T_C = 25 degC and 80 degC; the part
    number suggests a 900 A class and every characteristic is quoted at
    900 A, but no continuous rating is published.
  i_d_pulsed_A: null          # not published
  p_tot_W: null               # p.1, T_C = 80 degC: "-"
  t_j_max_c: 175              # T_vj(max), p.1 and p.4
  t_j_operating_c: {min: -40, max: 150}   # T_vj(op), p.1 and p.4
  t_storage_c: {min: -40, max: 125}       # p.4
  v_gs_static_V: {min: -10, max: 23}      # p.1 V_GS(max), absolute maximum
  v_isol_V: 2500              # p.4, t = 1 min, 50 Hz
  e_as_mJ: null               # not published

# ── gate ───────────────────────────────────────────────────────────────────
gate:
  source: "Datasheet p.1 (recommended V_GS(op)) and p.2 (MOSFET Characteristics)"
  v_gs_on_recommended_V: 18
  v_gs_off_recommended_V: -5
  v_gs_th_V: {min: 2.0, typ: 3.2, max: 4.0, at_t_j_c: 25,
              note: "V_DS = V_GS, I_D = 360 mA; typ 2.2 V at T_vj = 175 degC (p.2, Fig 7)"}
  q_gs_nC: 936                # V_DS = 1000 V, V_GS = -5/+18 V, I_D = 900 A
  q_gd_nC: 600
  q_g_nC: 4344
  r_g_internal_ohm: null      # not published
  r_g_ext_datasheet_ohm: 5.1  # the R_G of the temperature-resolved data (p.2 150 degC rows, p.3, Figs 10-12, 14)
  r_g_ext_alt_ohm: 2.5        # the 25 degC table rows on p.2 and Fig 9 (2.55 ohm in its legend)
  l_load_uH: 10               # double-pulse load inductance, Figs 9-20 legends

# ── on-state resistance ────────────────────────────────────────────────────
r_ds_on:
  source: >-
    Datasheet p.2 table (R_DS(on) at V_GS = 18 V, I_DS = 900 A: 1.5 mOhm typ /
    1.92 max at 25 degC; 2.67 mOhm typ at T_vj = 175 degC) and p.5 Fig 4
    "R_DS(on) = f(T_vj), I_D = 900 A" (V_GS = 15 V and 18 V).
  measured_at_i_d_A: 900
  curves:
    - v_gs_on_V: 18
      points:
        - {t_j_c: 25,  r_mohm: 1.50, basis: table, anchor: true, r_mohm_max: 1.92}
        - {t_j_c: 50,  r_mohm: 1.58, basis: figure, tolerance_pct: 5}
        - {t_j_c: 75,  r_mohm: 1.70, basis: figure, tolerance_pct: 5}
        - {t_j_c: 100, r_mohm: 1.90, basis: figure, tolerance_pct: 5}
        - {t_j_c: 125, r_mohm: 2.20, basis: figure, tolerance_pct: 5}
        - {t_j_c: 150, r_mohm: 2.47, basis: figure, tolerance_pct: 5}
        # Table p.2 says 2.67 typ; Fig 4 draws 2.80 at 175 degC.  The table wins.
        - {t_j_c: 175, r_mohm: 2.67, basis: table, anchor: true,
           note: "p.5 Fig 4 reads 2.80 mOhm here (+5 %), a datasheet-internal inconsistency"}
    - v_gs_on_V: 15
      points:
        - {t_j_c: 25,  r_mohm: 1.93, basis: figure, tolerance_pct: 5}
        - {t_j_c: 50,  r_mohm: 2.00, basis: figure, tolerance_pct: 5}
        - {t_j_c: 75,  r_mohm: 2.12, basis: figure, tolerance_pct: 5}
        - {t_j_c: 100, r_mohm: 2.27, basis: figure, tolerance_pct: 5}
        - {t_j_c: 125, r_mohm: 2.45, basis: figure, tolerance_pct: 5}
        - {t_j_c: 150, r_mohm: 2.72, basis: figure, tolerance_pct: 5}
        - {t_j_c: 175, r_mohm: 3.00, basis: figure, tolerance_pct: 5}
  # p.6 Fig 5, R_DS(on) = f(I_D) at V_GS = 18 V.  INFORMATIVE: the loss model
  # uses the 900 A curves above (conservative below 900 A — at 300 A the
  # resistance is 10-14 % lower).  [I_D (A), R (mOhm)]
  vs_i_d:
    basis: figure
    tolerance_pct: 5
    source: "Datasheet p.6 Fig 5"
    curves:
      - {t_j_c: 25,  points: [[0, 1.30], [300, 1.35], [600, 1.41], [900, 1.50], [1200, 1.58], [1500, 1.67], [1800, 1.76]]}
      - {t_j_c: 125, points: [[0, 1.78], [300, 1.88], [600, 2.03], [900, 2.19], [1200, 2.33], [1500, 2.48], [1800, 2.67]]}
      - {t_j_c: 150, points: [[0, 1.97], [300, 2.09], [600, 2.24], [900, 2.40], [1200, 2.57], [1500, 2.73], [1800, 2.90]]}

# ── capacitances ───────────────────────────────────────────────────────────
capacitance:
  source: "Datasheet p.2; V_GS = 0 V, V_DS = 1000 V, V_AC = 25 mV, f = 100 kHz"
  at_v_ds_V: 1000
  c_iss_pF: 82350
  c_oss_pF: 2400
  c_rss_pF: 300
  c_o_er_pF: null             # not published
  e_oss_uJ: null              # not published (E_oss is inside the measured E_on anyway)

# ── switching energies ─────────────────────────────────────────────────────
# Double-pulse, inductive load L = 10 uH, V_GS = -5/+18 V.  Only R_G,ext =
# 5.1 ohm has temperature-resolved data, so that is the card's reference.
#
# HOW THE TABLE IS BUILT (every step a stated reading of the datasheet):
#  * 25 degC current shape: p.7 Fig 10 (V_DS = 1000 V, 5.1 ohm, 25 degC) read
#    at 200...900 A, then scaled to 800 V by ONE factor per energy so that it
#    passes through p.7 Fig 11 at 900 A / 25 degC (E_on 105.3 mJ, E_off
#    45.1 mJ): factors 0.721 (E_on) and 0.808 (E_off).  ASSUMPTION: the
#    800/1000 V ratio is the same at every current (Fig 10 is the only
#    current sweep at 5.1 ohm; Fig 9 is at 2.5 ohm).
#  * E_rec at 25 degC: p.8 Fig 14 (800 V, 5.1 ohm), straight line, anchored
#    to the p.3 table value 1.33 mJ at 900 A.
#  * Other temperatures: ONE point at 900 A (Fig 11 / Fig 12 readings, and
#    the p.2/p.3 table values at 150 degC) with the 25 degC current shape
#    borrowed (`shape_from`).  Above 150 degC the model extrapolates linearly
#    from 125 -> 150 degC (no data exists there).
#  * E_on INCLUDES the opposite device's reverse-recovery current effect as
#    measured; E_rec (here e_fr_uJ) is the freewheeling diode's own energy and
#    is ADDED, as for every card in this folder.
switching:
  source: >-
    Datasheet p.2 table (E_on/E_off at 800 V, 900 A: 25 degC/2.5 ohm = 57.34 /
    103.27 mJ; 150 degC/5.1 ohm = 97.2 / 41.3 mJ), p.3 table (E_rec 1.33 mJ at
    25 degC, 8.58 mJ at 150 degC), p.7 Figs 10-12, p.8 Figs 13-14.
  v_dd_ref_V: 800
  i_d_ref_A: 900
  r_g_ext_ref_ohm: 5.1
  scaling:
    voltage_exponent: 1.0
    voltage_rule: >-
      E(V_dc) = E(800 V) * (V_dc/800)^1.0 — MODEL rule.  The datasheet's own
      800 V (Fig 11) vs 1000 V (Fig 10) points at 900 A / 25 degC / 5.1 ohm
      give exponents of about 1.47 (E_on) and 0.95 (E_off): away from 800 V
      this rule is approximate.
    current_rule: >-
      Linear interpolation between the 200...900 A points, linear
      extrapolation below 200 A and above 900 A from the nearest two points.
    temperature_rule: >-
      Linear interpolation between the temperature sets (25/50/75/100/125/
      150 degC), linear extrapolation above 150 degC.
    r_g_rule: >-
      WARNING — the model's linear-in-R_G law does NOT describe this module:
      p.8 Fig 13 (25 degC, 900 A) has E_on rising 57 -> 147 mJ over 2.5 ->
      7.5 ohm while E_off FALLS 103 -> 36 mJ.  Use the reference 5.1 ohm
      (send no r_g_ext_ohm); the 2.5 ohm data are kept below as `alt_r_g`.
  curves:
    - v_gs_off_V: -5
      t_j_c: 25
      e_on_uJ:
        basis: figure
        tolerance_pct: 8
        points: [[200, 25370], [300, 36760], [400, 48290], [500, 58810],
                 [600, 69910], [700, 81730], [800, 93700], [900, 105300]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 11 at 25 degC (105.3 mJ); shape p.7 Fig 10 x 0.721"
      e_off_uJ:
        basis: figure
        tolerance_pct: 10
        points: [[200, 5580], [300, 9780], [400, 14630], [500, 19640],
                 [600, 24890], [700, 30960], [800, 37750], [900, 45100]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 11 at 25 degC (45.1 mJ); shape p.7 Fig 10 x 0.808"
      e_fr_uJ:
        basis: figure
        tolerance_pct: 8
        points: [[200, 345], [300, 485], [400, 625], [500, 765],
                 [600, 905], [700, 1045], [800, 1185], [900, 1325]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.3 table E_rec = 1.33 mJ at 25 degC; shape p.8 Fig 14"
    - v_gs_off_V: -5
      t_j_c: 50
      e_on_uJ:
        basis: figure
        tolerance_pct: 6
        points: [[900, 101500]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 11 (800 V, 900 A, 5.1 ohm) read at 50 degC"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
      e_off_uJ:
        basis: figure
        tolerance_pct: 8
        points: [[900, 40500]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 11 (800 V, 900 A, 5.1 ohm) read at 50 degC"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
      e_fr_uJ:
        basis: figure
        tolerance_pct: 12
        points: [[900, 1890]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 12 (800 V, 900 A, 5.1 ohm) read at 50 degC"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
    - v_gs_off_V: -5
      t_j_c: 75
      e_on_uJ:
        basis: figure
        tolerance_pct: 6
        points: [[900, 99500]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 11 (800 V, 900 A, 5.1 ohm) read at 75 degC"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
      e_off_uJ:
        basis: figure
        tolerance_pct: 8
        points: [[900, 40000]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 11 (800 V, 900 A, 5.1 ohm) read at 75 degC"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
      e_fr_uJ:
        basis: figure
        tolerance_pct: 12
        points: [[900, 2890]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 12 (800 V, 900 A, 5.1 ohm) read at 75 degC"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
    - v_gs_off_V: -5
      t_j_c: 100
      e_on_uJ:
        basis: figure
        tolerance_pct: 6
        points: [[900, 97000]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 11 (800 V, 900 A, 5.1 ohm) read at 100 degC"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
      e_off_uJ:
        basis: figure
        tolerance_pct: 8
        points: [[900, 40300]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 11 (800 V, 900 A, 5.1 ohm) read at 100 degC"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
      e_fr_uJ:
        basis: figure
        tolerance_pct: 12
        points: [[900, 4400]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 12 (800 V, 900 A, 5.1 ohm) read at 100 degC"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
    - v_gs_off_V: -5
      t_j_c: 125
      e_on_uJ:
        basis: figure
        tolerance_pct: 6
        points: [[900, 95000]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 11 (800 V, 900 A, 5.1 ohm) read at 125 degC"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
      e_off_uJ:
        basis: figure
        tolerance_pct: 8
        points: [[900, 40000]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 11 (800 V, 900 A, 5.1 ohm) read at 125 degC"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
      e_fr_uJ:
        basis: figure
        tolerance_pct: 12
        points: [[900, 6300]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.7 Fig 12 (800 V, 900 A, 5.1 ohm) read at 125 degC"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
    - v_gs_off_V: -5
      t_j_c: 150
      e_on_uJ:
        basis: table
        points: [[900, 97200]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.2 table, T_vj = 150 degC, R_G = 5.1 ohm: E_on = 97.2 mJ"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
      e_off_uJ:
        basis: table
        points: [[900, 41300]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.2 table, T_vj = 150 degC, R_G = 5.1 ohm: E_off = 41.3 mJ"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
      e_fr_uJ:
        basis: table
        points: [[900, 8580]]
        anchor_i_d_A: 900
        anchor_source: "Datasheet p.3 table, T_vj = 150 degC: E_rec = 8.58 mJ"
        shape_from: {v_gs_off_V: -5, t_j_c: 25}
  # The 2.5 ohm data — NOT used by the model (no temperature dependence is
  # published at 2.5 ohm).  p.7 Fig 9: 800 V, 25 degC, R_G = 2.55 ohm (legend),
  # [I (A), E (mJ)], basis figure, +-8 %.  Table p.2 at 900 A: 57.34 / 103.27 mJ.
  alt_r_g:
    r_g_ext_ohm: 2.5
    t_j_c: 25
    v_dd_V: 800
    basis: figure
    tolerance_pct: 8
    source: "Datasheet p.7 Fig 9 and p.2 table (25 degC, R_G = 2.5 ohm)"
    e_on_mJ:  [[100, 8], [200, 16], [300, 22], [400, 27], [500, 33], [600, 40], [700, 47], [800, 53], [900, 57.34]]
    e_off_mJ: [[100, 4], [200, 11], [300, 22], [400, 35], [500, 49], [600, 63], [700, 77], [800, 90], [900, 103.27]]
  # p.8 Fig 13, 25 degC, 800 V, 900 A: E vs R_G,ext (informative).
  vs_r_g:
    basis: figure
    tolerance_pct: 8
    source: "Datasheet p.8 Fig 13"
    e_on_mJ:  [[2.5, 57], [3.5, 75], [4.5, 93], [5.1, 104], [6.5, 129], [7.5, 147]]
    e_off_mJ: [[2.5, 103], [3.5, 80], [4.5, 60], [5.1, 50], [6.5, 37], [7.5, 39]]
  times_ns:
    source: "Datasheet p.2 table, I_D = 900 A, V_DS = 800 V, V_GS = +18/-5 V"
    note: "t_j_25 rows at R_G = 2.5 ohm; t_j_150 rows at R_G = 5.1 ohm"
    t_d_on:  {t_j_25: 197, t_j_150: 168}
    t_r:     {t_j_25: 115, t_j_150: 155}
    t_d_off: {t_j_25: 842, t_j_150: 1077}
    t_f:     {t_j_25: 92,  t_j_150: 57.6}

# ── third quadrant (body diode) ────────────────────────────────────────────
third_quadrant:
  source: >-
    Datasheet p.3 (Body Diode Characteristics: V_SD at I_F = 900 A, V_GS = -5 V
    = 4.2 V at 25 degC, 3.8 V at 175 degC) and p.6 Fig 6 V_SD = f(I_SD),
    V_GS = -5 V, 25/125/150 degC.
  i_sd_continuous: []          # p.3 I_SD DC (T_C = 80 degC): "-"
  i_sm_A: null                 # p.3 I_SD pulse: "-"
  reverse_recovery:
    source: "Datasheet p.3, I_F = 900 A, V_DS = 800 V, R_G = 5.1 ohm, V_GS = -5 V"
    t_rr_ns: {t_j_25: 49, t_j_150: 72}
    i_rrm_A: {t_j_25: 200.7, t_j_150: 243.2}
    q_rr_uC: {t_j_25: 5.9, t_j_150: 8.4}
    e_rec_mJ: {t_j_25: 1.33, t_j_150: 8.58}
  # [V_SD (V), I_SD (A)]
  curves:
    - v_gs_off_V: -5
      t_j_c: 25
      basis: figure
      tolerance_pct: 5
      anchor_note: "4.2 V at 900 A is the p.3 table value"
      points: [[2.82, 0], [3.0, 60], [3.30, 300], [3.88, 600], [4.2, 900],
               [4.55, 1200], [5.0, 1800]]
    - v_gs_off_V: -5
      t_j_c: 125
      basis: figure
      tolerance_pct: 5
      points: [[2.55, 0], [3.15, 300], [3.58, 600], [3.88, 900], [4.14, 1200],
               [4.70, 1800]]
    - v_gs_off_V: -5
      t_j_c: 150
      basis: figure
      tolerance_pct: 5
      anchor_note: "p.3 table gives 3.8 V at 900 A and 175 degC"
      points: [[2.52, 0], [3.11, 300], [3.53, 600], [3.82, 900], [4.09, 1200],
               [4.64, 1800]]
  channel_on_note: >-
    With V_GS = +18 V the third quadrant is the channel (p.5 Fig 1/2 are
    symmetric through the origin), V = I * R_DS(on); the diode curves apply
    only in the dead time.

# ── thermal ────────────────────────────────────────────────────────────────
thermal:
  source: "Datasheet p.4 (Module Characteristics)"
  r_th_jc_k_w:
    typ: null
    max: null
    unpublished: >-
      Datasheet p.4 row "Thermal Resistance Junction to Case, R_thJC, Per
      MOSFET" prints "-" for typ and max; no R_th(c-h), R_th(j-f) or Z_th
      curve is published either.  A solve must state its own value.
  r_th_ch_k_w: null
  z_th_jc_curve: null
  ntc:
    source: "Datasheet p.3 NTC Thermistor and p.6 Fig 8"
    r25_ohm: 5000
    r100_ohm: 493.3
    r100_tolerance_pct: 5
    b25_50_K: 3375
  mounting_torque_Nm: {terminals_M6: [3.0, 6.0], heatsink_M5: [3.0, 6.0]}

# -- catalog envelope (catalog stage 1, 2026-09-28) ------------------------
# Identity, status and revision of this card for the common catalogue browser;
# the loss model ignores it.  Sources and per-field provenance are DERIVED by
# motor_ai_sim.catalog from datasheet_url / datasheet_file / datasheet_revision,
# every block's `source` line and each point's `basis` (table | figure).
catalog:
  status: active
  revision: {n: 1, date: "2026-09-28", by: catalog-stage-1, why: "envelope added"}
