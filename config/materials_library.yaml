  B15AHV950M:
    description: "Baosteel B15AHV950M — non-oriented (NGO) electrical steel, 0.15 mm, EV traction grade"
    note: "Manufacturer data 2025: 'B15AHV950M Electromagnetic curve' workbook (DC B-H + core loss at 15 frequencies, 50 Hz-10 kHz) and 'B15AHV950M Product info 2025' datasheet (0.15 mm, assumed density 7.60 kg/dm3, min lamination factor 92.0 %, guaranteed P1.0/400 <= 9.50 W/kg, typical 9.00; J5000 >= 1.64 T). Curve file reproduces both anchors: P1.0/400 = 8.842 W/kg, B(5000 A/m) = 1.674 T."
