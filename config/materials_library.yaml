  F45SH_120C:
    description: "Sintered NdFeB magnet, F45SH grade — operating point 120 °C"
    grade: F45SH
    # Maximum working temperature of the SH class (2026-09-15, user):
    # the grade letter is the class -- SH 150, UH 180, EH 200, AH 220 --
    # and it is NOT this card's `temperature_c`, which is only the
    # temperature the card was measured at.
    max_working_temp_c: 150   # degC
    temperature_c: 120   # T_ref of this card — see the section header
    # SH class, 20 C-referenced alpha(Br) = -0.1185 %/K (the factor the F45SH
    # 1.35 -> 1.19 pair pins) and beta(Hcj) = -0.5 %/K — the same pair the
    # F52SH records were derived with, and the F52SH knees (-1233.7 / -909.0 /
    # -649.3 kA/m at 30/80/120 C) reproduce that beta to 5 digits.
    # RE-REFERENCED to this card's 120 C: alpha = -0.1185/0.8815 = -0.1344,
    # beta = -0.5/0.50 = -1.0000 %/K.
    alpha_br_pct_per_k: -0.1344    # %/K  (Br)
    beta_hcj_pct_per_k: -1.0000    # %/K  (Hcj / knee field)
    Br: 1.190          # T   — NdFeB-class remanence at 120 °C
    # Recoil permeability of SINTERED NdFeB is ~1.05 (essentially temp-independent);
    # the old mu_rec=1.46 came from a too-low Hc=648 kA/m and made the magnet region
    # far too "soft" — the magnetostatic solve (demag off) uses mu_rec as the magnet
    # μ_r, so it over-read the PM flux linkage and torque (~+5%).  Corrected to the
    # datasheet value; normal coercivity follows as Hc = Br/(mu0·mu_rec).  (The
    # bh_curve recoil slope already implied ~1.08, not 1.46.)
    Hc: 901878         # A/m — normal coercivity = Br / (mu0 * mu_rec)
    mu_rec: 1.050      # relative recoil permeability (sintered NdFeB)
    # NdFeB is a metallic alloy (Nd-Fe-B), so eddy-current losses are
    # significant — σ ≈ 625 kS/m at 20 °C, dropping a few percent at
    # 120 °C (thermal phonon scattering).  Use the standard reference
    # 6.25e5 S/m so the σ·ω²·B²·d²/12 slab model produces realistic
    # eddy losses at electrical frequency (≈ 50 … 500 W at 1–2 kHz
    # for typical SPMSM geometries; magnets can be segmented later
    # to bring it down).
    sigma: 6.25e5      # S/m  — sintered NdFeB at ~120 °C
    density: 7500
    # --- mechanical (added 2026-09-05 for the rotor structural solve) ---
    # Sintered NdFeB is a CERAMIC-like brittle intermetallic: it never yields, it
    # cracks, and it is ~12x stronger in compression than in tension.  The rotor
    # check is therefore against the TENSILE strength, and the compressive number
    # is carried so a spoke magnet squeezed by the sleeve can be judged too.
    youngs_modulus_gpa: 160        # GPa  sintered NdFeB, handbook value
    poisson_ratio: 0.24            # -    sintered NdFeB, handbook value
    cte_ppm_k_1: 5.0    # ppm/K  PARALLEL to the magnetisation (user 2026-09-07)
    cte_ppm_k_2: -1.5   # ppm/K  PERPENDICULAR to it - sintered NdFeB CONTRACTS across the alignment axis
    tensile_strength_mpa: 80       # MPa  sintered NdFeB, handbook value (75-90 MPa)
    compressive_strength_mpa: 1000 # MPa  sintered NdFeB, handbook value (~1000-1100 MPa)
    thermal_conductivity: 7.6
    specific_heat: 460
    bh_curve:
