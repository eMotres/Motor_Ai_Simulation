  N52UH_20C:
    description: "Arnold Magnetics N52UH — operating point 20 °C (cold magnets)"
    # Added 2026-09-09 (user: "заведи материал N52UH 20C") — the same magnet as
    # N52UH_150C / N52UH_100C, quoted at room temperature, for the COLD back-EMF
