# ---------------------------------------------------------------------------
# COOLANTS / FLUIDS — cooling-system working fluids (liquids + air).
# EM-inert (sigma≈0, mu_r≈1).  Consumed by the thermal model's cooling BC:
# the convection coefficient h(v) (air, cylinder cross-flow) and the coolant
# energy balance T_out = T_in + P/(ṁ·cp) (liquid) read rho/cp/k/nu/Pr FROM HERE
# — this YAML is the single source of truth for fluid properties.
# Properties are handbook references near operating temperature.
# ---------------------------------------------------------------------------
coolant:

  air:
    # -- provenance (independent-source audit 2026-09-29; envelope rule:
    # a field with no prov entry is `datasheet` from sources[0]) --
    sources:
      - {"id": "incropera", "doc": "Incropera, DeWitt, Bergman, Lavine, Fundamentals of Heat and Mass Transfer, 7th ed., Table A.4 (air, 300 K: rho 1.1614, cp 1007, k 0.0263, nu 15.89e-6, Pr 0.707) and Table A.5 (ethylene glycol, 300 K: rho 1114.4, cp 2415, k 0.252, nu 14.1e-6, Pr 151)", "read": "2026-09-29"}
    description: "Air at ~300 K — natural / forced-convection coolant (gas)."
    phase: gas
    density: 1.1614   # kg/m³
    specific_heat: 1007           # cp  J/(kg·K)
    thermal_conductivity: 0.0263  # k   W/(m·K)
    kinematic_viscosity: 1.6e-05   # nu  m²/s
    prandtl: 0.707
    sigma: 0.0
    permeability: 1.0

  water:
    # -- provenance (independent-source audit 2026-09-29; envelope rule:
    # a field with no prov entry is `datasheet` from sources[0]) --
