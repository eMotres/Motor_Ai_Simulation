# ============================================================
# Power-device card — Infineon IMCQ120R007M2H
# CoolSiC(TM) 1200 V SiC MOSFET G2, Q-DPAK top-side cooled
# Added 2026-09-23 (see IMCQ120R005M2H.yaml header for the full convention
# note). Nothing invented; unpublished = null. Units: V, A, ohm (`_ohm`),
# mOhm (`_mohm`), degC, W, K/W, nC, pF, uJ.
# ============================================================

part: IMCQ120R007M2H
manufacturer: Infineon
family: "CoolSiC MOSFET 1200 V G2"
technology: sic_mosfet
package: PG-HDSOP-22-U03
package_common_name: Q-DPAK
cooling: top_side
marking: 12M2H007
package_size_mm:
  source: "Datasheet Figure 1 (section 5, Package outlines), MAX column — same package group as IMCQ120R004M2H"
  length_mm: 15.10
  width_mm: 21.11
  height_mm: 2.35
  body_width_mm: 15.50
  lead_pitch_mm: 1.14
  leads: 22
weight_g: null

# ── footprint (PCB side; owner 2026-09-26, Task 9) ─────────────────────
# Read by the Controller catalogue's "fits the selected board" filter, not
# by the loss model. Unpublished / not-yet-transcribed = null + a note.
footprint:
  package_outline_id: PG-HDSOP-22-U03
  outline_source: >-
    Datasheet Figure 1 (section 5, Package outlines), PG-HDSOP-22-U03
  land_pattern_ref: null
  land_pattern_note: >-
    NOT TRANSCRIBED. The datasheet could not be opened when this block was
    added (infineon.com unreachable from that session), so whether its Package
    outlines section carries a land-pattern / footprint figure is unchecked.
    Fill in 'Figure N, page P' from the datasheet, or write that the datasheet
    has none.
  body_height_mm: 2.35
  body_height_source: >-
    Datasheet Figure 1 (section 5), dimension A (seating plane to top of tab),
    MAX column
  top_tab_mm: null
  top_tab_note: >-
    NOT TRANSCRIBED. package_size_mm carries body D, overall E, body E1 and
    height A from Figure 1 but not the top cooling tab's own length x width,
    and the datasheet could not be re-opened when this block was added. null
    is NOT 'same as the rest of the group'.
  compatibility_group: qdpak_750_1200
  compatibility_basis: >-
    Owner, 2026-09-26 (Task 9): PG-HDSOP-22-U01 (750 V G2) and PG-HDSOP-22-U03
    (1200 V G2) share one land pattern and differ in the top tab. NOT a
    datasheet statement and not checked against the two land-pattern drawings.
    The cards' own Figure 1 MAX columns agree on D 15.10, E1 15.50, A 2.35, e
    1.14, N 22 and differ in overall E (lead tip to lead tip): U01 21.06, U03
    21.11 mm.
datasheet_revision: "1.20, 2026-07-27"
datasheet_url: "https://infineon.com/dgdl/Infineon-IMCQ120R007M2H-DataSheet-v01_00-EN.pdf?fileId=8ac78c8c93dda25b0194da4fae634243"

ratings:
  source: "Datasheet Table 2 (Maximum rated values); T_vj from Table 4"
  v_dss_V: 1200
  i_d_continuous:
    - {t_case_c: 25,  i_a: 257, basis: table}
    - {t_case_c: 100, i_a: 181, basis: table}
  i_d_pulsed_A: 905
  p_tot_W:
    - {t_case_c: 25,  p_w: 1172, basis: table}
    - {t_case_c: 100, p_w: 586,  basis: table}
  t_j_max_c: 175
  t_j_overload_c: 200
  t_storage_c: {min: -55, max: 150}
  v_gs_transient_V: {min: -10, max: 25}
  v_gs_static_V:    {min: -7,  max: 23}
  e_as_mJ: 1163                # I_D = 93 A, V_DD = 50 V, L = 0.3 mH
  e_ar_mJ: 5.82                # I_D = 93 A, V_DD = 50 V, L = 1.4 uH
  t_sc_us: 2                   # short-circuit withstand time, V_DD <= 800 V, V_DS,peak < 1200 V, V_GS(on) = 15 V, T_vj(start) = 25 degC — the doc's own citation for this part

gate:
  source: "Datasheet Table 3 and Table 4"
  v_gs_on_recommended_V:  {min: 15, max: 18}
  v_gs_off_recommended_V: {min: -5, max: 0}
  v_gs_th_V: {min: 3.5, typ: 4.2, max: 5.1, at_t_j_c: 25,
              note: "I_D = 29.1 mA, V_DS = V_GS; typ 3.2 V at T_vj = 175 degC"}
  q_g_nC: 197                  # V_DD = 800 V, I_D = 93 A, V_GS = 0/18 V
  q_gs_pl_nC: 47
  q_gd_nC: 47
  r_g_internal_ohm: 1.8
  r_g_ext_datasheet_ohm: 2.3
  l_sigma_nH: 15

r_ds_on:
  source: "Datasheet Table 4 (T_vj = 25/150/175 degC at V_GS = 18 V; 25 degC at V_GS = 15 V) and the R_DS(on) = f(T_vj) figure, I_D = 93 A"
  measured_at_i_d_A: 93
  curves:
    - v_gs_on_V: 18
      points:
        - {t_j_c: -50, r_mohm: 5.2,  basis: figure, tolerance_pct: 10}
        - {t_j_c: 0,   r_mohm: 6.4,  basis: figure, tolerance_pct: 10}
        - {t_j_c: 25,  r_mohm: 7.5,  basis: table, anchor: true}
        - {t_j_c: 50,  r_mohm: 8.5,  basis: figure, tolerance_pct: 10}
        - {t_j_c: 75,  r_mohm: 9.8,  basis: figure, tolerance_pct: 10}
        - {t_j_c: 100, r_mohm: 11.2, basis: figure, tolerance_pct: 10}
        - {t_j_c: 125, r_mohm: 13.0, basis: figure, tolerance_pct: 10}
        - {t_j_c: 150, r_mohm: 15.3, basis: table, anchor: true, r_mohm_max: 20}
        - {t_j_c: 175, r_mohm: 17.7, basis: table, anchor: true}
        - {t_j_c: 200, r_mohm: 20.5, basis: figure, tolerance_pct: 10}
    - v_gs_on_V: 15
      points:
        - {t_j_c: 25,  r_mohm: 9.3,  basis: table, anchor: true}

capacitance:
  source: "Datasheet Table 4; f = 100 kHz, V_AC = 25 mV, V_GS = 0 V"
  at_v_ds_V: 800
  c_iss_pF: 8440
  c_oss_pF: 287
  c_rss_pF: 25
  c_o_er_pF: 378
  c_o_tr_pF: 562
  e_oss_uJ: 121
  q_oss_nC: 449
  e_oss_rule: "E_oss(V) = 0.5 * c_o_er * V^2   [AN2025-10 eq. (11), rearranged]"

switching:
  source: >-
    Datasheet Table 4 (E_on/E_off/E_tot, T_vj = 25/175 degC) and Table 6
    (E_fr); current dependence from the figure "E = f(I_D), T_vj = 175 degC,
    R_G,ext = 2.3 ohm, V_DD = 800 V" — 3-point sparse read (see
    IMCQ120R005M2H.yaml header for why this card uses fewer digitized points
    than IMCQ120R004M2H).
  v_dd_ref_V: 800
  i_d_ref_A: 93
  r_g_ext_ref_ohm: 2.3
  scaling:
    voltage_exponent: 1.0
    voltage_rule: "E(V_dc) = E(800 V) * (V_dc / 800)^1.0 — first-order hard-switching rule, ASSUMPTION as on IMCQ120R004M2H."
    current_rule: "Linear interpolation between the tabulated points of `curves`."
    temperature_rule: "Linear interpolation between the 25 degC and 175 degC curve sets."
    r_g_rule: "Linear in R_G,ext through the datasheet point (2.3 ohm); E_fr held at its 2.3 ohm value."
  curves:
    - v_gs_off_V: 0
      t_j_c: 175
      e_on_uJ:
        basis: figure
        tolerance_pct: 15
        points: [[10, 500], [93, 1838], [185, 3900]]
        anchor_i_d_A: 93
        anchor_source: "Datasheet Table 4, E_on at T_vj = 175 degC = 1838 uJ"
      e_off_uJ:
        basis: figure
        tolerance_pct: 15
        points: [[10, 400], [93, 1073], [185, 2100]]
        anchor_i_d_A: 93
        anchor_source: "Datasheet Table 4, E_off at T_vj = 175 degC = 1073 uJ"
      e_fr_uJ:
        basis: figure
        tolerance_pct: 18
        points: [[10, 300], [93, 1195], [185, 2600]]
        anchor_i_d_A: 93
        anchor_source: "Datasheet Table 6, E_fr at T_vj = 175 degC = 1195 uJ"
    - v_gs_off_V: 0
      t_j_c: 25
      e_on_uJ:
        basis: table
        points: [[93, 1113]]
        anchor_i_d_A: 93
        anchor_source: "Datasheet Table 4, E_on at T_vj = 25 degC = 1113 uJ"
        shape_from: {v_gs_off_V: 0, t_j_c: 175}
      e_off_uJ:
        basis: table
        points: [[93, 886]]
        anchor_i_d_A: 93
        anchor_source: "Datasheet Table 4, E_off at T_vj = 25 degC = 886 uJ"
        shape_from: {v_gs_off_V: 0, t_j_c: 175}
      e_fr_uJ:
        basis: table
        points: [[93, 354]]
        anchor_i_d_A: 93
        anchor_source: "Datasheet Table 6, E_fr at T_vj = 25 degC = 354 uJ"
        shape_from: {v_gs_off_V: 0, t_j_c: 175}
    - v_gs_off_V: -5
      t_j_c: 175
      e_on_uJ:
        basis: figure
        tolerance_pct: 15
        points: [[10, 450], [93, 1870], [185, 4200]]
        anchor_i_d_A: 93
        anchor_source: "Datasheet Table 4, E_on at -5 V, T_vj = 175 degC = 1870 uJ"
      e_off_uJ:
        basis: figure
        tolerance_pct: 15
        points: [[10, 200], [93, 547], [185, 1300]]
        anchor_i_d_A: 93
        anchor_source: "Datasheet Table 4, E_off at -5 V, T_vj = 175 degC = 547 uJ"
      e_fr_uJ:
        basis: figure
        tolerance_pct: 18
        points: [[10, 300], [93, 1227], [185, 2800]]
        anchor_i_d_A: 93
        anchor_source: "Datasheet Table 6, E_fr at -5 V, T_vj = 175 degC = 1227 uJ"
    - v_gs_off_V: -5
      t_j_c: 25
      e_on_uJ:
        basis: table
        points: [[93, 1113]]
        anchor_i_d_A: 93
        anchor_source: "Datasheet Table 4, E_on at -5 V, T_vj = 25 degC = 1113 uJ"
        shape_from: {v_gs_off_V: -5, t_j_c: 175}
      e_off_uJ:
        basis: table
        points: [[93, 500]]
        anchor_i_d_A: 93
        anchor_source: "Datasheet Table 4, E_off at -5 V, T_vj = 25 degC = 500 uJ"
        shape_from: {v_gs_off_V: -5, t_j_c: 175}
      e_fr_uJ:
        basis: table
        points: [[93, 354]]
        anchor_i_d_A: 93
        anchor_source: "Datasheet Table 6, E_fr at -5 V, T_vj = 25 degC = 354 uJ"
        shape_from: {v_gs_off_V: -5, t_j_c: 175}
  times_ns:
    source: "Datasheet Table 4, V_DD = 800 V, I_D = 93 A, V_GS = 0/18 V, R_G,ext = 2.3 ohm"
    t_d_on:  {t_j_25: 18.2, t_j_175: 13.9}
    t_r:     {t_j_25: 12.1, t_j_175: 10.7}
    t_d_off: {t_j_25: 36.6, t_j_175: 42.8}
    t_f:     {t_j_25: 16,   t_j_175: 18.9}

third_quadrant:
  source: "Datasheet Table 6 (V_SD at I_SD = 93 A, V_GS = 0 V) — figure not digitized (scope decision, see IMCQ120R005M2H.yaml)"
  i_sd_continuous:
    - {t_case_c: 25,  i_a: 204,   basis: table}
    - {t_case_c: 100, i_a: 115.5, basis: table}
  i_sm_A: 543
  v_sd_at_93A:
    - {t_j_c: 25,  v: 4.2, basis: table, v_max: 5.5}
    - {t_j_c: 100, v: 4.1, basis: table}
    - {t_j_c: 175, v: 4.0, basis: table}
  q_fr_uC: {t_j_25: 0.75, t_j_175: 2}
  i_frm_A: {t_j_25: 83,   t_j_175: 140}
  curves:
    - v_gs_off_V: 0
      t_j_c: 175
      basis: table
      anchor_note: "Table 6 anchor (4.0 V / 93 A) plus the physical origin; the I_SD = f(V_SD) figure was not digitized."
      points: [[0.0, 0.0], [4.0, 93]]
  channel_on_note: "At V_GS = 15...18 V the third quadrant is the CHANNEL; the curve above applies only in dead time."

thermal:
  source: "Datasheet Table 1 (Package, Characteristic values)"
  r_th_jc_k_w: {typ: 0.10, max: 0.13}
  r_th_jc_note: "MOSFET/body diode, junction-case; the case is the TOP-SIDE tab"
  r_th_ja_k_w: {max: 62}
  z_th_jc_curve: null
