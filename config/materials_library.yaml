  B15AHV950M:
    description: "Baosteel B15AHV950M — non-oriented (NGO) electrical steel, 0.15 mm, EV traction grade"
    note: "Manufacturer data 2025: 'B15AHV950M Electromagnetic curve' workbook (DC B-H + core loss at 15 frequencies, 50 Hz-10 kHz) and 'B15AHV950M Product info 2025' datasheet (0.15 mm, assumed density 7.60 kg/dm3, min lamination factor 92.0 %, guaranteed P1.0/400 <= 9.50 W/kg, typical 9.00; J5000 >= 1.64 T). Curve file reproduces both anchors: P1.0/400 = 8.842 W/kg, B(5000 A/m) = 1.674 T."
    form: lamination
    thickness_mm: 0.15
    stacking_factor: 0.92
    sigma: 0
    density: 7600
    # --- mechanical (added 2026-09-05 for the rotor structural solve) ---
    youngs_modulus_gpa: 200        # GPa  non-oriented electrical steel
    poisson_ratio: 0.30            # -    typical for a ferrous alloy
    cte_ppm_k: 12.0   # ppm/K  in-plane, isotropic. Electrical steel / ferrous core, user 2026-09-07
    yield_strength_mpa: 350        # MPa  # typical, not from the datasheet (NO electrical steel)
    thermal_conductivity: null
    specific_heat: null
    saturation_B: 1.997     # T
    # Direct interpolation of the MEASURED P(B, f) table below, not the three
    # coefficients: a fixed B^2 cannot follow this steel's saturation upturn, and
    # the fit reads ~16 % low integrated over a machine that works above 1.5 T.
    # kh/kc/ke stay — they are the OUT-OF-ENVELOPE fallback the surface blends
    # into (B above the table's top point, f outside its range). Opt-in per
    # record, so a steel whose table has not been audited keeps the Bertotti path.
