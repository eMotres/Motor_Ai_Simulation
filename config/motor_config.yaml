  end_winding_factor: 1.144
  connection: 2S-2P
  eddy: true
  rotor_eddy: true
  torque_filter: false
  drive: current
  v_phase_peak: 30.0
  v_delta_deg: 0.0
  current_a: 360.6244584051392
  gamma_deg: 16.0
  daxis_deg: 60.0
  mode: motor
