#   unit                 mm | "" (unitless count/ratio) | deg
#   confidence            exact | likely | unsure
#   fusion_only          true when `canonical` is not a solver geometry key
#   derived               true when the old value came from a formula, not a
#                        leaf constant
#   expression            the old Fusion expression, verbatim
#   canonical_expression  the same formula rewritten with canonical names
#                        (derived rows only)
#   note                  short reason for the confidence / open question
