  Aluminium_7075:
    description: "Aluminium alloy 7075-T6 — high-strength structural / motor shaft"
    sigma: 19200000    # S/m at 20 °C  (conductivity ~32 % IACS)
    density: 2810      # kg/m³
    # --- mechanical (added 2026-09-05 for the rotor structural solve) ---
    youngs_modulus_gpa: 72         # GPa  7075-T6
    poisson_ratio: 0.33            # -
    cte_ppm_k: 23.4   # ppm/K  7075-T6 (user 2026-09-07)
    yield_strength_mpa: 503        # MPa  7075-T6, 0.2 % proof
