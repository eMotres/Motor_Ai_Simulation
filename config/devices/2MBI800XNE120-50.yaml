# ── thermal (p.4 table, p.8 Z_th figure) ────────────────────────────────────
thermal:
  source: "Datasheet p.4, Thermal resistance characteristics; p.8 Transient thermal resistance (max.) Foster table"
  basis: table
  #: per device (one IGBT chip set / one FWD chip set of one switch position)
  r_th_jc_igbt_k_w: {max: 0.037}
  r_th_jc_diode_k_w: {max: 0.044}
  #: case to heatsink per switch position (1 IGBT + 1 FWD), with 1 W/(m.K)
  #: thermal grease, mounted on the additional heatsink (p.4 note *1)
  r_th_cs_k_w: {typ: 0.0167}
  zth_foster:
    tau_s: [0.0005, 0.0049, 0.0351, 0.0566]
    r_igbt_k_w: [0.00099, 0.00792, 0.01176, 0.01633]
    r_diode_k_w: [0.00118, 0.00942, 0.01398, 0.01942]

switching_times_us:
  source: "Datasheet p.3, Switching time (V_CC 600 V, I_C = I_F = 800 A, V_GE +15/-15 V, R_G +-0.5 ohm, L_S 35 nH)"
  basis: table
  t_d_on: {t_j_25: 0.47, t_j_125: 0.48, t_j_150: 0.49, t_j_175: 0.51}
  t_r: {t_j_25: 0.10, t_j_125: 0.11, t_j_150: 0.12, t_j_175: 0.12}
  t_d_off: {t_j_25: 0.45, t_j_125: 0.49, t_j_150: 0.50, t_j_175: 0.52}
  t_f: {t_j_25: 0.08, t_j_125: 0.10, t_j_150: 0.10, t_j_175: 0.11}
  t_rr: {t_j_25: 0.19, t_j_125: 0.29, t_j_150: 0.32, t_j_175: 0.37}

switching_source: datasheet
