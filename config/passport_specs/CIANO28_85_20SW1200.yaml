# Passport spec — CIANO28 85 20SW1200 / L13 (Ø85, 24 slots / 28 poles, 13 mm), 2026-10-05.
# Schema: passport_v1/spec.py.  Owner brief 2026-10-05 + owner update the same evening
# ("two MOSFETs in parallel may be used for it").
die: "CIANO28 85 20SW1200"
inputs_subdir: die85
origin: >-
  /srv/motres/workspaces/c309c100cd421858/dies/CIANO28 85 20SW1200/ +
  /srv/motres/shared/{materials,bearings}_library.yaml, copied read-only 2026-10-05
workspace_user: vadim@motresres.com
report_stage1: PASSPORT_D85_STAGE1_2026-10-05.md
title: "Ø85"
plan:
  # rated = peak speed = 1000 rpm; the propeller duty runs to ~2000+ rpm, so the
  # loss trajectory also gets 2·n0 (+ the electrical n_max as always)
  loss_speed_factors: [0.25, 0.5, 1.0, 1.5, 2.0]
  envelope_max_factor: 4.0
  # settled loss runs at 60 steps/period (the duty's own 120 cost 27 min single-thread
  # per TDM point on the 2026-10-05 probe); B4 re-solves the rated point at 120
  loss_steps_per_period: 60
  # the controller's margin (m = 0.89, the controller block below) from the first plan
  m_margin: 0.89
  # the loss grid always reaches down to 0.25·I0 (Configure's lowest current row), even
  # where the demag current limit sits below it
  loss_floor_levels: [0.25]
  refine_points: [[2.0, 42.5], [2.0, 57.5], [2.5, 42.5], [2.5, 57.5]]
  # owner-directed fixed operating angle (2026-10-10, docs/d85-fixed-operating-angle-
  # 2026-10-10.md): gamma_ref selected once at 25.88 A, 1000 rpm, 20 °C and kept at every
  # loaded row below the voltage limit (field weakening above it)
  fixed_gamma_deg: 1.9505
  fixed_gamma_source: >-
    owner-directed fixed operating angle; gamma_ref = 1.9505° confirmed at 25.88 A,
    1000 rpm, 20 °C (5.6622 N·m, within 0.0002 % of the fitted vertex)
machines:
  L13:
    config: L13
    rated_duty: rated
    peak_duty: peak
    version: "12S"
    owner_bus_V: [36.0, 44.4, 50.4]
    owner_rated: {rpm: 1000.0, I_arms: 25.88}
    owner_peak: {rpm: 1000.0, I_arms: 45.962}
    # HOT set (owner rule 2026-10-10: hot grid at CONVERGED coupled temperatures; a hot
    # magnet outside the F52SH_120C card stops that item, no clamping).  The rated duty
    # (25.88 A, 1000 rpm) has no in-card steady state with either cooling: the robotics
    # coupled loop of 2026-09-28 was refused at magnet 242.9 °C (pass 2), and the coupled
    # S1 searches put the continuous current at 8.52 A (robotics) and 4.3 A (propeller
    # air, FEM lower bound) -- so the rated-duty hot grid is STOPPED (reported).  The hot
    # map is solved instead at the converged coupled state of the machine's continuous
    # rating with its first-listed cooling (robotics, 1000 rpm, S1 8.52 A): magnet
    # 69.2 °C, winding 75.1 °C, inside the magnet card.
    hot_override:
      magnet_c: 69.2
      coil_c: 75.1
      source: >-
        converged coupled EM-thermal loop at the continuous (S1) rating, robotics
        cooling, 1000 rpm, 40 °C ambient (cooling_L13_robotics_s1_n1000, 2026-10-06):
        S1 8.52 A, housing-limited (70 °C touch limit)
      reason: >-
        the rated duty (25.88 A, 1000 rpm) has no steady state inside the magnet card
        with either cooling (robotics coupled loop 2026-09-28 refused at magnet
        242.9 °C; S1 8.52 A robotics / 4.3 A propeller air): rated-duty hot grid stopped
    k3d: {k_T: k_psi}
    stage_a_lengths_mm: [13.0]
    controller:
      status: set
      source: >-
        owner 2026-10-05: the Ø40 12S controller family
        (Controller_CIANO14_40_60V/controller_24V_FOC: UCC27289 12 V, R_G 12 ohm,
        48 kHz centred SVPWM, m = 0.89, dead time 0.1 us) with TWO devices in parallel
        per switch
      device: IQE036N08NM6SC
      n_parallel: 2
      r_g_ohm: 12.0
      v_gs_on_V: 12.0
      v_gs_off_V: 0.0
      dead_time_us: 0.1
      f_carrier_hz: 48000.0
      modulation: svpwm
      m: 0.89
      t_j_assumed_c: 110.0
      build: "12S"
      board_scale: 2
    pwm_variants:
      - {id: si_48k, device: IQE036N08NM6SC, carrier_hz: 48000.0, dead_time_s: 1.0e-7, fem_class: si48_100ns}
      - {id: gan_48k_IGC016K10S2, device: IGC016K10S2, carrier_hz: 48000.0, dead_time_s: 2.0e-8, fem_class: gan48_20ns}
      - {id: gan_100k_IGC016K10S2, device: IGC016K10S2, carrier_hz: 100000.0, dead_time_s: 2.0e-8, fem_class: gan100_20ns}
    mech:
      critical_speeds: false
      critical_note: >-
        not computed: the configuration names no bearings and no shaft line (no beam
        to solve); rotor stress only
    # propellers judged against the motor (config/cooling_options.yaml lists the same);
    # the propeller-air studies take the slipstream of the proposed default (G40x13.1) —
    # the other props' air speed at the same rpm differs by at most ~15 % (h by ~8 %)
    propellers: [tmotor_g30x10_5, tmotor_g32x11, tmotor_g36x11_5, tmotor_g40x13_1]
    cooling_studies:
      # continuous (S1) ratings and the peak time-to-limit, coupled EM-thermal loop
      # (routes.coupled.run), per cooling option of config/cooling_options.yaml
      - {id: robotics_s1_n1000, cooling: robotics, solve_to: continuous, rpm: 1000.0, current: rated}
      - {id: robotics_peak_n1000, cooling: robotics, solve_to: limits, rpm: 1000.0, current: peak}
      - {id: propeller_s1_n1000, cooling: propeller_air, propeller: tmotor_g40x13_1, solve_to: continuous, rpm: 1000.0, current: rated}
      - {id: propeller_s1_n1500, cooling: propeller_air, propeller: tmotor_g40x13_1, solve_to: continuous, rpm: 1500.0, current: rated}
      - {id: propeller_s1_n2000, cooling: propeller_air, propeller: tmotor_g40x13_1, solve_to: continuous, rpm: 2000.0, current: rated}
      - {id: propeller_peak_n1000, cooling: propeller_air, propeller: tmotor_g40x13_1, solve_to: limits, rpm: 1000.0, current: peak}
