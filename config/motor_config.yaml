geometry:
  stator_diameter: 150
  slot_height: 14
  core_thickness: 3.8
  num_seg: 4
  num_slots_per_segment: 6
  num_poles_per_segment: 7
  stator_width: 30
  air_gap: 0.5
  tooth_width: 8.6
  tooth2_width: 4
  cut_width: 3
  insulation_thickness: 0.15
  wire_width: 4
  wire_height: 1
  wire_spacing_x: 0.1
  wire_spacing_y: 0.13
  num_wires_per_slot: 8
  slot_hs: 0.2
  magnet_height: 13.8
  rotor_house_height: 1.2
  shaft_height: 3
  magnet_fill_down: 0.9
  magnet_fill_up: 0.46
  magnet_fill_radius: 1.5
  magnet_up_gap: 0.5
  rotor_hole: 0.6
  magnet_down_height: 2
derived_params:
  stator_outer_radius: stator_diameter / 2
  stator_inner_radius: stator_outer_radius - core_thickness - slot_height
  rotor_outer_radius: stator_inner_radius - air_gap
  rotor_inner_radius: rotor_outer_radius - magnet_height - rotor_house_height
  num_slots: num_seg * num_slots_per_segment
  num_poles: num_seg * num_poles_per_segment
  angle_slot: 360 / num_slots
  angle_pole: 360 / num_poles
  slot_width: wire_width + 2 * wire_spacing_x + 2 * insulation_thickness
  shaft_inner_radius: rotor_inner_radius - shaft_height
geometry_schema:
  stator_diameter:
    label: Stator Diameter
    unit: mm
    type: float
    min: 100
    max: 600
    step: 50
    group: stator
    description: Outer diameter of the stator
  slot_height:
    label: Slot Height
    unit: mm
    type: float
    min: 1
    max: 100
    step: 0.1
    group: stator
    description: Height of stator slots
  core_thickness:
    label: Core Thickness
    unit: mm
    type: float
    min: 0.5
    max: 50
    step: 0.1
    group: stator
    description: Thickness of stator core (back iron)
  num_seg:
    label: Number of Segments
    unit: ''
    type: int
    min: 1
    max: 12
    step: 1
    group: segmentation
    description: Number of segments in stator
  num_slots_per_segment:
    label: Slots per Segment
    unit: ''
    type: int
    min: 4
    max: 6
    step: 2
    group: segmentation
    description: Number of slots per segment
  num_poles_per_segment:
    label: Poles per Segment
    unit: ''
    type: int
    min: 5
    max: 7
    step: 2
    group: segmentation
    description: Number of poles per segment
  stator_width:
    label: Stator Width
    unit: mm
    type: float
    min: 5
    max: 500
    step: 5
    group: stator
    description: Axial length of stator
  air_gap:
    label: Air Gap
    unit: mm
    type: float
    min: 0.1
    max: 3
    step: 0.05
    group: stator
    description: Air gap between stator and rotor
  tooth_width:
    label: Tooth Width
    unit: mm
    type: float
    min: 4
    max: 50
    step: 0.1
    group: slot
    description: Tooth width at the stator outer radius
  tooth2_width:
    label: Tooth2 Width
    unit: mm
    type: float
    min: 1
    max: 50
    step: 0.2
    group: slot
