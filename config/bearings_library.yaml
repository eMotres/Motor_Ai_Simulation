        friction.R2: {type: datasheet, src: task_ac_constants, verify: true, note: "task-supplied angular-contact set, marked to verify (SKF table 2)"}
        friction.R3: {type: datasheet, src: task_ac_constants, verify: true, note: "task-supplied, to verify — F_g = R3.d_m^4.n^2 dominates above ~15 000 rpm; check R3 first if a loss looks impossible"}
        friction.S1: {type: datasheet, src: task_ac_constants, verify: true, note: "task-supplied angular-contact set, marked to verify (SKF table 2)"}
        friction.S2: {type: datasheet, src: task_ac_constants, verify: true, note: "task-supplied angular-contact set, marked to verify (SKF table 2)"}
        friction.K_z: {type: datasheet, src: skf_friction, note: "4.4 angular contact"}
        friction.mu_sl: {type: datasheet, src: skf_friction, note: "grease-lubricated ball bearing"}
        friction.ball_density_ratio: {type: derived, note: "OUR extension: Si3N4 3.2 / bearing steel 7.85 = 0.408"}
      revision: {n: 1, date: "2026-09-28", by: catalog-stage-1, why: "envelope added; verify/APPROXIMATE comments moved to prov"}
    friction:
      R1: 5.03e-7
      R2: 1.97
      R3: 1.90e-12
      S1: 1.30e-2
      S2: 0.68
      K_z: 4.4
      mu_sl: 0.05
      ball_density_ratio: 0.408  # Si3N4 3.2 / bearing steel 7.85
    note: >-
      The smallest bore that clears a 43 mm shaft bore with a sensible wall.
      At 23 000 rpm it is ABOVE its grease limit and needs oil-air.

