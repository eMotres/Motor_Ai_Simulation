# EU server: /etc/motres/rsyncd-motres.conf for deploy/systemd/motres-rsyncd-library.service.
#
# One READ-ONLY module, reachable only over WireGuard from the US host, runs as the application user (10001, NOT root), and
# shows EXACTLY the files of the current catalog manifest and nothing else:
#
#   * the include file is GENERATED from the manifest by the API on every manifest build (`GET /api/peer/v1/catalog/manifest`,
#     regions/catalog_manifest.write_rsync_filter): one anchored rule per mirrored file and its parent folders;
#   * `exclude = *` after it hides everything else - a closed die's folder, passports and cad entries are not even listable.
#
# `list = no` only hides the list of MODULES; the filter is what hides the files.  The daemon reads the include file at every
# connection, so a de-published die disappears from the module with the next manifest build (every 15 min).
# `use chroot = no` because the include file lives outside the module path; rsync still confines every request to `path`.
address = 10.77.0.1
port = 873
use chroot = no
uid = 10001
gid = 10001
max connections = 2
log file = /var/log/motres-rsyncd.log

[motres-library]
    path = /srv/motres/shared
    comment = AeroStator open library (read-only)
    read only = yes
    write only = no
    list = no
    hosts allow = 10.77.0.2
    hosts deny = *
    refuse options = delete delete-before delete-during delete-after delete-delay delete-excluded
    include from = /srv/motres/identity/mirror/rsync-library.include
    exclude = *
