# motor_ai_sim — static frontend + API reverse proxy (one origin).
# TLS terminates in front of this (host nginx + certbot on the AX42); this
# server block stays plain HTTP inside the compose network.
#
# NOT behind Cloudflare's orange cloud: the free tier cuts a proxied request at
# 100 s and a large-format PWM transient runs well over an hour.  DNS-only (grey cloud) is
# fine; the long solves would otherwise have to become poll-only first.

# gzip — the JSON a field view or a duty result returns is tens of MB of ASCII
# numbers and compresses ~8:1.  NOT gzip_static: the api answers are dynamic.
# Explicitly NOT compressing .npz / images / fonts (already compressed).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml
    application/json application/javascript application/xml+rss
    application/wasm image/svg+xml;

# Two processes serve /api since deploy stage 2 (docs/DEPLOY_STAGE2.md):
#
#   motres_api   the web-facing API, TWO instances of one image (api-blue / api-green) of which only ONE is in this
#                upstream at a time.  The member is NOT written here: /etc/nginx/api-upstream.conf is generated at
#                container start (16/17 entrypoint hooks) and includes /srv/web/upstream/api.conf, a one-line file the
#                host's deploy/bluegreen.sh rewrites atomically and `nginx -s reload` picks up.  A reload starts new
#                workers on the new member; the old workers finish their requests on the old one.  Rollback = write the
#                other name back and reload.
#   the worker   the compute process (worker:8002): every route that runs, watches or stops a computation, plus the ones
#                that read or write the live workbench state next to them.  Resolved per request through Docker's DNS
#                (a restart of the worker must not stop nginx from starting, nor a stale address stick).
#                The list of paths is motor_ai_sim.roles.WORKER_PREFIXES - tests/test_deploy_stage2_roles.py fails if the
#                regex below and that table disagree.
upstream motres_api {
    include /etc/nginx/api-upstream.conf;
}

server {
    listen 80;
    server_name _;

    # security headers (the app is same-origin; GIS needs no exceptions here).
    # NB: add_header does not inherit into a location that has its own, so the
    # three are repeated in /assets/ below — without that, every hashed asset
    # was served WITHOUT them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Client IP (docs/MCP_DISCOVERY.md "Client IP").  The host nginx OVERWRITES
    # X-Real-IP with the visitor's address; accept that header only from the
    # host's way in -- this network's gateway (host nginx -> 127.0.0.1:8080 ->
    # docker-proxy) and loopback -- so the $remote_addr passed on below is the
    # visitor.  Any other peer (another container on any bridge) keeps its own
    # address.  The set_real_ip_from lines are written at container start by
    # /docker-entrypoint.d/15-realip-gateway.sh (deploy/nginx-realip-gateway.sh),
    # which reads the gateway from the routing table; 127.0.0.1 only if none.
    include /etc/nginx/realip/trusted.conf;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    # Links of account mails sent BEFORE the short server-side links: /?verify=<token> and /?reset=<token> used to open the single-page
    # app, whose 1.2 MB bundle aborts on some China -> Germany lines (2026-10-15: a confirmation never ran).  Redirect them, before
    # any JavaScript, to the small server-rendered pages (routes/auth_local.py /api/auth/link/*).  The redirect is relative: this
    # server only sees plain HTTP, TLS ends on the host.
    location = / {
        absolute_redirect off;
        if ($arg_verify != "") {
            return 302 /api/auth/link/verify?t=$arg_verify;
        }
        if ($arg_reset != "") {
            return 302 /api/auth/link/reset?t=$arg_reset;
        }
        # the home page is the app shell (what `location = /index.html` below serves): same headers
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files /index.html =404;
    }

    # llms.txt is UTF-8 text (the pre-rendered /zh-cn/ page too).
    charset utf-8;

    # static frontend
    # /srv/web/current (host builds, switched atomically by deploy/deploy_module.sh) or the image bundle
    include /etc/nginx/webroot.conf;
    index index.html;
    location / {
        try_files $uri /index.html;
    }
    # index.html names the hashed bundle — never let a browser keep an old one
    # (owner 2026-09-25: a deploy was invisible until Ctrl+Shift+R).  no-cache =
    # revalidate every time (a 304 when unchanged), the /assets/ stay immutable.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # Crawlable landing pages (web/scripts/prerender-landing.mjs, run by `npm run
    # build`): / is dist/index.html (English), /zh-cn/ is dist/zh-cn/index.html
    # (Simplified Chinese).  Both are the SPA shell with the landing text in the
    # HTML, so a crawler that does not run JavaScript reads the page; a browser
    # runs the bundle and gets the app.  robots.txt, sitemap.xml and llms.txt are
    # plain files in the same dist, served by `location /` as real files (never
    # the SPA fallback).  /zh-cn is a 301 to /zh-cn/ (absolute URL: this server only
    # sees plain HTTP, TLS ends on the host).
    location = /zh-cn {
        return 301 https://aerostator.com/zh-cn/;
    }
    location = /zh-cn/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files /zh-cn/index.html =404;
    }
    location = /zh-cn/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # Not for search engines: the OAuth consent page is the SPA shell too.
    location = /agent-consent {
        absolute_redirect off;
        # an old confirmation mail of a sign-up started in an AI app's authorization window
        if ($arg_verify != "") {
            return 302 /api/auth/link/verify?t=$arg_verify&continue=$arg_continue;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files /index.html =404;
    }
    # Communication preferences (mailed link, account menu): the SPA shell at /preferences and /zh-cn/preferences.  The link's
    # token is a credential, so the page is never indexed and never sent on as a Referer.
    location ~ ^/(zh-cn/)?preferences/?$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files /index.html =404;
    }
    # Self-hosted Inter (web/public/fonts, SIL OFL): same origin, so nothing in
    # the page load depends on a host that is blocked in some countries.
    location /fonts/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # COMPUTE WORKER (deploy stage 2).  The solves, their progress / cancel / last-result routes, the job list, the live
    # workbench (geometry, config, caches), the report, and /mcp.  A regex location beats the /api/ prefix below.
    # FEM solves run minutes to hours: the blocking request is the job, so the timeouts are the API's.
    location ~ ^/(?:api/config|api/controller|api/coupled|api/family/report|api/geometry|api/history|api/jobs|api/kernel|api/mechanical|api/mesh|api/optimization|api/parts|api/sims|api/simulation|api/static3d|api/system|api/thermal|api/winding|mcp)(?:/|$)|^/(?:api/materials)$|^/api/catalog/[^/]+/passport$ {
        # Docker's embedded DNS; the variable makes nginx resolve the name per request and pass the URI through unchanged.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $motres_worker http://worker:8002;
        proxy_pass $motres_worker;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 20m;
        # Only "nothing is listening" (the worker is being restarted) becomes the friendly answer; a 503 the application
        # itself sends (draining) and a 504 after an hour pass through as they are.
        error_page 502 = @worker_down;
    }
    # MCP endpoint (the worker's, see the regex above): an exact location, because the regex gives every worker path the FEM
    # solves' hour-long timeouts and 20 MB bodies.  An agent call is a short JSON-RPC exchange - a tool call that queues a job
    # answers at once and is polled with get_job - so a stuck connection is cut after 2 minutes and a body is capped at 1 MB.
    location = /mcp {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $motres_worker http://worker:8002;
        proxy_pass $motres_worker;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 1m;
        error_page 502 = @worker_down;
    }
    location @worker_down {
        default_type application/json;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        return 503 '{"detail":"The compute service is being updated - try again in a minute. A run that was in progress is listed under Jobs.","code":"worker.unavailable"}';
    }

    # API — the web-facing process (accounts, admin, catalog, production, support ...).
    location /api/ {
        proxy_pass http://motres_api;
        # Never indexed (also Disallow in robots.txt).
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 3600 s: the longest single request the product makes is a large-format PWM
        # transient.  Progress is POLLED, not streamed, so no proxy_buffering
        # off is needed — but the solve request itself still has to survive.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 20m;
    }
    # MCP server for external AI agents (docs/MCP_2026-09-28.md).  Stateless
    # streamable HTTP with plain JSON answers — no SSE, so no buffering tweaks.
    # The API authenticates the agent key itself (McpGate), not nginx.
    # Keep the trailing-slash spelling on the MCP endpoint.  308 preserves
    # POST and its JSON-RPC body for clients that discover /mcp/.
    location = /mcp/ {
        return 308 https://aerostator.com/mcp$is_args$args;
    }
    # (`/mcp` itself is a worker path now - an agent's simulate queues a job on the queue it is read back from; see the
    # worker location above.)
    # OAuth 2.1 for MCP connectors (Stage 2): discovery documents and the
    # authorization-server endpoints live in the API.  The consent PAGE is the
    # SPA at /agent-consent (falls through to location / above).
    location /.well-known/ {
        proxy_pass http://motres_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    # /llms.txt is a plain file (web/public/llms.txt: project summary and the key
    # links), served by `location /` above.  The API's generated catalogue of the
    # MCP tools (docs/MCP_DISCOVERY.md "Plain HTTP") is served as /llms-full.txt:
    # the proxy_pass URI below rewrites the path to the API's own /llms.txt.
    location = /llms-full.txt {
        proxy_pass http://motres_api/llms.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /oauth/ {
        proxy_pass http://motres_api;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }
}
