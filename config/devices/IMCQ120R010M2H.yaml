# ============================================================
# Power-device card — Infineon IMCQ120R010M2H
# CoolSiC(TM) 1200 V SiC MOSFET G2, Q-DPAK top-side cooled
# Added 2026-09-23 (see IMCQ120R005M2H.yaml header for the full convention
# note). Nothing invented; unpublished = null.
# ============================================================

part: IMCQ120R010M2H
manufacturer: Infineon
family: "CoolSiC MOSFET 1200 V G2"
technology: sic_mosfet
package: PG-HDSOP-22-U03
package_common_name: Q-DPAK
cooling: top_side
marking: 12M2H010
package_size_mm:
  source: "Datasheet Figure 1 (section 5, Package outlines), MAX column — same package group as IMCQ120R004M2H"
  length_mm: 15.10
  width_mm: 21.11
  height_mm: 2.35
  body_width_mm: 15.50
  lead_pitch_mm: 1.14
  leads: 22
weight_g: null

# ── footprint (PCB side; owner 2026-09-26, Task 9) ─────────────────────
# Read by the Controller catalogue's "fits the selected board" filter, not
# by the loss model. Unpublished / not-yet-transcribed = null + a note.
footprint:
  package_outline_id: PG-HDSOP-22-U03
  outline_source: >-
    Datasheet Figure 1 (section 5, Package outlines), PG-HDSOP-22-U03
  land_pattern_ref: null
  land_pattern_note: >-
    NOT TRANSCRIBED. The datasheet could not be opened when this block was
    added (infineon.com unreachable from that session), so whether its Package
    outlines section carries a land-pattern / footprint figure is unchecked.
    Fill in 'Figure N, page P' from the datasheet, or write that the datasheet
    has none.
  body_height_mm: 2.35
  body_height_source: >-
    Datasheet Figure 1 (section 5), dimension A (seating plane to top of tab),
    MAX column
  top_tab_mm: null
  top_tab_note: >-
    NOT TRANSCRIBED. package_size_mm carries body D, overall E, body E1 and
    height A from Figure 1 but not the top cooling tab's own length x width,
    and the datasheet could not be re-opened when this block was added. null
    is NOT 'same as the rest of the group'.
  compatibility_group: qdpak_750_1200
  compatibility_basis: >-
    Owner, 2026-09-26 (Task 9): PG-HDSOP-22-U01 (750 V G2) and PG-HDSOP-22-U03
    (1200 V G2) share one land pattern and differ in the top tab. NOT a
    datasheet statement and not checked against the two land-pattern drawings.
    The cards' own Figure 1 MAX columns agree on D 15.10, E1 15.50, A 2.35, e
    1.14, N 22 and differ in overall E (lead tip to lead tip): U01 21.06, U03
    21.11 mm.
datasheet_revision: "1.20, 2026-07-27"
datasheet_url: "https://www.infineon.com/assets/row/public/documents/60/49/infineon-imcq120r010m2h-datasheet-en.pdf"

ratings:
  source: "Datasheet Table 2 (Maximum rated values); T_vj from Table 4"
  v_dss_V: 1200
  i_d_continuous:
    - {t_case_c: 25,  i_a: 195, basis: table}
    - {t_case_c: 100, i_a: 138, basis: table}
  i_d_pulsed_A: 690
  p_tot_W:
    - {t_case_c: 25,  p_w: 880, basis: table}
    - {t_case_c: 100, p_w: 440, basis: table}
  t_j_max_c: 175
  t_j_overload_c: 200
  t_storage_c: {min: -55, max: 150}
  v_gs_transient_V: {min: -10, max: 25}
  v_gs_static_V:    {min: -7,  max: 23}
  e_as_mJ: 868                 # I_D = 69 A, V_DD = 50 V, L = 0.4 mH
  e_ar_mJ: 4.34
  t_sc_us: 2

gate:
  source: "Datasheet Table 3 and Table 4"
  v_gs_on_recommended_V:  {min: 15, max: 18}
  v_gs_off_recommended_V: {min: -5, max: 0}
  v_gs_th_V: {min: 3.5, typ: 4.2, max: 5.1, at_t_j_c: 25,
              note: "I_D = 21.7 mA, V_DS = V_GS; typ 3.2 V at T_vj = 175 degC"}
  q_g_nC: 150                  # V_DD = 800 V, I_D = 69 A, V_GS = -2/18 V
  q_gs_pl_nC: 36
  q_gd_nC: 35
  r_g_internal_ohm: 2
  r_g_ext_datasheet_ohm: 2.3
  l_sigma_nH: 15

r_ds_on:
  source: "Datasheet Table 4 (T_vj = 25/150/175 degC at V_GS = 18 V; 25 degC at V_GS = 15 V), R_DS(on) = f(T_vj) figure, I_D = 69 A"
  measured_at_i_d_A: 69
  curves:
    - v_gs_on_V: 18
      points:
        - {t_j_c: 25,  r_mohm: 10,   basis: table, anchor: true}
        - {t_j_c: 150, r_mohm: 20.4, basis: table, anchor: true, r_mohm_max: 26}
        - {t_j_c: 175, r_mohm: 23.7, basis: table, anchor: true}
    - v_gs_on_V: 15
      points:
        - {t_j_c: 25,  r_mohm: 12.5, basis: table, anchor: true}

capacitance:
  source: "Datasheet Table 4; f = 100 kHz, V_AC = 25 mV, V_GS = 0 V"
  at_v_ds_V: 800
  c_iss_pF: 6320
  c_oss_pF: 214
  c_rss_pF: 19
  c_o_er_pF: 281
  c_o_tr_pF: 419
  e_oss_uJ: 90
  q_oss_nC: 335
  e_oss_rule: "E_oss(V) = 0.5 * c_o_er * V^2   [AN2025-10 eq. (11), rearranged]"

switching:
  source: >-
    Datasheet Table 4 (E_on/E_off/E_tot, T_vj = 25/175 degC) and Table 6
    (E_fr); current dependence from the figure "E = f(I_D), T_vj = 175 degC,
    R_G,ext = 2.3 ohm, V_DD = 800 V" (x-axis 0-140 A) — 3-point sparse read.
  v_dd_ref_V: 800
  i_d_ref_A: 69
  r_g_ext_ref_ohm: 2.3
  scaling:
    voltage_exponent: 1.8
    voltage_exponent_fr: 1.0
    voltage_exponent_source: >-
      2026-09-27 ASSUMPTION: the CoolSiC G2 family figure of IMCQ120R004M2H
      (E_on/E_off ~V^1.8, E_fr ~V^1.0); this part's own E = f(V_DD) figure is not digitised.
    r_g_slope_rel_on_per_ohm: 0.148
    r_g_slope_rel_off_per_ohm: 0.215
    r_g_slope_source: >-
      2026-09-27 ASSUMPTION: the relative slope of IMCQ120R004M2H's figure
      "E = f(R_G,ext)" (same G2 technology, same test circuit); this part's own figure
      is not digitised. Supersedes the proportional r_g_rule below.
    voltage_rule: "E(V_dc) = E(800 V) * (V_dc / 800)^1.0 — first-order hard-switching rule, ASSUMPTION as on IMCQ120R004M2H."
    current_rule: "Linear interpolation between the tabulated points of `curves`."
    temperature_rule: "Linear interpolation between the 25 degC and 175 degC curve sets."
    r_g_rule: "Linear in R_G,ext through the datasheet point (2.3 ohm); E_fr held at its 2.3 ohm value."
  curves:
    - v_gs_off_V: 0
      t_j_c: 175
      e_on_uJ:
        basis: figure
        tolerance_pct: 15
        points: [[8, 350], [69, 1153], [138, 2300]]
        anchor_i_d_A: 69
        anchor_source: "Datasheet Table 4, E_on at T_vj = 175 degC = 1153 uJ"
      e_off_uJ:
        basis: figure
        tolerance_pct: 15
        points: [[8, 150], [69, 550], [138, 1050]]
        anchor_i_d_A: 69
        anchor_source: "Datasheet Table 4, E_off at T_vj = 175 degC = 550 uJ"
      e_fr_uJ:
        basis: figure
        tolerance_pct: 18
        points: [[8, 300], [69, 1055], [138, 2000]]
        anchor_i_d_A: 69
        anchor_source: "Datasheet Table 6, E_fr at T_vj = 175 degC = 1055 uJ"
    - v_gs_off_V: 0
      t_j_c: 25
      e_on_uJ:
        basis: table
        points: [[69, 648]]
        anchor_i_d_A: 69
        anchor_source: "Datasheet Table 4, E_on at T_vj = 25 degC = 648 uJ"
        shape_from: {v_gs_off_V: 0, t_j_c: 175}
      e_off_uJ:
        basis: table
        points: [[69, 451]]
        anchor_i_d_A: 69
        anchor_source: "Datasheet Table 4, E_off at T_vj = 25 degC = 451 uJ"
        shape_from: {v_gs_off_V: 0, t_j_c: 175}
      e_fr_uJ:
        basis: table
        points: [[69, 313]]
        anchor_i_d_A: 69
        anchor_source: "Datasheet Table 6, E_fr at T_vj = 25 degC = 313 uJ"
        shape_from: {v_gs_off_V: 0, t_j_c: 175}
    - v_gs_off_V: -5
      t_j_c: 175
      e_on_uJ:
        basis: figure
        tolerance_pct: 15
        points: [[8, 380], [69, 1174], [138, 2500]]
        anchor_i_d_A: 69
        anchor_source: "Datasheet Table 4, E_on at -5 V, T_vj = 175 degC = 1174 uJ"
      e_off_uJ:
        basis: figure
        tolerance_pct: 15
        points: [[8, 70], [69, 274], [138, 650]]
        anchor_i_d_A: 69
        anchor_source: "Datasheet Table 4, E_off at -5 V, T_vj = 175 degC = 274 uJ"
      e_fr_uJ:
        basis: figure
        tolerance_pct: 18
        points: [[8, 300], [69, 1084], [138, 2100]]
        anchor_i_d_A: 69
        anchor_source: "Datasheet Table 6, E_fr at -5 V, T_vj = 175 degC = 1084 uJ"
    - v_gs_off_V: -5
      t_j_c: 25
      e_on_uJ:
        basis: table
        points: [[69, 648]]
        anchor_i_d_A: 69
        anchor_source: "Datasheet Table 4, E_on at -5 V, T_vj = 25 degC = 648 uJ"
        shape_from: {v_gs_off_V: -5, t_j_c: 175}
      e_off_uJ:
        basis: table
        points: [[69, 250]]
        anchor_i_d_A: 69
        anchor_source: "Datasheet Table 4, E_off at -5 V, T_vj = 25 degC = 250 uJ"
        shape_from: {v_gs_off_V: -5, t_j_c: 175}
      e_fr_uJ:
        basis: table
        points: [[69, 313]]
        anchor_i_d_A: 69
        anchor_source: "Datasheet Table 6, E_fr at -5 V, T_vj = 25 degC = 313 uJ"
        shape_from: {v_gs_off_V: -5, t_j_c: 175}
  times_ns:
    source: "Datasheet Table 4, V_DD = 800 V, I_D = 69 A, V_GS = 0/18 V, R_G,ext = 2.3 ohm"
    t_d_on:  {t_j_25: 13.6, t_j_175: 10.4}
