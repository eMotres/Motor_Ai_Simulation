  # ── Fe16N2 (iron nitride) — RESEARCH MATERIAL, literature estimate ─────────
  # Not a datasheet: bracketed from published work, since no qualified bulk
  # magnet is sold.  Common to both: Ku > 1.0 MJ/m3 and mu0*Ms > 2.4 T
  # (PhysRevApplied 6.024013 / Sci.Rep. 25436), loop squareness Hk/Hcj = 0.79
  # (Niron, current best pressed), decomposes above 214 C.  sigma is an estimate
  # (metallic, Fe-based -> higher eddy loss than NdFeB).  The demag curve is
  # built as linear recoil to the knee at 0.79*Hcj, then the collapse to J = 0
  # at Hcj -- the low-anisotropy behaviour that decides this material's fate.
  #
  # TEMPERATURE: quoted at 20 C, while F45SH_120C is quoted hot (120 C).  Since
  # 2026-09-08 the solver CAN temperature-correct a magnet (section header), so
  # the two can be compared at one temperature instead of by caveat -- but the
  # caveat still holds for anything that reads the cards as-is.  Fe16N2 is the
  # one material here whose coercivity RISES with temperature: +0.4 Oe/K over
  # 27-152 C (Acta Mater. 2020), against NdFeB's -81.9 Oe/K.  As a percentage
  # that is beta = +0.4 Oe/K divided by the card's own Hcj, so it differs per
  # card (+0.0099 %/K on the 4.0 kOe optimistic card, +0.0209 %/K on the
  # 1.91 kOe lab card) -- two orders of magnitude below NdFeB either way, which
  # is the whole point of the material.  alpha(Br) = -0.10 %/K is an ESTIMATE,
  # not a measurement: no bulk magnet exists to measure.  Br still falls with
  # temperature, so these numbers remain the OPTIMISTIC end for a hot machine.
  Fe16N2_optimistic:
    description: Fe16N2 iron nitride - OPTIMISTIC commercial target (Niron-class claims, Br up to 1.5 T, Hcj 4 kOe). Literature estimate, NOT a qualified datasheet.
    grade: Fe16N2-opt
    temperature_c: 20    # T_ref of this card — see the section header
    # alpha: literature ESTIMATE (no bulk magnet exists to measure).
    # beta: +0.4 Oe/K (Acta Mater. 2020) on this card's Hcj = 4.02 kOe
    # (320 kA/m, the curve's first point) => +0.4/4023 = +0.0099 %/K.  POSITIVE:
    # Fe16N2 is the one card here whose coercivity rises with temperature.
    alpha_br_pct_per_k: -0.1000    # %/K  (Br)  — estimate
    beta_hcj_pct_per_k: +0.0099    # %/K  (Hcj) — computed, see above
    Br: 1.35
    Hc: 300735
    mu_rec: 1.10
    sigma: 2.0e6
    density: 7100
    # --- mechanical (added 2026-09-05 for the rotor structural solve) ---
    # No mechanical data exists for this LAB material (it has never been made as a
    # bulk sintered magnet).  Sintered-NdFeB values stand in so the structural
    # solve runs at all; treat any Fe16N2 stress number as indicative only.
    youngs_modulus_gpa: 160        # GPa  # stand-in: sintered NdFeB, no Fe16N2 data
    poisson_ratio: 0.24            # -    # stand-in: sintered NdFeB, no Fe16N2 data
    cte_ppm_k_1: 5.0    # ppm/K  PARALLEL to the magnetisation (user 2026-09-07)
    cte_ppm_k_2: -1.5   # ppm/K  PERPENDICULAR to it - sintered NdFeB CONTRACTS across the alignment axis
    tensile_strength_mpa: 80       # MPa  # stand-in: sintered NdFeB, no Fe16N2 data
    compressive_strength_mpa: 1000 # MPa  # stand-in: sintered NdFeB, no Fe16N2 data
    thermal_conductivity: 20.0
    specific_heat: 450
    bh_curve:
    - [-320000, -0.402]
    - [-252800, 1.001]
    - [-189600, 1.088]
    - [-126400, 1.175]
    - [-63200, 1.263]
    - [0, 1.35]
