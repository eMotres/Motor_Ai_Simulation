# Hydra / Modulus configuration for 2-D magnetostatics PINN
# Reference: https://docs.nvidia.com/deeplearning/modulus/modulus-sym/index.html

defaults:
  - modulus_default        # pulls in Modulus Sym defaults
  - arch:
      - fully_connected    # network architecture
  - _self_

# ── Device & output ──────────────────────────────────────────────────────────
device: cuda          # "cuda" | "cpu"
network_dir: outputs/magnetostatics_2d

# ── Training ─────────────────────────────────────────────────────────────────
training:
  max_steps: 10000
  grad_agg_freq: 1
  rec_results_freq: 1000
  rec_validation_freq: 1000
  rec_monitor_freq: 100
  rec_inference_freq: 1000
  save_network_freq: 1000
  print_stats_freq: 100
  summary_freq: 1000

# ── Learning rate ─────────────────────────────────────────────────────────────
optimizer:
  lr: 1e-3
  betas: [0.9, 0.999]

# ── Network architecture ──────────────────────────────────────────────────────
arch:
  fully_connected:
    layer_size: 128
    nr_layers: 6
    activation_fn: tanh
    adaptive_activations: false
    weight_norm: true

# ── Motor operating point (mirrors motor_config.yaml simulation section) ─────
motor:
  max_current: 10.0      # [A]
  frequency: 50.0        # [Hz]
  rpm: 2000
  rotor_angle_deg: 0.0   # static solve at this rotor angle

# ── Loss weights per sub-domain ───────────────────────────────────────────────
loss_weights:
  stator_core: 1.0
  rotor_core:  1.0
  air_gap:     2.0       # higher weight near air gap for accuracy
  magnet:      1.0
  slot:        1.0
  bc_outer:    10.0      # Dirichlet BCs weighted more
  bc_inner:    10.0
