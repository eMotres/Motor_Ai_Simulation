part: IMCQ120R078M2H
manufacturer: Infineon
family: "CoolSiC MOSFET 1200 V G2"
technology: sic_mosfet
package: PG-HDSOP-22-U03
package_common_name: Q-DPAK
cooling: top_side
marking: 12M2H078
package_size_mm:
  source: "Datasheet Figure 1 (section 5, Package outlines), MAX column — same package group as IMCQ120R004M2H"
  length_mm: 15.10
  width_mm: 21.11
  height_mm: 2.35
  body_width_mm: 15.50
  lead_pitch_mm: 1.14
  leads: 22
weight_g: null

# ── footprint (PCB side; owner 2026-09-26, Task 9) ─────────────────────
# Read by the Controller catalogue's "fits the selected board" filter, not
# by the loss model. Unpublished / not-yet-transcribed = null + a note.
footprint:
  package_outline_id: PG-HDSOP-22-U03
  outline_source: >-
    Datasheet Figure 1 (section 5, Package outlines), PG-HDSOP-22-U03
  land_pattern_ref: null
  land_pattern_note: >-
    NOT TRANSCRIBED. The datasheet could not be opened when this block was
    added (infineon.com unreachable from that session), so whether its Package
    outlines section carries a land-pattern / footprint figure is unchecked.
    Fill in 'Figure N, page P' from the datasheet, or write that the datasheet
    has none.
  body_height_mm: 2.35
  body_height_source: >-
    Datasheet Figure 1 (section 5), dimension A (seating plane to top of tab),
    MAX column
  top_tab_mm: null
  top_tab_note: >-
    NOT TRANSCRIBED. package_size_mm carries body D, overall E, body E1 and
    height A from Figure 1 but not the top cooling tab's own length x width,
    and the datasheet could not be re-opened when this block was added. null
    is NOT 'same as the rest of the group'.
  compatibility_group: qdpak_750_1200
  compatibility_basis: >-
    Owner, 2026-09-26 (Task 9): PG-HDSOP-22-U01 (750 V G2) and PG-HDSOP-22-U03
    (1200 V G2) share one land pattern and differ in the top tab. NOT a
    datasheet statement and not checked against the two land-pattern drawings.
    The cards' own Figure 1 MAX columns agree on D 15.10, E1 15.50, A 2.35, e
    1.14, N 22 and differ in overall E (lead tip to lead tip): U01 21.06, U03
    21.11 mm.
datasheet_revision: "1.10, 2025-10-13"
datasheet_url: "https://www.infineon.com/assets/row/public/documents/60/49/infineon-imcq120r078m2h-datasheet-en.pdf"

ratings:
  source: "Datasheet Table 2 (Maximum rated values); T_vj from Table 4"
  v_dss_V: 1200
  i_d_continuous:
    - {t_case_c: 25,  i_a: 31, basis: table}
    - {t_case_c: 100, i_a: 22, basis: table}
  i_d_pulsed_A: 110
  p_tot_W:
    - {t_case_c: 25,  p_w: 176, basis: table}
    - {t_case_c: 100, p_w: 88,  basis: table}
  t_j_max_c: 175
  t_j_overload_c: 200
  t_storage_c: {min: -55, max: 150}
  v_gs_transient_V: {min: -10, max: 25}
  v_gs_static_V:    {min: -7,  max: 23}
  e_as_mJ: 112                 # I_D = 8.9 A, V_DD = 50 V, L = 2.8 mH
  e_ar_mJ: 0.56
  t_sc_us: 2

gate:
  source: "Datasheet Table 3 and Table 4"
  v_gs_on_recommended_V:  {min: 15, max: 18}
  v_gs_off_recommended_V: {min: -5, max: 0}
  v_gs_th_V: {min: 3.5, typ: 4.2, max: 5.1, at_t_j_c: 25,
              note: "I_D = 2.8 mA, V_DS = V_GS; typ 3.2 V at T_vj = 175 degC"}
  q_g_nC: 23.2                 # V_DD = 800 V, I_D = 8.9 A, V_GS = -2/18 V
  q_gs_pl_nC: 6.1
  q_gd_nC: 4.5
  r_g_internal_ohm: 10
  r_g_ext_datasheet_ohm: 2.3
  l_sigma_nH: 15

r_ds_on:
  source: "Datasheet Table 4 (T_vj = 25/150/175 degC at V_GS = 18 V; 25 degC at V_GS = 15 V), R_DS(on) = f(T_vj) figure, I_D = 8.9 A"
  measured_at_i_d_A: 8.9
  curves:
    - v_gs_on_V: 18
      points:
        - {t_j_c: 25,  r_mohm: 78.1,  basis: table, anchor: true}
        - {t_j_c: 150, r_mohm: 159.2, basis: table, anchor: true, r_mohm_max: 205}
        - {t_j_c: 175, r_mohm: 184.8, basis: table, anchor: true}
    - v_gs_on_V: 15
      points:
        - {t_j_c: 25,  r_mohm: 97.4, basis: table, anchor: true}

capacitance:
  source: "Datasheet Table 4; f = 100 kHz, V_AC = 25 mV, V_GS = 0 V"
  at_v_ds_V: 800
  c_iss_pF: 880
  c_oss_pF: 28
  c_rss_pF: 2.4
  c_o_er_pF: 37.5
  c_o_tr_pF: 54.3
  e_oss_uJ: 12
  q_oss_nC: 43.4
  e_oss_rule: "E_oss(V) = 0.5 * c_o_er * V^2   [AN2025-10 eq. (11), rearranged]"

switching:
  source: >-
    Datasheet Table 4 (E_on/E_off/E_tot, T_vj = 25/175 degC) and Table 6
    (E_fr); current dependence from the figure "E = f(I_D), T_vj = 175 degC,
    R_G,ext = 2.3 ohm, V_DD = 800 V" (x-axis 4-18 A) — 3-point sparse read.
  v_dd_ref_V: 800
  i_d_ref_A: 8.9
  r_g_ext_ref_ohm: 2.3
  scaling:
    voltage_exponent: 1.8
    voltage_exponent_fr: 1.0
    voltage_exponent_source: >-
      2026-09-27 ASSUMPTION: the CoolSiC G2 family figure of IMCQ120R004M2H
      (E_on/E_off ~V^1.8, E_fr ~V^1.0); this part's own E = f(V_DD) figure is not digitised.
    r_g_slope_rel_on_per_ohm: 0.148
    r_g_slope_rel_off_per_ohm: 0.215
    r_g_slope_source: >-
      2026-09-27 ASSUMPTION: the relative slope of IMCQ120R004M2H's figure
      "E = f(R_G,ext)" (same G2 technology, same test circuit); this part's own figure
      is not digitised. Supersedes the proportional r_g_rule below.
    voltage_rule: "E(V_dc) = E(800 V) * (V_dc / 800)^1.0 — first-order hard-switching rule, ASSUMPTION as on IMCQ120R004M2H."
    current_rule: "Linear interpolation between the tabulated points of `curves`."
    temperature_rule: "Linear interpolation between the 25 degC and 175 degC curve sets."
    r_g_rule: "Linear in R_G,ext through the datasheet point (2.3 ohm); E_fr held at its 2.3 ohm value."
  curves:
    - v_gs_off_V: 0
      t_j_c: 175
      e_on_uJ:
        basis: figure
        tolerance_pct: 15
        points: [[4, 90], [8.9, 159], [18, 300]]
        anchor_i_d_A: 8.9
        anchor_source: "Datasheet Table 4, E_on at T_vj = 175 degC = 159 uJ"
      e_off_uJ:
        basis: figure
        tolerance_pct: 15
        points: [[4, 10], [8.9, 29], [18, 65]]
        anchor_i_d_A: 8.9
        anchor_source: "Datasheet Table 4, E_off at T_vj = 175 degC = 29 uJ"
      e_fr_uJ:
        basis: figure
        tolerance_pct: 18
        points: [[4, 5], [8.9, 16], [18, 35]]
        anchor_i_d_A: 8.9
        anchor_source: "Datasheet Table 6, E_fr at T_vj = 175 degC = 16 uJ"
    - v_gs_off_V: 0
      t_j_c: 25
      e_on_uJ:
        basis: table
        points: [[8.9, 75]]
        anchor_i_d_A: 8.9
        anchor_source: "Datasheet Table 4, E_on at T_vj = 25 degC = 75 uJ"
        shape_from: {v_gs_off_V: 0, t_j_c: 175}
      e_off_uJ:
        basis: table
        points: [[8.9, 21]]
        anchor_i_d_A: 8.9
        anchor_source: "Datasheet Table 4, E_off at T_vj = 25 degC = 21 uJ"
        shape_from: {v_gs_off_V: 0, t_j_c: 175}
      e_fr_uJ:
        basis: table
        points: [[8.9, 6]]
        anchor_i_d_A: 8.9
        anchor_source: "Datasheet Table 6, E_fr at T_vj = 25 degC = 6 uJ"
        shape_from: {v_gs_off_V: 0, t_j_c: 175}
    - v_gs_off_V: -5
      t_j_c: 175
      e_on_uJ:
        basis: figure
        tolerance_pct: 15
        points: [[4, 80], [8.9, 150], [18, 280]]
        anchor_i_d_A: 8.9
        anchor_source: "Datasheet Table 4, E_on at -5 V, T_vj = 175 degC = 150 uJ"
      e_off_uJ:
        basis: figure
        tolerance_pct: 15
        points: [[4, 4], [8.9, 12], [18, 30]]
        anchor_i_d_A: 8.9
        anchor_source: "Datasheet Table 4, E_off at -5 V, T_vj = 175 degC = 12 uJ"
      e_fr_uJ:
        basis: figure
        tolerance_pct: 18
        points: [[4, 8], [8.9, 29], [18, 60]]
        anchor_i_d_A: 8.9
        anchor_source: "Datasheet Table 6, E_fr at -5 V, T_vj = 175 degC = 29 uJ"
    - v_gs_off_V: -5
      t_j_c: 25
      e_on_uJ:
        basis: table
        points: [[8.9, 64]]
        anchor_i_d_A: 8.9
        anchor_source: "Datasheet Table 4, E_on at -5 V, T_vj = 25 degC = 64 uJ"
        shape_from: {v_gs_off_V: -5, t_j_c: 175}
      e_off_uJ:
        basis: table
        points: [[8.9, 12]]
        anchor_i_d_A: 8.9
        anchor_source: "Datasheet Table 4, E_off at -5 V, T_vj = 25 degC = 12 uJ"
        shape_from: {v_gs_off_V: -5, t_j_c: 175}
      e_fr_uJ:
        basis: table
        points: [[8.9, 9]]
        anchor_i_d_A: 8.9
        anchor_source: "Datasheet Table 6, E_fr at -5 V, T_vj = 25 degC = 9 uJ"
        shape_from: {v_gs_off_V: -5, t_j_c: 175}
  times_ns:
    source: "Datasheet Table 4, V_DD = 800 V, I_D = 8.9 A, V_GS = 0/18 V, R_G,ext = 2.3 ohm"
    t_d_on:  {t_j_25: 5,    t_j_175: 4.1}
