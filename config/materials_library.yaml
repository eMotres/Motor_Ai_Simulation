    grade: N45EH
    # Maximum working temperature of the EH class (2026-09-15, user):
    # the grade letter is the class -- SH 150, UH 180, EH 200, AH 220 --
    # and it is NOT this card's `temperature_c`, which is only the
    # temperature the card was measured at.
    max_working_temp_c: 200   # degC
    temperature_c: 150   # T_ref of this card — see the section header
    # Generic N45EH datasheet values (added 2026-09-08 on request, to compare with the
    # N52UH the machine is drawn with): Br 1.35 T and Hcj 2400 kA/m at 20 °C,
    # alpha(Br) = -0.115 %/K, beta(Hcj) = -0.45 %/K, both linear from 20 °C.
    # At 150 °C: Br = 1.148 T, Hcj = 996 kA/m (12.5 kOe); the
    # intrinsic curve collapses over ~4 % of Hcj around 0.88*Hcj (tanh knee).
    # The FIELDS below are those same two coefficients RE-REFERENCED to this
    # card's 150 C (see the section header): alpha = -0.115/0.8505 = -0.1352,
    # beta = -0.45/0.415 = -1.0843 %/K.  Handing the raw 20 C numbers to a
    # 150 C card is the error the header warns about — it would put Hcj(180 C)
    # at 861 kA/m against this library's own N45EH_180C value of 672.
    alpha_br_pct_per_k: -0.1352    # %/K  (Br)
    beta_hcj_pct_per_k: -1.0843    # %/K  (Hcj / knee field)
    Br: 1.148          # T — remanence at H=0, 150 °C
    # Recoil permeability of sintered NdFeB ~1.05; the FEM magnet region uses it as
    # mu_r, and the normal coercivity follows as Hc = Br/(mu0*mu_rec) (same convention
    # as F45SH_120C).  The demag knee lives in bh_curve below.
    Hc: 870180         # A/m — normal coercivity = Br / (mu0 * mu_rec)
    mu_rec: 1.050      # relative recoil permeability (sintered NdFeB)
    sigma: 6.25e5      # S/m — sintered NdFeB, rho ~1.6 uOhm*m (EH grades 1.4–1.6)
    density: 7550      # kg/m3 — Dy-rich EH grade (7.5–7.6)
    # --- mechanical (same handbook values as the other sintered NdFeB cards) ---
    youngs_modulus_gpa: 160        # GPa  sintered NdFeB, handbook value
    poisson_ratio: 0.24            # -    sintered NdFeB, handbook value
    cte_ppm_k_1: 5.0    # ppm/K  PARALLEL to the magnetisation
    cte_ppm_k_2: -1.5   # ppm/K  PERPENDICULAR to it - sintered NdFeB CONTRACTS across the alignment axis
    tensile_strength_mpa: 80       # MPa  sintered NdFeB, handbook value (75-90 MPa)
    compressive_strength_mpa: 1000 # MPa  sintered NdFeB, handbook value (~1000-1100 MPa)
    thermal_conductivity: 7.6
    specific_heat: 460
    # 2nd-quadrant B(H) at 150 °C, most negative H first; point[1] = the B~0 crossing
