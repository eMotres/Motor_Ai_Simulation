      - [22.2, 75, 19.772, 1.16, 19.772, 0.63, 3.34]
      - [22.2, 75, 30.48, 2.39, 30.48, 1.07, 4.43]
      - [22.2, 75, 43.001, 4.28, 43.001, 1.7, 5.57]
      - [22.2, 75, 58.222, 7.23, 58.222, 2.63, 6.8]
