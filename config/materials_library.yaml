  Steel_42CrMo4_QT:
    # -- provenance (independent-source audit 2026-09-29; envelope rule:
    # a field with no prov entry is `datasheet` from sources[0]) --
    sources:
      - {"id": "dew_42crmo4", "doc": "Deutsche Edelstahlwerke / Swiss Steel Group, 1.7225/1.7227 42CrMo4 material data sheet (physical properties: 7.72 kg/dm3, E 210 GPa, 0.19 Ohm mm2/m, 42.6 W/mK, 470 J/kgK, 11.1e-6/K 20-100 C)", "url": "https://swisssteel-group.com/en/services/download-center/1-7225-1-7227-42crmo4-42crmos4-werkstoffdatenblatt", "read": "2026-09-29"}
      - {"id": "en10083_3", "doc": "EN 10083-3 quenched-and-tempered minimum proof strength by ruling section (as tabulated in the DEW data sheets): 42CrMo4 16<d<=40 mm Rp0.2 >= 750 MPa; 34CrNiMo6 16<d<=40 mm >= 900 MPa", "read": "2026-09-29"}
      - {"id": "en1993", "doc": "EN 1993-1-1 section 3.2.6: design values for structural steel E = 210 GPa, nu = 0.3", "read": "2026-09-29"}
    prov:
      yield_strength_mpa: {"type": "datasheet", "src": "en10083_3", "note": "ruling section 16 < d <= 40 mm: >= 750 MPa (a thicker bar is lower: 40-100 mm 650)"}
      poisson_ratio: {"type": "datasheet", "src": "en1993", "note": "0.3"}
      bh_curve: {"type": "estimate", "note": "generic QT low-alloy curve, no published source found; measure the bar (ring test, IEC 60404-4) or obtain a mill curve", "verify": true, "source": "none"}
      stacking_factor: {"type": "estimate", "note": "1.0 by definition for a solid part"}
    description: "42CrMo4 / AISI 4140, quenched and tempered — solid alloy-steel shaft"
    form: solid          # one piece of quenched-and-tempered alloy steel — a shaft, not a stack
    # SOLID and MAGNETIC: assigned to the shaft, the FEM gives it this B-H curve
    # (the shaft joins the rotor flux path) and solves its eddy current with
    # sigma — unlike the aluminium it replaces, which is non-magnetic and
    # 6x more conductive.  Added 2026-09-08 on request (shaft material study).
    sigma: 5263158.0   # S/m  (rho ~ 0.23 uOhm.m at 20 C, QT alloy steel)
    density: 7720
    thermal_conductivity: 42.6
    specific_heat: 470
    stacking_factor: 1.0
    # --- mechanical (rotor structural solve) ---
    youngs_modulus_gpa: 210
    poisson_ratio: 0.30
    cte_ppm_k: 11.1   # ppm/K  DEW data sheet, 20-100 C
    yield_strength_mpa: 750   # MPa  Rp0.2, QT; 650 (D 40-100 mm) ... 900 (D <= 16 mm) by section — 750 typical for a 60 mm shaft
    # No lamination and no Bertotti fit: the shaft's loss is the SOLVED eddy
    # current (sigma above); hysteresis in a solid shaft under the slot
    # harmonics is not modelled.  Coefficients zero on purpose.
    core_loss_model: bertotti
    core_loss_kh: 0.0
    core_loss_kc: 0.0
    core_loss_ke: 0.0
    core_loss_curve_unit: w_per_kg
    # B-H magnetisation curve of a QT low-alloy steel [H (A/m), B (T)] — typical published curve (mu_r max ~ 700, 1.5 T at 5 kA/m, saturation ~2.1 T); replace with a measured one when the bar is bought
    bh_curve:
      - [      0, 0.00]
      - [    200, 0.25]
      - [    400, 0.55]
      - [    600, 0.80]
      - [    800, 0.95]
      - [   1000, 1.05]
      - [   1500, 1.20]
      - [   2000, 1.30]
      - [   3000, 1.40]
      - [   5000, 1.50]
      - [   8000, 1.58]
      - [  12000, 1.66]
      - [  20000, 1.75]
      - [  35000, 1.85]
      - [  60000, 1.94]
      - [ 100000, 2.02]
      - [ 160000, 2.10]
      - [ 250000, 2.18]

