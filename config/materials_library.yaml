  Titanium_Ti6Al4V:
    description: "Titanium Ti-6Al-4V (grade 5, NON-magnetic) — motor shaft; lowest eddy loss of the common shaft alloys, high strength, low k"
    sigma: 580000      # S/m at 20 °C  (resistivity 1.72 µΩ·m)
    density: 4430      # kg/m³
    youngs_modulus_gpa: 114        # GPa
    poisson_ratio: 0.34            # -
    cte_ppm_k: 8.6    # ppm/K
    yield_strength_mpa: 880        # MPa  annealed, 0.2 % proof
    thermal_conductivity: 6.7   # W/(m·K)
    specific_heat: 526          # J/(kg·K)
    permeability: 1.00005
    wire_type: rectangular
