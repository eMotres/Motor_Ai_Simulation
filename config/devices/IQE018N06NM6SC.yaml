  lib_sha256: 329e8eaf97ba8e682ba316e3a2bd402cc737f01cd7f505787bcc920fca0e20d8
  lib_file: OptiMOS6_60V_Spice.lib
  subckt: IQE018N06NM6SC
  simulator: ngspice (cli) /usr/bin/ngspice, ngbehavior=psa
  circuit: 'datasheet Fig. F double pulse: DUT low side, identical high side freewheeling in its body
    diode, L_sigma split 1/2 + 1/2, L3 model, case pins held at T_j, junction on the model''s own thermal
    network (rise < 1 K over the pulses)'
  switched_current: I_off = I_on = the load current in the gap (freewheel current averaged over its last
    150 ns)
  windows: 'E_off/E_on: datasheet Fig. C (10 % V_DS to 10 % I_D / 10 % I_D to 10 % V_DS); E_fr: freewheeling
    device V*I over t_fr of Fig. B (zero crossing to 10 % I_frm)'
  generated: '2026-10-05'
  note: 'THE switching basis of this device (owner 2026-09-27: every motor on SPICE, uniformly); the datasheet
