    sources:
      - {"id": "fibre_ds", "doc": "Fibre manufacturer data sheets (Toray T800S, Toray M40X / M55J, Hexcel HexTow HM63) for the fibre properties the laminate values are derived from - NOT re-read in this audit", "read": "2026-09-29"}
