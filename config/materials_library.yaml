    # rescaled by that card's own coefficients over 130 K — no new source:
    #   Br   = 1.22 · (1 − 0.1311 %/K · (20 − 150) K) = 1.4279 T
    #   Hc   = Br / (mu0 · mu_rec)                    = 1082196 A/m  (normal coercivity of the linear model)
    #   knee = −730 kA/m · (1 − 1.1644 %/K · (20 − 150) K) = -1835 kA/m  (intrinsic, Hcj)
    # At 20 °C the intrinsic knee lies BEYOND the normal coercivity, so the 2nd-
    # quadrant curve is a straight line all the way to B = 0 and the knee sits
    # in the 3rd quadrant — a cold UH magnet cannot be demagnetised by the
    # machine's own field; the curve carries the knee there for completeness.
