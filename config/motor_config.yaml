    unit: mm
    type: float
    min: 1
    max: 50
    step: 0.2
    group: slot
    description: The thickness of the jumper between air and gap
  insulation_thickness:
    label: Insulation Thickness
    unit: mm
    type: float
    min: 0.05
    max: 1
    step: 0.05
    group: slot
