services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8013:8013"
    volumes:
      - ./config:/app/config:ro
      - cadquery_cache:/app/cadquery_cache
      - stl_output:/app/stl_output
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cadquery_cache:
  stl_output:
