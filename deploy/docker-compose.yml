# motor_ai_sim — one node (Hetzner AX42), four long-running services (deploy stage 2, docs/DEPLOY_STAGE2.md):
#
#   web         nginx: the static pages + the reverse proxy.  Sends the compute routes to `worker` and everything else
#               to the ACTIVE API colour (the upstream is a host file, see deploy/bluegreen.sh).
#   api-blue    the web-facing API (MOTRES_ROLE=api).  Two instances of ONE image; only one is in the nginx upstream, the
#   api-green   other is stopped - except while an update switches over (start the idle colour, warm it up, switch nginx,
#               drain the old one, stop it).  Restarting or switching the API never touches a running computation.
#   worker      the compute process (MOTRES_ROLE=worker): the job queue, the FEM solves, the optimizer campaigns, the live
#               workbench state.  Restarted only when idle (drain, wait, restart) and only when its own code changed.
#
# OPERATE IT THROUGH THE SCRIPTS, NOT BY HAND.  deploy/bluegreen.sh keeps /srv/motres/run/state.env (which colour is
# active, which image each service runs) and exports it to compose; a bare `docker compose up -d` would start from the
# `latest` defaults below.  That is why api-blue / api-green / worker sit behind the `stack` profile: a bare `up -d`
# starts only `web` and cannot restart a computation.  Name a service explicitly to start it:
#
#   bash deploy/bluegreen.sh state                # what runs, which colour is live
#   bash deploy/deploy_module.sh <SHA> <PREV> <web|api|worker|back|full> [MODULES]
#   bash deploy/cutover_stage2.sh --check|--go    # the one-time move from the single `api` service (stage 1)
#
# THREE env sources, on purpose:
#   /etc/motres/api.env   root:root 0600 — RUNTIME secrets and the four roots.  Never in the repo, never in an image layer.
#                         Read by api-blue, api-green and worker alike (same identity, same stores).
#   deploy/.env           BUILD-time interpolation only.  The frontend bakes VITE_GOOGLE_CLIENT_ID into its bundle, so that
#                         value has to exist at `docker build` time; an OAuth client id is public by design.
#   /srv/motres/run/state.env   written by deploy/bluegreen.sh: BLUE_SHA / GREEN_SHA / WORKER_SHA (the image tag each
#                         service runs) and ACTIVE.  Exported by the scripts before they call compose.
#
# STATE lives on the host under /srv/motres, NOT in a named volume:
#
#   /srv/motres/shared       the catalog + libraries   -> written only by a verified admin (see the mount comment below)
#   /srv/motres/published    community publishes       -> rw
#   /srv/motres/workspaces   one folder per account    -> rw
#   /srv/motres/identity     users.json .auth_secret .sessions.json -> rw
#   /srv/motres/web          published builds + upstream/api.conf (the active API colour)  -> web: ro
#   /srv/motres/run          state.env of the blue-green deploy (host only, not mounted)
#
#   sudo mkdir -p /srv/motres/{shared,published,workspaces,identity,run,web/upstream}
#   sudo chown -R 10001:10001 /srv/motres      # the image's `motres` user
#
# Files two processes may write at the same moment (users.json, .sessions.json, the catalog and presets ...) are guarded
# by a cross-process lock (motor_ai_sim/file_lock.py); the in-memory workbench state is invalidated across processes by
# a per-workspace epoch file (motor_ai_sim/state_epoch.py).  Both are on whenever MOTRES_ROLE is api or worker.

# What the three application services share: one image, the same env file, the same state on disk.
x-app-common: &app-common
  restart: unless-stopped
  pull_policy: never            # the image is built by the deploy script (docker compose build api-image), never pulled
  # THE env contract.  Documented in deploy/README.md; the file itself is
  # scripts/api.env.example with the values a server needs.
  env_file:
    - /etc/motres/api.env
  volumes:
    # The API can write curated motor definitions/results only when the
    # request context is a verified signed-in admin. Ordinary accounts still
    # resolve writes to their own workspace; solver/runtime config is not in
    # this mount's write path.
    - /srv/motres/shared:/srv/motres/shared
    - /srv/motres/published:/srv/motres/published
    - /srv/motres/workspaces:/srv/motres/workspaces
    # identity/ is also the PROCESS config directory (see README, "the
    # identity trap"): users.json, .auth_secret and .sessions.json resolve
    # from MOTOR_AI_SIM_CONFIG's folder.
    - /srv/motres/identity:/srv/motres/identity
    - /srv/motres/logs:/app/logs
    # The private data checkout (eMotres/motor-ai-sim-private), READ-ONLY.  k_end is the mean turn of the die's own CAD
    # coil (coil_build.py): its reference profile is found at /srv/motres/private_assets/cad/reference
    # (cad/store.py, candidate 5).  Without this mount every die's coil is the "estimated (no CAD profile)" one.
    - /srv/motres/private_assets:/srv/motres/private_assets:ro
  # gmsh/OCP are happy with the default; PARDISO likes a real /dev/shm.
  shm_size: 2g

# The fences of the two web-facing API instances.  Light work now (the solves moved to the worker): a quota of 3
# threads on the four the box keeps for itself, the same low scheduler weight against the ERP as the solver has, and a
# memory ceiling of 5 GB each - both colours exist only while an update switches over, so the box's worst case is the
# worker's 36 GB + 2 x 5 GB = 46 GB of the 64 (stage 1: 40 GB for the one process).
x-api-fence: &api-fence
  cpuset: "12-15"
  cpus: 3
  mem_limit: 5g
  cpu_shares: 512
  stop_grace_period: 30s

services:

  # ── one-shot: build the three-layer tree from a copy of config/ ───────────
  # Explicit, idempotent, dry-run-by-default — NOT the old "the image's config/
  # seed is copied into an EMPTY volume on first start" trap, which silently
  # did nothing the second time and left a server with no catalog.
  #
  #   # dry run (prints the plan, writes nothing):
  #   docker compose -f deploy/docker-compose.yml run --rm motres-seed
  #   # for real:
  #   docker compose -f deploy/docker-compose.yml run --rm motres-seed \
  #       python scripts/migrate_to_workspaces.py \
  #         --from /seed-src --to /srv/motres --owner "$OWNER_EMAIL" --apply \
  #         --manifest /srv/motres/.seed_manifest.json
  #
  # /seed-src is a COPY of the Windows box's config/, rsync'd to the server
  # (SEED_SRC in deploy/.env).  Mounted read-only: the script only ever reads
  # its source, and the mount makes that a property of the deployment rather
  # than a promise in a docstring.
  motres-seed:
    profiles: ["seed"]
    image: deploy-api:${BUILD_SHA:-latest}
    pull_policy: never
    user: "10001:10001"
    volumes:
      - ${SEED_SRC:-/srv/motres/seed-src}:/seed-src:ro
      - /srv/motres/shared:/srv/motres/shared
      - /srv/motres/published:/srv/motres/published
      - /srv/motres/workspaces:/srv/motres/workspaces
      - /srv/motres/identity:/srv/motres/identity
    command:
      - python
      - scripts/migrate_to_workspaces.py
      - --from=/seed-src
      - --to=/srv/motres
      - --owner=${ADMIN_EMAILS:-vadim@motresres.com}
      - --manifest=/srv/motres/.seed_manifest.json
    restart: "no"

  # ── build-only: the ONE image the three application services run ──────────
  #   BUILD_SHA=<sha> docker compose build api-image      ->  deploy-api:<sha>
  # Never started (profile `build`).  api-blue / api-green / worker take the tag they run from state.env.
  api-image:
    profiles: ["build"]
    image: deploy-api:${BUILD_SHA:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: api
      # OUR server builds WITH the optional pypardiso/Intel MKL accelerator
      # (#40, 2026-09-29) for the fast sparse solver.  The Dockerfile default
      # stays 0 for the distributed open-source image; override here only with
      # WITH_PARDISO=0 in deploy/.env.  The default mesher is netgen
      # (in-process, LGPL); gmsh runs only in its worker process; Triangle was
      # removed on 2026-10-03 (docs/MESHER_TRANSITION.md).
      args:
        WITH_PARDISO: ${WITH_PARDISO:-1}

  # ── the web-facing API, two colours ────────────────────────────────────────
  api-blue:
    <<: [*app-common, *api-fence]
    profiles: ["stack"]
    image: deploy-api:${BLUE_SHA:-latest}
    environment:
      MOTRES_ROLE: api
      MOTRES_INSTANCE: blue
      MOTRES_BUILD_ID: ${BLUE_SHA:-dev}
      MOTRES_WORKER_URL: http://worker:8002
      # Admin -> Servers: which containers are "the app" and which one runs the job queue (the worker).
      CLUSTER_APP_CONTAINERS: deploy-api-blue-1,deploy-api-green-1,deploy-worker-1,deploy-web-1
      CLUSTER_JOB_CONTAINER: deploy-worker-1

  api-green:
    <<: [*app-common, *api-fence]
    profiles: ["stack"]
    image: deploy-api:${GREEN_SHA:-latest}
    environment:
      MOTRES_ROLE: api
      MOTRES_INSTANCE: green
      MOTRES_BUILD_ID: ${GREEN_SHA:-dev}
      MOTRES_WORKER_URL: http://worker:8002
      CLUSTER_APP_CONTAINERS: deploy-api-blue-1,deploy-api-green-1,deploy-worker-1,deploy-web-1
      CLUSTER_JOB_CONTAINER: deploy-worker-1

  # ── the compute worker ─────────────────────────────────────────────────────
  worker:
    <<: *app-common
    profiles: ["stack"]
    image: deploy-api:${WORKER_SHA:-latest}
    command: ["python", "-m", "motor_ai_sim.worker"]
    environment:
      MOTRES_ROLE: worker
      MOTRES_INSTANCE: worker
      MOTRES_BUILD_ID: ${WORKER_SHA:-dev}
      WORKER_PORT: "8002"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    # AX42 (Ryzen 7 PRO 8700GE, 8 c / 16 t, 64 GB).  QUEUE_WORKERS=2 = cores/4
    # per §2.4; the cpuset leaves 4 threads for nginx, restic and the host.
    # Re-tune on an AX102: cpuset "0-27", QUEUE_WORKERS=4.
    #
    # THE BOX IS SHARED NOW (2026-09-16).  The ERP runs on the same node as its
    # own compose project in /srv/erp, so "the solver takes what it likes" is no
    # longer a safe default: a coupled loop that pins every thread and eats the
    # page cache is an ERP that times out while somebody is invoicing.  The
    # fences below are a CEILING and a PRIORITY, not a reservation —
    #   cpus 12      hard quota: 12 of the 16 threads, whatever the cpuset allows
    #   mem_limit    36 GB (stage 1: 40 GB) so the API's 2 x 5 GB ceiling during a
    #                switch comes out of the worker's share, not the ERP's
    #   cpu_shares   512 against the ERP's 2048, so under contention the ERP
    #                wins the scheduler and the solver simply runs slower
    # — which is the right trade: a solve that takes 10 % longer is invisible, an
    # ERP request that blocks for a minute is not.
    cpuset: "0-11"
    cpus: 12
    mem_limit: 36g
    cpu_shares: 512
    # `docker stop` of the worker waits for in-flight requests (the blocking solves) this long, then kills.  The deploy
    # script never stops a worker that has a job; this is for the unplanned stop (a host reboot).
    stop_grace_period: 120s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # same-origin default: nginx proxies /api -> the API colour / the worker
        VITE_API_URL: ""
        # BUILD-time (baked into the bundle), from deploy/.env — not from
        # /etc/motres/api.env, which is a runtime file.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in deploy/.env}
        BUILD_ID: ${BUILD_ID:-dev}
    restart: unless-stopped
    # No depends_on: the API colours are chosen by the host (upstream/api.conf) and the worker is resolved per request.
    # The nginx upstream needs the active colour to exist when THIS container starts - deploy/bluegreen.sh starts it first.
    ports:
      # host nginx + certbot terminate TLS in front and proxy to 127.0.0.1:8080
      - "127.0.0.1:8080:80"
    # published builds (deploy/deploy_module.sh): /srv/web/current is switched atomically, no container restart;
    # /srv/web/upstream/api.conf is the active API colour (deploy/bluegreen.sh), picked up by `nginx -s reload`.
    volumes:
      - /srv/motres/web:/srv/web:ro
    # nginx over a static bundle: one thread and a quarter of a gigabyte is more
    # than it has ever used, and the same 512 shares as the API keep it behind
    # the ERP under contention (see the api block above).
    cpuset: "12-13"
    cpus: 1
    mem_limit: 256m
    cpu_shares: 512
