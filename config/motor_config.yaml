  connection: 4S
  n_parallel: 1
  n_series: 4
  layers: 1
  layout: A|a|b|B|C|c|a|A|B|b|c|C|A|a|b|B|C|c|a|A|B|b|c|C
simulation:
  max_current: 35
  frequency: 2000.0
  rpm: 12000
  phase_offset_deg: 0
