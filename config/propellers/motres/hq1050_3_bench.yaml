notes:
- Measured by MOTRES on its own bench; the 10.5 in disc (266.7 mm) is the D of C_T, C_P and of the slipstream disc.
- The 2026-06-23 30-minute continuous run (3455 g, 770 W shaft, 23.7 V / 43.85 A) reports no rpm and no propeller; its thrust and shaft power fall on this curve (770 W -> 3499 g at 13 196 rpm, +1.3 % vs the logged 3455 g; the product page's 13 081 rpm is a linear interpolation of the 2026-06-16 table, not a log), so it is attributed to this propeller in the S1 bench calibration (config/propeller_s1/*/L12.json, thermal_calibration.bench).
- Against T-Motor FPV 10x5 (10X5X3, tmotor_fpv_10x5) this propeller makes 16-19 % less thrust and absorbs 23-26 % less power at the same rpm (8700-14500 rpm, same air density); at equal shaft power the thrust is within 1 %, but the speed is about 9 % higher (770 W: 13 200 vs 12 100 rpm), so the motor torque and current are about 9 % lower. They are different propellers; the bench motor ran this one.
