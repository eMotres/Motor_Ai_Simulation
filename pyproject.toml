[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electric-motor-ai-simulator"
version = "0.1.0"
description = "2-D FEM electric-motor design platform (scikit-fem + gmsh, FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "MOTRES d.o.o."}
]
keywords = ["fem", "finite-element", "electric-motor", "simulation", "design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

# Runtime deps for the FEM design platform. The authoritative, pinned list the
# deploy images install is requirements.txt; this mirrors the core for editable
# installs.  NOTE: no torch / hydra / omegaconf / tensordict — the NVIDIA Modulus
# (PINN) path was removed; the active solver is scikit-fem (CPU FEM).
# Aligned 2026-09-30 with requirements.txt (deploy/compute-worker/Dockerfile
# runtime-deps fix): this list used to miss sympy, meshio, scikit-learn,
# pillow, psutil, reportlab, python-docx, openpyxl, pyjwt, pydantic, cma,
# anthropic, mcp, cadquery-ocp and python-multipart — every one of them a
# mandatory (non-optional) entry in requirements.txt, so an editable install
# from this list alone could not even `import motor_ai_sim.simulation`
# (ModuleNotFoundError: sympy). pypardiso stays out: it is genuinely
# optional there too (requirements-pardiso.txt), which maps to the `pardiso`
# extra below.  Triangle was removed on 2026-10-03.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "shapely>=2.0",
    "scikit-fem>=10",
    "gmsh>=4.13",
    "netgen-mesher==6.2.2607",   # default CDT backend (LGPL-2.1), pinned
    "trimesh>=4.0",
    "cadquery>=2.4",
    "cadquery-ocp>=7.8",
    "argon2-cffi>=23.1",
    "mapbox-earcut>=1.0",
    "pyjwt[crypto]>=2.10",
    "anthropic>=0.40",
    "cma>=4.0",
    "sympy>=1.13",
    "meshio>=5.3",
    "scikit-learn>=1.5",
    "pillow>=10",
    "psutil>=5.9",
    "reportlab>=5.0",
    "python-docx>=1.2",
    "openpyxl>=3.1",
    "mcp>=2.2",
]

[project.optional-dependencies]
# OPTIONAL: Intel MKL PARDISO accelerator.  pypardiso is BSD-3-Clause but pulls
# proprietary Intel MKL; every solver falls back to SciPy SuperLU without it.
pardiso = [
    "pypardiso>=0.4.7,<0.5",
]
# Kept as an alias: netgen-mesher is now a core dependency (the default CDT
# backend, LGPL-2.1).  docs/MESHER_NETGEN_2026-09-30.md
netgen = [
    "netgen-mesher==6.2.2607",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
motor-sim = "motor_ai_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motor_ai_sim = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    # Real FEM solves — minutes, not milliseconds. Deselect with -m "not slow".
    "slow: physics regression cases that run the actual solver",
]
