      reference speed 200 000 r/min, limiting speed 100 000 r/min. Properties:
      stainless steel, stamped stainless steel cage, radial internal clearance
      CN, non-contact shields both sides, grease-filled, no relubrication
      feature. Logistics: net weight 0.0002 kg (not a card field here).
