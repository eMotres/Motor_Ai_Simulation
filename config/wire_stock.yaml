# Source: warehouse screenshots supplied by the owner on 2026-09-20 (Chinese
# stock system, MOCHI side).  Spec "a*b" = thickness × width in mm of the flat
# strip (our geometry: wire_height = thickness, wire_width = width).
# Insulation codes: SFT-AIW = polyamide-imide enamelled flat wire (class 200/220),
# /SB = self-bonding overcoat, /200 = 200 °C class stated on the label,
# QZYB-1-180 = polyester-imide, class 180.  Stock in kg as shown; where the
# same item code appears twice it is two lots/locations.  Entries flagged
# `check: true` had an ambiguous label (typos, missing prefix) — confirm.
#
# Later this table is meant to be replaced by a live pull from the ERP stock
# ledger (motres_erp, company MOCHI); keep the keys stable.

