# ============================================================
# Motor AI Sim - Material Library
# Every value traces to an INDEPENDENT source (manufacturer data sheet,
# standard or handbook) - rebuilt 2026-09-29, owner decision: nothing is
# taken from a commercial FEM package's material library.  Each card carries
# `sources:` and per-field `prov:` in the catalog-envelope format
# (src/motor_ai_sim/catalog/envelope.py): a field without a prov entry is
# `datasheet` from sources[0]; `verify: true` marks what still needs a
# source or a check.  Audit table: docs/materials_sources_2026-09-29.md.
# Units:
#   sigma            : S/m
#   density          : kg/m³
#   thermal_conductivity : W/(m·K)
#   specific_heat    : J/(kg·K)
#   B                : T
#   H                : A/m
#   core_loss_kh     : W/(m³·Hz·T²)   [Bertotti hysteresis coeff]
#   core_loss_kc     : W/(m³·Hz²·T²)  [classical eddy-current coeff]
#   core_loss_ke     : W/(m³·Hz^1.5·T^1.5) [excess eddy-current coeff]
#   core_loss curves : [[B_T, P]] where P is in coreloss_unit
# ============================================================

# ── ELECTRICAL STEELS (stator / rotor core) ─────────────────

steel:

  Somaloy_700HR_5P:
    # -- provenance (independent-source audit 2026-09-29; envelope rule:
    # a field with no prov entry is `datasheet` from sources[0]) --
    sources:
      - {"id": "hoganas_5p", "doc": "Hoganas, Somaloy 5P Material data, 2274HOG-3 (c) 2025, p.5 'Somaloy 700HR 5P 800 MPa'", "url": "https://www.hoganas.com/globalassets/downloads/libary/somaloy_somaloy-5p-material-data_2274hog.pdf", "page": 5, "rev": "2274HOG-3", "read": "2026-09-29"}
      - {"id": "hoganas_fit", "doc": "Hoganas curve-fitting workbook 'Somaloy 5P 700HR_800MPa_SAY-CurveFitting.xlsx' (sheet Tabelle1: B-H and P(B) at 50/300/400/600/1000/2000 Hz)", "file": "Downloads/Somaloy_Somaloy 5P 700HR_800MPa_SAY-CurveFitting.xlsx", "read": "2026-09-29"}
    prov:
      sigma: {"type": "estimate", "note": "0 is a modelling convention: the SMC bulk eddy term is inside the manufacturer loss data (Kep*d^2 term, p.5); datasheet resistivity 700 uOhm m (sigma 1.43e3 S/m) recorded here, not used"}
      specific_heat: {"type": "estimate", "note": "not published by Hoganas; left null", "verify": true, "source": "none"}
      stacking_factor: {"type": "estimate", "note": "1.0 by definition for a pressed isotropic compact"}
      core_loss_curves: {"type": "datasheet", "src": "hoganas_fit", "note": "Hoganas curve-fitting workbook; agrees with the p.5 table (1 T: 3.2 W/kg at 50 Hz, 92 at 1 kHz, 241 at 2 kHz)"}
      core_loss_kh: {"type": "derived", "src": "hoganas_fit", "note": "least-squares Bertotti fit of the curves (materials.fit_bertotti_from_curves); replaces the Maxwell-fitted coefficients"}
      core_loss_kc: {"type": "derived", "src": "hoganas_fit", "note": "as core_loss_kh"}
      core_loss_ke: {"type": "derived", "src": "hoganas_fit", "note": "as core_loss_kh"}
    description: "Soft Magnetic Composite (SMC) powder core — Höganäs Somaloy 700 HR 5P"
    form: solid          # not laminated — isotropic SMC
    sigma: 0             # effectively insulating between particles
    density: 7500
    # --- mechanical (added 2026-09-05 for the rotor structural solve) ---
    # SMC is a pressed powder compact, not a rolled sheet: stiff, but far weaker
    # than a lamination and BRITTLE.  The data sheets quote a transverse rupture
    # strength (TRS), not a yield, so TRS is what the safety factor is taken on.
    youngs_modulus_gpa: 150   # GPa  Hoganas 2274HOG-3 p.5
    poisson_ratio: 0.23   # -    Hoganas 2274HOG-3 p.5
    cte_ppm_k: 11.0   # ppm/K  Hoganas 2274HOG-3 p.5
    yield_strength_mpa: 60   # MPa  = transverse rupture strength, Hoganas p.5 (tensile is only 20)
    thermal_conductivity: 21
    specific_heat: null
    stacking_factor: 1.0
    # Bertotti core-loss coefficients (fallback outside the curves; fitted from them)
    core_loss_model: bertotti
    core_loss_kh: 479.606487   # derived: Bertotti fit of this card's curves (fit_bertotti_from_curves)
    core_loss_kc: 0.168030874   # derived: Bertotti fit of this card's curves (fit_bertotti_from_curves)
    core_loss_ke: 1.5068649   # derived: Bertotti fit of this card's curves (fit_bertotti_from_curves)
    core_loss_curve_unit: w_per_kg
    # B-H magnetisation curve  [H (A/m), B (T)]
    bh_curve:
      - [0, 0.00]
      - [63, 0.03]
      - [119, 0.06]
      - [214, 0.14]
      - [306, 0.21]
      - [608, 0.45]
      - [899, 0.65]
      - [1344, 0.86]
      - [1996, 1.05]
      - [3285, 1.24]
      - [6377, 1.43]
      - [13228, 1.63]
      - [27279, 1.84]
      - [49771, 1.99]
      - [74771, 2.08]
      - [99771, 2.14]
      - [124771, 2.19]
      - [149771, 2.23]
      - [189771, 2.30]
      - [229771, 2.36]
      - [279771, 2.44]
      - [304771, 2.47]
    # Core-loss multi-frequency curves  [[B_T, P_w_per_kg], ...]
    core_loss_curves:
      50Hz:
        - [0.049, 0.0454]
        - [0.100, 0.1041]
