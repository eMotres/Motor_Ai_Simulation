[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electric-motor-ai-simulator"
version = "0.1.0"
description = "2-D FEM electric-motor design platform (scikit-fem + gmsh, FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Motor AI Team"}
]
keywords = ["fem", "finite-element", "electric-motor", "simulation", "design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

# Runtime deps for the FEM design platform. The authoritative, pinned list the
# Cloud Run image installs is requirements.txt; this mirrors the core for editable
# installs.  NOTE: no torch / hydra / omegaconf / tensordict — the NVIDIA Modulus
# (PINN) path was removed; the active solver is scikit-fem (CPU FEM).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "shapely>=2.0",
    "scikit-fem>=10",
    "gmsh>=4.13",
    "trimesh>=4.0",
    "cadquery>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
motor-sim = "motor_ai_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motor_ai_sim = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
