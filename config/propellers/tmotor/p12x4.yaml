notes:
- Torque, thrust, rpm, current and voltage are published for the MN2806 test (KV400 at about 23 V, KV650 at about
  15.4 V); torque has 2 decimals (0.01 N*m), so rows below 0.05 N*m are not used for the C_P fit.
- '''Power'' in T-Motor tables is electrical input power of motor+ESC; shaft power here comes from the published
  torque (tau*omega), and is 63-78 % of the electrical power on these rows (overall motor+ESC+rig efficiency).'
- Older T-Motor tables (MN3110, MN3508, MN3510, MN4010, U3) list a '12*4CF' prop with electrical power only; its
  C_T is about 10 % below this P12*4, so it is not pooled with it.
