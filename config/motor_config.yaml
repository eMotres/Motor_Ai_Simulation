geometry:
  stator_diameter: 200
  slot_height: 20.4
  core_thickness: 5.6
  num_seg: 4
  num_slots_per_segment: 6
  num_poles_per_segment: 7
  air_gap: 0.65
  tooth_width: 11.3
  tooth2_width: 5.9
  cut_width: 4.7
  insulation_thickness: 0.2
  wire_width: 7
  wire_height: 0.9
  wire_spacing_x: 0.1
  wire_spacing_y: 0.13
  num_wires_per_slot: 14
  wire_split: 1
  slot_hs: 0.2
  magnet_height: 18.7
  rotor_house_height: 1.7
  shaft_height: 3
  magnet_fill_down: 0.9
  magnet_fill_up: 0.44
  magnet_fill_radius: 4
  magnet_up_gap: 1.6
  rotor_hole: 0.84
  magnet_down_height: 3.4
  magnet_lamination: 0
  stator_fillet_r: 3.9
  stator_fillet_r1: 0.4
  rotor_fill_r: 1.3
  motor_length: 200
  stator_outer_radius: 15
  stator_inner_radius: 9.2
  num_slots: 24
  num_poles: 28
  angle_slot: 15.0
  angle_pole: 12.857142857142858
  slot_pitch: 0.5235987755982988
  pole_pitch: 0.4487989505128276
  rotor_outer_radius: 9
  rotor_inner_radius: 3.7
  slot_width: 2.3000000000000003
  shaft_diameter: 5
derived_params:
  stator_outer_radius: stator_diameter / 2
  stator_inner_radius: stator_outer_radius - core_thickness - slot_height
  rotor_outer_radius: stator_inner_radius - air_gap
  rotor_inner_radius: rotor_outer_radius - magnet_height - rotor_house_height
  num_slots: num_seg * num_slots_per_segment
  num_poles: num_seg * num_poles_per_segment
  angle_slot: 360 / num_slots
  angle_pole: 360 / num_poles
  slot_width: wire_width + 2 * wire_spacing_x + 2 * insulation_thickness
  shaft_inner_radius: rotor_inner_radius - shaft_height
geometry_schema:
  stator_diameter:
    label: Stator Diameter
    unit: mm
    type: float
    min: 20
    max: 600
    step: 1
    group: stator
    description: Outer diameter of the stator
  slot_height:
    label: Slot Height
    unit: mm
    type: float
    min: 1
    max: 100
    step: 0.1
    group: stator
    description: Height of stator slots
  core_thickness:
    label: Core Thickness
    unit: mm
    type: float
    min: 0.5
    max: 50
    step: 0.1
    group: stator
    description: Thickness of stator core (back iron)
  num_seg:
    label: Number of Segments
    unit: ''
    type: int
    min: 1
    max: 12
    step: 1
    group: segmentation
    description: Number of segments in stator
  num_slots_per_segment:
    label: Slots per Segment
    unit: ''
    type: int
    min: 4
    max: 6
    step: 2
    group: segmentation
    description: Number of slots per segment
  num_poles_per_segment:
    label: Poles per Segment
    unit: ''
    type: int
    min: 5
    max: 7
    step: 2
    group: segmentation
    description: Number of poles per segment
  air_gap:
    label: Air Gap
    unit: mm
    type: float
    min: 0.1
    max: 3
    step: 0.05
    group: stator
    description: Air gap between stator and rotor
  tooth_width:
    label: Tooth Width
    unit: mm
    type: float
    min: 1
    max: 50
    step: 0.1
    group: stator
    description: Tooth width at the stator outer radius
  tooth2_width:
    label: Tooth2 Width
    unit: mm
    type: float
    min: 1
    max: 50
    step: 0.2
    group: stator
    description: Tooth width at out side of the coils
  cut_width:
    label: Cut Width
    unit: mm
    type: float
    min: 1
    max: 50
    step: 0.2
    group: stator
    description: The thickness of the jumper between air and gap
  insulation_thickness:
    label: Insulation Thickness
    unit: mm
    type: float
    min: 0.05
    max: 1
    step: 0.05
    group: stator
    description: Insulation between stator core and slot
  wire_width:
    label: Wire Width
    unit: mm
    type: float
    min: 1
    max: 12
    step: 0.5
    group: winding
    description: Width of the wire in the slot
  wire_height:
    label: Wire Height
    unit: mm
    type: float
    min: 0.5
    max: 3
    step: 0.1
    group: winding
    description: Height of the wire in the slot
  wire_spacing_x:
    label: Wire Spacing X
    unit: mm
    type: float
    min: 0.01
    max: 0.2
    step: 0.1
    group: winding
    description: Spacing between wires in x direction
  wire_spacing_y:
    label: Wire Spacing Y
    unit: mm
    type: float
    min: 0.01
    max: 0.2
    step: 0.01
    group: winding
    description: Spacing between wires in y direction
  num_wires_per_slot:
    label: Wires per Slot
    unit: ''
    type: int
    min: 1
    max: 100
    step: 1
    group: winding
    description: Number of wires per slot
  wire_split:
    label: Wire Split
    unit: ''
    type: int
    min: 1
    max: 8
    step: 1
    group: winding
    description: Parallel insulated strips across the wire WIDTH (transposed), like
      splitting the bar in ANSYS. Cuts the width-direction eddy/proximity copper loss
      by ~N^2 (strip width = wire_width/N, still capped at 2 skin depths). 1 = solid
      bar. Field and torque unchanged.
  slot_hs:
    label: Slot Opening Height
    unit: mm
    type: float
    min: 0.01
    max: 1
    step: 0.01
    group: stator
    description: Distance from the last wire to the air gap. Useful for optimization
      but yields non-manufacturable fractional wire thicknesses, so hidden from the
      UI for now (kept in the file; not yet wired into the CadQuery geometry).
    hidden: true
  magnet_height:
    label: Magnet Height
    unit: mm
    type: float
    min: 2
    max: 50
    step: 0.1
    group: rotor
    description: Height/thickness of permanent magnets
  rotor_house_height:
    label: Rotor Housing Thickness
    unit: mm
    type: float
    min: 0.5
    max: 5
    step: 0.1
    group: rotor
    description: Thickness of rotor housing
  shaft_height:
    label: Shaft Height
    unit: mm
    type: float
    min: 0.5
    max: 5
    step: 0.5
    group: shaft
    description: Height of the shaft
  magnet_fill_down:
    label: Magnet Fill Down
    unit: ''
    type: float
    min: 0.1
    max: 1.0
    step: 0.01
    group: rotor
    description: Down fill ratio of the magnet
  magnet_fill_up:
    label: Magnet Fill Up
    unit: ''
    type: float
    min: 0.1
    max: 1.0
    step: 0.01
    group: rotor
    description: Up fill ratio of the magnet
  magnet_fill_radius:
    label: Magnet Fillet Radius
    unit: mm
    type: float
    min: 0.1
    max: 5
    step: 0.1
    group: rotor
    description: Magnet fillet radius
  magnet_up_gap:
    label: Magnet Up Gap
    unit: mm
    type: float
    min: 0.1
    max: 6
    step: 0.1
    group: rotor
    description: Magnet cut up gap
  rotor_hole:
    label: Rotor Hole
    unit: ''
    type: float
    min: 0.1
    max: 0.9
    step: 0.05
    group: rotor
    description: Rotor hole ratio
  magnet_down_height:
    label: Magnet Down Height
    unit: mm
    type: float
    min: 0.5
    max: 10
    step: 0.1
    group: rotor
    description: Magnet down height
  magnet_lamination:
    label: Magnet Lamination
    unit: mm
    type: float
    min: 0
    max: 50
    step: 0.5
    group: rotor
    description: Axial magnet slice length (along the stack); 0 = solid magnet. E.g.
      180 mm stack / 10 mm lamination = 18 insulated slices per magnet. Applied as
      the analytic eddy-loss factor k = l^2/(l^2 + w^2) on the magnet loss (axial
      cuts cannot be meshed in the 2-D cross-section). Field, torque, mass unchanged.
  stator_fillet_r:
    label: Outer Corner Fillet
    unit: mm
    type: float
    min: 0
    max: 20
    step: 0.1
    group: stator
    description: Fillet radius on the OUTER-ring corners of the stator (near the OD).
      Does NOT round the slot pocket — only the outer profile corners.
  stator_fillet_r1:
    label: Air-gap Corner Fillet
    unit: mm
    type: float
    min: 0
    max: 2
    step: 0.1
    group: stator
    description: Fillet radius on the INNER / air-gap-side corners (tooth tips, slot
      mouths near the bore). Does NOT round the deep slot pocket.
  rotor_fill_r:
    label: Rotor Corner Fillet
    unit: mm
    type: float
    min: 0
    max: 6
    step: 0.1
    group: rotor
    description: Fillet radius rounding every sharp rotor corner at the air gap
  motor_length:
    label: Motor Length
    unit: mm
    type: float
    min: 5
    max: 500
    step: 1
    group: stator
    description: Axial stack length — scales FEM torque/loss/mass + drives all 3D
      extrusion
  shaft_diameter:
    label: Shaft Diameter
    unit: mm
    type: float
    min: 5
    max: 100
    step: 1
    group: shaft
    description: Shaft diameter
parameter_groups:
  stator:
    label: Stator Parameters
    order: 1
  segmentation:
    label: Segmentation
    order: 2
  winding:
    label: Winding
    order: 3
  rotor:
    label: Rotor Parameters
    order: 4
  shaft:
    label: Shaft Parameters
    order: 5
sweep_whitelist:
- stator_fillet_r
- stator_fillet_r1
- slot_height
- core_thickness
- tooth_width
- tooth2_width
- cut_width
- wire_width
- wire_height
- num_wires_per_slot
- magnet_height
- magnet_fill_up
- magnet_fill_down
- magnet_fill_radius
- magnet_up_gap
- magnet_down_height
- rotor_fill_r
- rotor_hole
