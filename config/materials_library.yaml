# ── PERMANENT MAGNETS ────────────────────────────────────────
#
# TEMPERATURE (added 2026-09-08, phase 1 of the EM-thermal coupling).
# Every magnet card is a MEASUREMENT AT ONE TEMPERATURE.  `temperature_c` is
# that temperature — the card's REFERENCE T_ref, no longer just metadata — and
# the two coefficients below are what let the solver ask the same card for its
# properties at any other temperature:
#
#   alpha_br_pct_per_k   %/K, reversible temperature coefficient of Br
#   beta_hcj_pct_per_k   %/K, ditto of the intrinsic coercivity Hcj
#
#   Br(T)      = Br_ref      * (1 + alpha/100 * (T - T_ref))
#   H_knee(T)  = H_knee_ref  * (1 + beta /100 * (T - T_ref))
#
# and the 2nd-quadrant bh_curve is carried across through the INTRINSIC curve:
# J = B - mu0*H per point, J scaled by alpha, H scaled by beta, B' = J' + mu0*H'
# (materials.MagnetMaterial.at_temperature).  mu_rec is temperature-independent
# for sintered NdFeB and is NOT scaled; the normal coercivity Hc follows the
# card's own identity Hc = Br/(mu0*mu_rec) where the card obeys it.
#
# WHY THE NUMBERS ARE NOT THE DATASHEET'S.  A datasheet quotes alpha/beta
# relative to 20 C.  These fields are relative to the CARD's OWN T_ref, and the
# two are different numbers for the same physics:
#
#   coeff(T_ref) = coeff(20) / (1 + coeff(20)/100 * (T_ref - 20))
#
# Using the 20 C number at a 150 C reference is the mistake this comment exists
# to prevent: for N45EH it would put Hcj(180 C) at 861 kA/m where the library's
# own N45EH_180C card says 672 — a 28 % error in the demagnetisation margin.
# Each card therefore carries its own re-referenced pair, and the comment on
# each card gives the 20 C-referenced value it was derived from so it can still
# be checked against a datasheet.
#
# CONSISTENCY, ENFORCED BY tests/test_magnet_temperature.py: where the library
# holds two cards of one grade, rescaling one to the other's temperature must
# reproduce it — Br within 1 %, knee field within 5 %.  Measured 2026-09-08:
#   N52UH_100C -> 150 C : Br 1.2200 vs 1.2200 (-0.001 %), knee -730.0 vs
#                         -730.0 kA/m (+0.00 %)
#   N45EH_150C -> 180 C : Br 1.1014 vs 1.1020 (-0.05 %),  knee -606.4 vs
#                         -619.0 kA/m (-2.04 %)
# The N45EH pair is the honest check of the two: its coefficients come from the
# published datasheet slope, not from fitting the pair.
#
# LIMIT.  This is the REVERSIBLE model only — it says where the card's curve
# sits at temperature T, not what an excursion has permanently taken away
# (that is simulation/demag.py, which runs on the curve this model hands it).
# It is linear, so it is trustworthy over the grade's service range and no
# further; extrapolated far below T_ref on a card whose curve is truncated just
# past its B = 0 crossing (the F45SH/F52SH records, 8 points) the collapse
# detail is lost and the knee disagrees with the library's own sibling card by
# up to 12 % at dT = -90 K.  Interpolating between cards of one grade is the
# right move when the library has them.

magnet:

  N52UH_150C:
    description: "Arnold Magnetics N52UH — operating point 150 °C"
    # Renamed from Arnold_N52UH_150C on 2026-09-08 (one naming rule for magnets:
    # <grade>_<T>C, no maker prefix — user).  The old name still resolves
    # (materials.MATERIAL_ALIASES), so stored duties and runs keep working.
    grade: N52UH
    # Maximum working temperature of the UH class (2026-09-15, user):
    # the grade letter is the class -- SH 150, UH 180, EH 200, AH 220 --
    # and it is NOT this card's `temperature_c`, which is only the
    # temperature the card was measured at.
    max_working_temp_c: 180   # degC
    temperature_c: 150   # T_ref of this card — see the section header
    # Reversible temperature coefficients, REFERENCED TO THIS CARD'S 150 C.
    # Derived 2026-09-08 from the library's own N52UH pair (100 C / 150 C),
    # which is the only self-consistent source for them: Br 1.30 -> 1.22 and
    # knee -1155 -> -730 kA/m over 50 K.  Equivalent 20 C-referenced values are
    # alpha(20) = -0.112 %/K and beta(20) = -0.463 %/K — both inside the UH
    # datasheet band (Arnold N52UH, -0.11..-0.12 and -0.45..-0.55 %/K), which
    # is why the pair is taken as the calibration rather than a typical number.
    # Rescaling this card to 100 C returns Br 1.3000 and knee -1155.0 kA/m.
    alpha_br_pct_per_k: -0.1311    # %/K  (Br)
    beta_hcj_pct_per_k: -1.1644    # %/K  (Hcj / knee field)
    # Key scalar parameters (derived from B-H curve)
    Br: 1.22           # T — remanence at H=0
    # 2026-09-08: mu_rec was 1.349 — a SECANT through the curve's B = 0 crossing
    # (Hc 719676), not the recoil permeability.  The FEM magnet region uses mu_rec
    # as its mu_r, so the magnet was ~30 % too soft (the same fault F45SH_120C was
    # cured of).  Sintered NdFeB recoil permeability is ~1.05; the normal
    # coercivity of the linear model follows as Hc = Br/(mu0*mu_rec).  The demag
    # knee is unchanged — it lives in bh_curve below (H_knee ~ -730 kA/m).
    Hc: 924614         # A/m — normal coercivity = Br / (mu0 * mu_rec)
    mu_rec: 1.050      # relative recoil permeability (sintered NdFeB)
    sigma: 555555.6    # S/m
    density: 7500
    # --- mechanical (added 2026-09-05 for the rotor structural solve) ---
    # Sintered NdFeB is a CERAMIC-like brittle intermetallic: it never yields, it
    # cracks, and it is ~12x stronger in compression than in tension.  The rotor
    # check is therefore against the TENSILE strength, and the compressive number
    # is carried so a spoke magnet squeezed by the sleeve can be judged too.
    youngs_modulus_gpa: 160        # GPa  sintered NdFeB, handbook value
    poisson_ratio: 0.24            # -    sintered NdFeB, handbook value
    cte_ppm_k_1: 5.0    # ppm/K  PARALLEL to the magnetisation (user 2026-09-07)
    cte_ppm_k_2: -1.5   # ppm/K  PERPENDICULAR to it - sintered NdFeB CONTRACTS across the alignment axis
    tensile_strength_mpa: 80       # MPa  sintered NdFeB, handbook value (75-90 MPa)
    compressive_strength_mpa: 1000 # MPa  sintered NdFeB, handbook value (~1000-1100 MPa)
    thermal_conductivity: 7.6
    specific_heat: 460
    # Full demagnetisation B-H curve (2nd quadrant, H A/m → B T)
    # Positive direction (+X in Maxwell). For -X pole flip H sign.
    bh_curve:
      - [-731000, -0.9504]
      - [-730000, -0.6237]
      - [-725000, -0.073]
      - [-714000,  0.1043]
      - [-705000,  0.170]
      - [-696000,  0.220]
      - [-688000,  0.260]
      - [-679000,  0.280]
      - [-662000,  0.315]
      - [-636000,  0.351]
      - [-610000,  0.386]
      - [-576000,  0.433]
      - [-542000,  0.479]
      - [-507000,  0.527]
      - [-473000,  0.574]
      - [-438000,  0.621]
      - [-404000,  0.668]
      - [-370000,  0.714]
      - [-335000,  0.762]
      - [-301000,  0.809]
      - [-266000,  0.856]
      - [-232000,  0.903]
      - [-198000,  0.949]
      - [-163000,  0.997]
      - [-129000,  1.044]
      - [-95000,   1.090]
      - [-60000,   1.138]
      - [-26000,   1.184]
