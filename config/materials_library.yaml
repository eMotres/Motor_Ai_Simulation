    # -- provenance (independent-source audit 2026-09-29; envelope rule:
    # a field with no prov entry is `datasheet` from sources[0]) --
    sources:
      - {"id": "baowu_b15", "doc": "Baosteel/Baowu 'B15AHV950M Product info 2025' product introduction + 'B15AHV950M Electromagnetic curve' workbook, supplied by Dehn Technologies (Shanghai) Co., Ltd. (distributor)", "received": "2026-04-09", "rev": "2025", "read": "2026-09-29"}
