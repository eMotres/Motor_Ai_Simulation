# ============================================================
# Motor AI Sim — Bearing Library
# ============================================================
# The bearings a MACHINE is built with, and everything the SKF frictional-moment
# model needs to turn a speed and a load into watts.  A machine's bearings are
# named in its family configuration (`config/dies/<die>/<cfg>.yaml`, key
# `bearings`, written by PATCH /api/family/config/{die}/{cfg}/bearings) — this
# file is the CATALOGUE those names point at, exactly the way
# `materials_library.yaml` is the catalogue behind a steel or magnet name.
#
# SOURCES
# -------
#   * SKF, "The SKF model for calculating the frictional moment"
#     (cdn.skfmediahub.skf.com/api/public/0901d1968065e9e7) — tables 2 (rolling
#     and sliding constants, by bearing type and series) and 3 (seal constants,
#     by seal type and outside diameter).  M = M_rr + M_sl + M_seal + M_drag;
#     M_drag = 0 for grease, which is every card here that runs on grease.
#   * SKF main catalogue / super-precision catalogue for the dimensions, the
#     basic load ratings C / C0 and the speed limits.
#
# THE VALIDATED CASE (do not silently change the 61811-2RS1 card)
# ---------------------------------------------------------------
# `docs/measurements/2026-08-04_noload_decomposition_150mm.md` §4.1 fitted the
# measured free-run curve of the real 150 mm 24s/28p with the bearing torque
# PINNED to this model — nothing fitted — and the measurement returned
# 0.387 +/- 0.025 N.m against the model's 0.400 N.m for the pair of
# 61811-2RS1 at 2000 rpm.  Agreement to 3 %.  `tests/test_bearings.py` asserts
# that number, so the card below is a regression fixture as much as a catalogue
# entry.
#
# UNITS
# -----
#   d, D, B, d_m, d_s : mm            C, C0            : kN
#   nu40, nu100       : mm^2/s        n_limit_*        : rpm
#   stiffness_n_per_m : N/m           M (model output) : N.m
#   R1/R2/R3/S1/S2    : SKF's own, i.e. mm and rpm in, N.mm out
#
# "catalogue value to verify" marks a figure written from the best available
# reading of the published tables that has NOT been checked against the printed
# catalogue.  It is a real number, not a placeholder — but it is the first thing
# to check when an answer looks wrong.
# ============================================================

# ── GREASES AND OILS ────────────────────────────────────────
# Only the base-oil viscosity matters to the friction model: nu at the RUNNING
# temperature is what M_rr, Phi_ish and Phi_rs all ride on.  Two points
# (40 and 100 C, as every lubricant datasheet quotes them) fix the Walther /
# ASTM D341 log-log line, which the loader interpolates at the bearing's
# temperature.
lubricants:

  MT47:
    description: "SKF standard fill of 2RS1/2Z deep groove bearings — lithium soap, mineral base oil"
    kind: grease
    nu40: 70          # mm^2/s   catalogue value to verify
    nu100: 8.6        # mm^2/s   catalogue value to verify
    temp_range_c: [-30, 110]
    # NB at ~59 C this line gives nu = 30 mm^2/s, which is the running viscosity
    # the 2026-08-04 free-run decomposition used for the 61811-2RS1 pair.
    note: "the grease the sealed SKF bearings below are delivered with"

  LGMT_2:
    description: "SKF LGMT 2 — general purpose industrial and automotive"
    kind: grease
    nu40: 110
    nu100: 11
    temp_range_c: [-30, 120]

  LGHP_2:
    description: "SKF LGHP 2 — high performance polyurea, electric motor grease"
    kind: grease
    nu40: 96
    nu100: 10.5
    temp_range_c: [-40, 150]

  LGLT_2:
    description: "SKF LGLT 2 — low temperature, EXTREMELY high speed (spindle grease)"
    kind: grease
    nu40: 15
    nu100: 3.7
    temp_range_c: [-55, 110]
    note: "the grease super-precision spindle bearings are filled with; its thin base oil is what lets n.dm reach ~1.4e6"

  OIL_VG10:
    description: "ISO VG 10 spindle oil — the usual oil-air medium"
    kind: oil_air
    nu40: 10
    nu100: 2.6

  OIL_VG32:
    description: "ISO VG 32 spindle / hydraulic oil"
    kind: oil_air
    nu40: 32
    nu100: 5.4

# ── BEARINGS ────────────────────────────────────────────────
# `friction` carries the SKF constants that apply to THIS bearing, so a card is
# self-describing: nothing in the code picks a table row behind the card's back.
#
#   R1, S1                  radial-only forms (F_a = 0), SKF table 2:
#                             deep groove   G_rr = R1.d_m^1.96.F_r^0.54
#                                           G_sl = S1.d_m^-0.26.F_r^(5/3)
#   R1, R2, R3, S1, S2      the axial forms, SKF table 2:
#                             ang. contact  G_rr = R1.d_m^1.97.[F_r + F_g + R2.F_a]^0.54
#                                           G_sl = S1.d_m^0.26.[(F_r+F_g)^(4/3) + S2.F_a^(4/3)]
#                                           F_g  = R3.d_m^4.n^2   (ball centrifugal term)
#   K_z                     the geometry constant of Phi_rs (starvation):
#                             3.1 deep groove, 4.4 angular contact
#   mu_sl                   sliding coefficient, 0.05 for a grease-lubricated
#                           ball bearing
#   ball_density_ratio      OUR extension, not SKF's: F_g is a ball-mass term, so
#                           a Si3N4 ball (3.2 g/cm3) makes it 0.41x what a steel
#                           ball (7.85) makes it.  SKF publishes no separate R3
#                           for hybrids, so this is applied openly and reported
#                           in the result rather than folded into a constant.
#                           1.0 = steel, i.e. plain SKF.
#
# `seals` decides M_seal:
#   none          open bearing                                -> 0
#   shields       2Z / Z metal shields, they do not touch      -> 0
#   contact       2RS1 / RS1 rubber seals, BOTH seals of one bearing
#                 -> M_seal = K_S1 . d_s^beta + K_S2   [N.mm]  (SKF table 3)
#   low_friction  2RZ — a contact seal with a lighter lip; SKF gives it no row
#                 of its own here, so HALF the RS1 value is used and the result
#                 is flagged `seal_estimate: true`.
# d_s is the seal counterface diameter.  It is not published for most bearings;
# omit it and the loader takes d + 0.25(D - d), which is +/-2 mm (+/-8 % on
# M_seal) of the true value.

bearings:

  # ────────────────────────────────────────────────────────────────────────
  # THE VALIDATED CARD — 150 mm 24s/28p free-run decomposition, 2026-08-04
  # ────────────────────────────────────────────────────────────────────────
  61811-2RS1:
    description: "SKF 61811-2RS1 — deep groove, series 618 (thin section), contact seals both sides"
    type: deep_groove
    d: 55
    D: 72
    B: 9
    d_m: 63.5
    balls: steel
    seals: contact
    # SKF table 3, RS1 on deep groove ball bearings, 62 < D <= 80 mm.
    seal_ks1: 0.018
    seal_ks2: 20
    seal_beta: 2.25
    # PINNED, not derived: 59.5 mm is the counterface diameter the validated
    # decomposition used (its generic estimate d + 0.25(D-d) is 59.25).  Changing
    # it changes the number tests/test_bearings.py checks against the bench.
    seal_ds: 59.5
    default_lubricant: MT47
    n_limit_grease_rpm: 3800     # catalogue value to verify — seal-limited, not ball-limited
    n_limit_oil_air_rpm: null    # sealed for life; oil-air does not apply
    C_kn: 9.56                   # catalogue value to verify
    C0_kn: 8.15                  # catalogue value to verify
    stiffness_n_per_m: 1.0e+8     # APPROXIMATE — a thin-section deep groove under light radial load
    friction:
      # SKF table 2, series 617 / 618 / 628 / 637 / 638.
      R1: 4.7e-7
      S1: 6.50e-3
      K_z: 3.1
      mu_sl: 0.05
      ball_density_ratio: 1.0
    note: >-
      The bearings of the real 150 mm 24s/28p. Model vs measurement:
      0.400 N.m predicted for the pair at 2000 rpm, 0.387 +/- 0.025 N.m returned
      by the free-run fit (docs/measurements/2026-08-04_noload_decomposition_150mm.md).
      98 % of that torque is seal drag, so P_bearing is very nearly linear in speed.

  61811-2Z:
    description: "SKF 61811-2Z — deep groove, series 618 (thin section), metal shields both sides (the 150 mm motors, user 2026-09-08)"
    type: deep_groove
    d: 55
    D: 72
    B: 9
    d_m: 63.5
    balls: steel
    seals: shields          # 2Z shields do not touch the inner ring: M_seal = 0
    default_lubricant: MT47
    n_limit_grease_rpm: 8500     # catalogue value to verify — shields lift the seal limit of the 2RS1 (3800)
    n_limit_oil_air_rpm: null    # shielded, grease-filled
    C_kn: 9.56                   # catalogue value to verify (same rings and balls as 61811-2RS1)
    C0_kn: 8.15                  # catalogue value to verify
    stiffness_n_per_m: 1.0e+8     # APPROXIMATE — a thin-section deep groove under light radial load
    friction:
      # SKF table 2, series 617 / 618 / 628 / 637 / 638 — the rolling/sliding
      # terms are the 61811-2RS1's; only the seal drag (98 % of the 2RS1 pair's
      # measured torque) is gone.
      R1: 4.7e-7
      S1: 6.50e-3
      K_z: 3.1
      mu_sl: 0.05
      ball_density_ratio: 1.0
    note: >-
      Same rings and balls as the validated 61811-2RS1 card, with non-contact
      shields: no seal term, so the pair's torque at 2000 rpm falls from about
      0.40 N.m to the rolling + sliding share alone.  Not bench-validated.

  61814-2RS1:
    description: "SKF 61814-2RS1 — deep groove, series 618, contact seals both sides (the G2 motor)"
    type: deep_groove
    d: 70
    D: 90
    B: 10
    d_m: 80
    balls: steel
    seals: contact
    # SKF table 3, RS1 on deep groove; 80 < D <= 100 band. THE SAME CONSTANTS as
    # the verified 62 < D <= 80 row — catalogue value to verify against table 3.
    seal_ks1: 0.018
    seal_ks2: 20
    seal_beta: 2.25
    default_lubricant: MT47
    n_limit_grease_rpm: 3000     # catalogue value to verify — seal-limited
    n_limit_oil_air_rpm: null    # sealed for life
    C_kn: 11.9                   # catalogue value to verify
    C0_kn: 11.4                  # catalogue value to verify
    stiffness_n_per_m: 1.2e+8     # APPROXIMATE
    friction:
      R1: 4.7e-7
      S1: 6.50e-3
      K_z: 3.1
      mu_sl: 0.05
      ball_density_ratio: 1.0
    note: >-
      Same family and the same seal drag mechanism as the 61811 above, one size
      up. On a sealed bearing the seals are the loss: at 3000 rpm they are far
      more than the rolling term, so a speed the seal can take is the design
      question, not the load rating.

  618/8-2Z:
    description: "SKF 618/8-2Z — miniature deep groove, series 618, metal shields both sides (the 40 mm motor)"
    type: deep_groove
    d: 8
    D: 16
    B: 4
    d_m: 12
    balls: steel
    seals: shields          # 2Z shields do not touch the inner ring: M_seal = 0
    default_lubricant: MT47
    n_limit_grease_rpm: 45000    # catalogue value to verify
    n_limit_oil_air_rpm: null    # shielded, grease-filled
    C_kn: 1.33                   # catalogue value to verify
    C0_kn: 0.585                 # catalogue value to verify
    stiffness_n_per_m: 1.5e+7     # APPROXIMATE — a miniature bearing is SOFT, and on a small
                                 # machine it, not the shaft, sets the first critical speed
    friction:
      R1: 4.7e-7
      S1: 6.50e-3
      K_z: 3.1
      mu_sl: 0.05
      ball_density_ratio: 1.0
    note: >-
      Shielded, so there is no seal term at all and the whole loss is the rolling
      term: a few milliwatts. The opposite regime to the sealed cards above.

  W 638/2-2Z:
    description: "SKF W 638/2-2Z — stainless steel miniature deep groove, series 638, metal shields both sides, non-contact (skf.com)"
    type: deep_groove
    d: 2
    D: 5
    B: 2.3
    d_m: 3.5                    # not published; (d+D)/2, same convention as every other card here
    balls: steel                # stainless steel rings/balls; same density category as plain bearing steel
    seals: shields               # "Sealing: Shield on both sides / Sealing type: Non-contact" -> M_seal = 0
    default_lubricant: MT47      # page states "Lubricant: Grease"; SKF's standard 2Z fill, same as the other 2Z cards
    n_limit_grease_rpm: 100000    # SKF "Limiting speed" (mechanical). Reference (thermal) speed is 200 000 r/min — see note.
    n_limit_oil_air_rpm: null    # shielded, grease-filled; no oil-air rating published
    C_kn: 0.094                  # SKF "Basic dynamic load rating"
    C0_kn: 0.025                 # SKF "Basic static load rating"
    stiffness_n_per_m: 2.0e+6     # APPROXIMATE, NOT SKF-published (SKF does not publish bearing stiffness at
                                 # all — every stiffness_n_per_m in this file is our own estimate, see the
                                 # 618/8-2Z card). Scaled down from 618/8-2Z's 1.5e7 N/m by this bearing's
                                 # much smaller d_m/section (3.5 mm vs 12 mm); order-of-magnitude only, first
                                 # thing to check if a rotordynamics answer on this bearing looks wrong.
    friction:
      # SKF table 2, series 617 / 618 / 628 / 637 / 638 (see header note) — same
      # constants as the other 618/638-family deep groove cards in this file.
      R1: 4.7e-7
      S1: 6.50e-3
      K_z: 3.1
      mu_sl: 0.05
      ball_density_ratio: 1.0
    note: >-
      Values read from the SKF product page, 2026-09-28:
      https://www.skf.com/group/products/rolling-bearings/ball-bearings/deep-groove-ball-bearings/productid-W%20638%2F2-2Z
      -- Dimensions: bore 2 mm, OD 5 mm, width 2.3 mm. Performance: basic
      dynamic load rating 0.094 kN, basic static load rating 0.025 kN,
      reference speed 200 000 r/min, limiting speed 100 000 r/min. Properties:
      stainless steel, stamped stainless steel cage, radial internal clearance
      CN, non-contact shields both sides, grease-filled, no relubrication
      feature. Logistics: net weight 0.0002 kg (not a card field here).
      Fatigue load limit Pu is NOT published on this page for this size and is
      left OUT rather than guessed (the schema has no Pu field either — flag
      for whoever adds one). Not bench-validated; friction constants borrowed
      from the 617/618/628/637/638 family row per the file header, not
      SKF-published specifically for W 638/2-2Z.

  # ────────────────────────────────────────────────────────────────────────
  # HOLLOW-SHAFT 200 mm CANDIDATES, 20 000 - 23 000 rpm
  # Shaft bore 43, rotor seat 53 -> a 50 or 55 mm bearing bore.
  # SKF super-precision, hybrid (Si3N4 balls), 15 deg contact angle, open,
  # grease LGLT 2 or oil-air.  All five share the same friction constants:
  # SKF table 2, single-row angular contact ball bearings.
  #
  # THE ANGULAR-CONTACT CONSTANTS BELOW ARE THE TASK-SUPPLIED SET and are marked
  # to verify: R1 = 5.03e-7, R2 = 1.97, R3 = 1.90e-12, S1 = 1.30e-2, S2 = 0.68.
  # R3 is the one that matters: F_g = R3.d_m^4.n^2 is the ball centrifugal load,
  # it scales as n^2, and above ~15 000 rpm on a 60 mm d_m it DOMINATES both
  # G_rr and G_sl. If a predicted loss looks impossible, check R3 first.
  # ────────────────────────────────────────────────────────────────────────
  71910 CE/HCP4A:
    description: "SKF 71910 CE/HCP4A — super-precision angular contact 15 deg, hybrid ceramic balls, open"
    type: angular_contact
    d: 50
    D: 72
    B: 12
    d_m: 61
    contact_angle_deg: 15
    balls: ceramic
    seals: none
    default_lubricant: LGLT_2
    n_limit_grease_rpm: 21000    # catalogue value to verify (n.dm ~ 1.28e6)
    n_limit_oil_air_rpm: 32000   # catalogue value to verify (n.dm ~ 1.95e6)
    C_kn: 15.6                   # catalogue value to verify
    C0_kn: 12.7                  # catalogue value to verify
    stiffness_n_per_m: 1.5e+8     # APPROXIMATE, light preload; a preloaded PAIR is stiffer
    friction:
      R1: 5.03e-7
      R2: 1.97
      R3: 1.90e-12
      S1: 1.30e-2
      S2: 0.68
      K_z: 4.4
      mu_sl: 0.05
      ball_density_ratio: 0.408  # Si3N4 3.2 / bearing steel 7.85
    note: >-
      The smallest bore that clears a 43 mm shaft bore with a sensible wall.
      At 23 000 rpm it is ABOVE its grease limit and needs oil-air.

  71911 CE/HCP4A:
    description: "SKF 71911 CE/HCP4A — super-precision angular contact 15 deg, hybrid ceramic balls, open"
    type: angular_contact
    d: 55
    D: 80
    B: 13
    d_m: 67.5
    contact_angle_deg: 15
    balls: ceramic
    seals: none
    default_lubricant: LGLT_2
    n_limit_grease_rpm: 19000    # catalogue value to verify
    n_limit_oil_air_rpm: 29000   # catalogue value to verify
    C_kn: 18.2                   # catalogue value to verify
    C0_kn: 15.3                  # catalogue value to verify
    stiffness_n_per_m: 1.6e+8     # APPROXIMATE
    friction:
      R1: 5.03e-7
      R2: 1.97
      R3: 1.90e-12
      S1: 1.30e-2
      S2: 0.68
      K_z: 4.4
      mu_sl: 0.05
      ball_density_ratio: 0.408
    note: "Fits the 53 mm rotor seat directly. Bigger d_m than the 71910 means a larger F_g at the same rpm."

  71912 CE/HCP4A:
    description: "SKF 71912 CE/HCP4A — super-precision angular contact 15 deg, hybrid ceramic balls, open"
    type: angular_contact
    d: 60
    D: 85
    B: 13
    d_m: 72.5
    contact_angle_deg: 15
    balls: ceramic
    seals: none
    default_lubricant: LGLT_2
    n_limit_grease_rpm: 18000    # catalogue value to verify
    n_limit_oil_air_rpm: 27000   # catalogue value to verify
    C_kn: 19.5                   # catalogue value to verify
    C0_kn: 17.3                  # catalogue value to verify
    stiffness_n_per_m: 1.7e+8     # APPROXIMATE
    friction:
      R1: 5.03e-7
      R2: 1.97
      R3: 1.90e-12
      S1: 1.30e-2
      S2: 0.68
      K_z: 4.4
      mu_sl: 0.05
      ball_density_ratio: 0.408
    note: "Needs the shaft seat opened to 60 mm. Listed to show the d_m^4 price of going up a size at 23 000 rpm."

  7010 CE/HCP4A:
    description: "SKF 7010 CE/HCP4A — super-precision angular contact 15 deg, hybrid ceramic balls, open, 70-series section"
    type: angular_contact
    d: 50
    D: 80
    B: 16
    d_m: 65
    contact_angle_deg: 15
    balls: ceramic
    seals: none
    default_lubricant: LGLT_2
    n_limit_grease_rpm: 19000    # catalogue value to verify
    n_limit_oil_air_rpm: 30000   # catalogue value to verify
    C_kn: 24.2                   # catalogue value to verify
    C0_kn: 19.0                  # catalogue value to verify
    stiffness_n_per_m: 2.2e+8     # APPROXIMATE — the stiffest of the five, heavier section and bigger balls
    friction:
      R1: 5.03e-7
      R2: 1.97
      R3: 1.90e-12
      S1: 1.30e-2
      S2: 0.68
      K_z: 4.4
      mu_sl: 0.05
      ball_density_ratio: 0.408
    note: >-
      Same 50 mm bore as the 71910 in a heavier section: 55 % more load rating
      and ~45 % more stiffness, at a larger d_m and so a larger centrifugal term.

  6010-2RZ/HC5C3:
    description: "SKF 6010-2RZ/HC5C3 — hybrid DEEP GROOVE with low-friction seals; the 'does not reach the speed' comparison"
    type: deep_groove
    d: 50
    D: 80
    B: 16
    d_m: 65
    balls: ceramic
    seals: low_friction        # 2RZ: contact seal with a lighter lip -> HALF the RS1 value, flagged as an estimate
    seal_ks1: 0.018            # RS1 constants, D in the 62 < D <= 80 band
    seal_ks2: 20
    seal_beta: 2.25
    default_lubricant: LGHP_2
    n_limit_grease_rpm: 6300     # catalogue value to verify — the seals decide, not the balls
    n_limit_oil_air_rpm: null    # sealed
    C_kn: 22.9                   # catalogue value to verify
    C0_kn: 16.6                  # catalogue value to verify
    stiffness_n_per_m: 1.3e+8     # APPROXIMATE
    friction:
      R1: 4.3e-7                 # deep groove, general row — catalogue value to verify
      S1: 4.25e-3                # deep groove, general row — catalogue value to verify
      K_z: 3.1
      mu_sl: 0.05
      ball_density_ratio: 0.408
    note: >-
      Carried on purpose as the counter-example: identical envelope to the
      7010 CE/HCP4A, ceramic balls too, and it still cannot go near 23 000 rpm —
      the seals cap it at ~6 300 rpm. Compare its speed check against the
      angular-contact cards to see that the limit is a SEAL, not a ball.
