# ---------------------------------------------------------------------------
# Electrical insulators / dielectrics (slot liner + wire enamel).
# Electromagnetically inert: sigma≈0, permeability≈1 → behave like air in the
# magnetic solve.  They matter for the THERMAL model (heat path copper→iron) and
# for MASS/COST.  Values are standard handbook references at ~room temperature;
# edit per datasheet as needed.
# ---------------------------------------------------------------------------
insulator:

  polyimide:
    description: "Polyimide wire enamel (Kapton-type magnet-wire film). Thermal only; cost bundled in wire."
    sigma: 0.0
    density: 1420            # kg/m³
    thermal_conductivity: 0.12   # W/(m·K)
    specific_heat: 1100          # J/(kg·K)
    permeability: 1.0

  Nomex:
    description: "Nomex 410 aramid paper — slot liner (ground-wall insulation)."
    sigma: 0.0
    density: 880             # kg/m³  (pressed calendered aramid paper)
    thermal_conductivity: 0.14   # W/(m·K)
    specific_heat: 1200          # J/(kg·K)
    permeability: 1.0

  Al2O3:
    description: "Alumina (95% Al₂O₃) ceramic slot liner — high-temp, moderate k."
    sigma: 0.0
    density: 3800            # kg/m³
    thermal_conductivity: 24     # W/(m·K)  95 % alumina (user 2026-09-07; 96-99.5 % grades run 26-30)
    specific_heat: 880           # J/(kg·K)
    permeability: 1.0

  AlN:
    description: "Aluminium nitride ceramic slot liner — very high thermal conductivity."
    sigma: 0.0
    density: 3260            # kg/m³
    thermal_conductivity: 170    # W/(m·K)
    specific_heat: 740           # J/(kg·K)
    permeability: 1.0
  # -------------------------------------------------------------------------
  # T800_UD_60 - hoop-wound carbon-fibre retaining sleeve on the rotor OD.
  # Lives in `insulator` because that is this library's category for the
  # non-magnetic structural parts a motor carries: mu_r = 1 (it behaves as air
  # in the magnetic solve), it matters for MASS, INERTIA, HEAT and - unlike a
  # slot liner - for a small but non-zero eddy loss.
  #
  # CONDUCTIVITY, and why it is the small number.  A unidirectional CFRP is a
  # strongly anisotropic conductor: along the fibres sigma ~ 3e4 S/m, across
  # them (matrix-dominated, contact-limited) sigma ~ 50-100 S/m - two to three
  # orders of magnitude less.  The sleeve is wound HOOP, so the fibres run
  # circumferentially, while the 2-D solver's induced currents flow AXIALLY
  # (J_z), i.e. TRANSVERSE to the fibres.  The value below is therefore the
  # transverse one; using the fibre-direction 3e4 S/m would over-read the
  # sleeve eddy loss by ~300x for a current that cannot follow the fibres.
  #
  # Typical datasheet values, Toray T800S fibre in a 180 C-class epoxy at
  # Vf ~ 60 %: fibre rho 1810 kg/m3 / E 294 GPa / tensile 5880 MPa, matrix
  # rho 1200 kg/m3.  Rule-of-mixtures density 1.6*... = 1580 kg/m3; E1 and the
  # hoop tensile strength below are the usual measured UD laminate values
  # (translation efficiency ~0.72 of the rule of mixtures), not the fibre's.
  T800_UD_60:
    description: "T800 unidirectional CFRP, ~60 % fibre volume, hoop-wound rotor retaining sleeve. mu_r 1; sigma is the TRANSVERSE (across-fibre) value the axial 2-D eddy current actually sees."
    sigma: 80.0              # S/m  transverse to the fibres (along fibres ~3e4)
    density: 1580            # kg/m3  rule of mixtures, Vf 0.60
    # --- mechanical, transverse + shear (added 2026-09-05, rotor solve) ---
    # A hoop-wound UD laminate is strongly ORTHOTROPIC: the 165 GPa below is E1,
    # ALONG the fibres = the hoop direction.  Across the fibres the matrix carries
    # the load, so the RADIAL stiffness is an order of magnitude lower - which is
    # why a thicker sleeve buys less than its hoop modulus suggests, and why the
    # solver rotates this card per element instead of treating it as isotropic.
    youngs_modulus_transverse_gpa: 9.0   # GPa  E2, across the fibres (matrix-dominated)
    shear_modulus_gpa: 5.0               # GPa  G12, in-plane shear
    poisson_ratio: 0.30                  # -    nu12, major Poisson ratio
    cte_ppm_k_1: -0.5   # ppm/K  ALONG the fibres = the hoop direction; carbon contracts when heated
    cte_ppm_k_2: 30.0   # ppm/K  ACROSS them (matrix-dominated). Typical UD 60 % Vf - TO BE VERIFIED WITH THE WINDER
    thermal_conductivity: 0.8    # W/(m.K)  through-thickness (along fibres ~7)
    thermal_conductivity_axial: 7.0   # W/(m.K)  in-plane, along the fibres
    specific_heat: 900           # J/(kg.K)
    permeability: 1.0
    tensile_strength_mpa: 2500   # MPa  along the fibres = the hoop direction
    youngs_modulus_gpa: 165      # GPa  E1, along the fibres
    max_service_temp_c: 180      # degC  epoxy matrix (180 C class)

  # -------------------------------------------------------------------------
  # HIGH-MODULUS hoop-wound sleeves - added 2026-09-06.
  #
  # User: "у нас цель сделать бандаж как можно тоньше и чтобы он смог всё
  # выдержать".  A retaining band is a STIFFNESS problem before it is a strength
  # problem: the rotor grows into the sleeve, so what keeps the magnets pressed
  # on is the hoop stiffness E1 (and the interference), not the tensile margin.
  # A higher-modulus fibre therefore buys retention per millimetre of thickness -
  # at the price of a lower strain to failure, which is why every card below
  # carries that strain in its note.  Three candidates, same 60 % Vf UD epoxy
  # laminate as T800_UD_60 so they are directly comparable in the Mechanical tab.
  #
  # SOURCE: typical PUBLISHED datasheet values for the fibre in a 60 % Vf UD
  # epoxy laminate - NOT measured, NOT vendor-quoted for our winding.  They are
  # here to rank the options; before a sleeve is ordered every number must be
  # confirmed WITH THE WINDER (tow, resin, cure, actual Vf and translation
  # efficiency all move E1 and the strength by more than the gaps between these
  # three cards).
  #
  # ELECTRICAL: the sleeve's eddy loss is driven by the TRANSVERSE conductivity
  # (the 2-D solver's induced current flows axially, across the hoop fibres) -
  # see the T800 note above.  No transverse measurement exists for these, so the
  # ASSUMPTION is that transverse resistivity scales with fibre graphitisation:
  # a more graphitised (higher-modulus) fibre is a better conductor, both along
  # and, through fibre-to-fibre contact, across.  Taking T800 = 1.0 as the
  # reference, rho x0.8 (M40X), x0.6 (HM63), x0.5 (M55J), i.e. sigma = 80 / that
  # factor.  This is a scaling assumption, not a datasheet value: if the sleeve
  # eddy loss ever matters to a decision, measure it.
  #
  # THERMAL: carried over unchanged from the T800 card (same epoxy matrix,
  # same Vf) - to be verified with the laminate supplier.
  # -------------------------------------------------------------------------
  HM63_UD_60:
    description: "Hexcel HM63 unidirectional CFRP, ~60 % fibre volume, hoop-wound rotor retaining sleeve. High-modulus intermediate: E1 250 GPa at 2600 MPa hoop strength, strain to failure ~1.1 %. TYPICAL PUBLISHED VALUES - verify with the winder. sigma is the TRANSVERSE value (fibre-graphitisation scaling, rho x0.6 of T800)."
    sigma: 133.0             # S/m  transverse; = 80 / 0.6 (assumed rho scaling)
    density: 1600            # kg/m3  rule of mixtures, Vf 0.60
    youngs_modulus_gpa: 250              # GPa  E1, along the fibres = hoop
    youngs_modulus_transverse_gpa: 8.0   # GPa  E2, across the fibres
    shear_modulus_gpa: 5.0               # GPa  G12, in-plane shear
    poisson_ratio: 0.30                  # -    nu12
    cte_ppm_k_1: -0.5   # ppm/K  ALONG the fibres = the hoop direction; carbon contracts when heated
    cte_ppm_k_2: 30.0   # ppm/K  ACROSS them (matrix-dominated). Typical UD 60 % Vf - TO BE VERIFIED WITH THE WINDER
    tensile_strength_mpa: 2600   # MPa  along the fibres; strain to failure ~1.1 %
    thermal_conductivity: 0.8    # W/(m.K)  through-thickness (T800 card, unverified)
    thermal_conductivity_axial: 7.0   # W/(m.K)  in-plane (T800 card, unverified)
    specific_heat: 900           # J/(kg.K)
    permeability: 1.0
    max_service_temp_c: 180      # degC  epoxy matrix (180 C class)

  M40X_UD_60:
    description: "Toray M40X unidirectional CFRP, ~60 % fibre volume, hoop-wound rotor retaining sleeve. The TOUGH high-modulus option: E1 215 GPa at 2700 MPa, strain to failure ~1.5 % - the largest strain margin of the three. TYPICAL PUBLISHED VALUES - verify with the winder. sigma is the TRANSVERSE value (fibre-graphitisation scaling, rho x0.8 of T800)."
    sigma: 100.0             # S/m  transverse; = 80 / 0.8 (assumed rho scaling)
    density: 1590            # kg/m3  rule of mixtures, Vf 0.60
    youngs_modulus_gpa: 215              # GPa  E1, along the fibres = hoop
    youngs_modulus_transverse_gpa: 8.0   # GPa  E2, across the fibres
    shear_modulus_gpa: 5.0               # GPa  G12, in-plane shear
    poisson_ratio: 0.30                  # -    nu12
    cte_ppm_k_1: -0.5   # ppm/K  ALONG the fibres = the hoop direction; carbon contracts when heated
    cte_ppm_k_2: 30.0   # ppm/K  ACROSS them (matrix-dominated). Typical UD 60 % Vf - TO BE VERIFIED WITH THE WINDER
    tensile_strength_mpa: 2700   # MPa  along the fibres; strain to failure ~1.5 %
    thermal_conductivity: 0.8    # W/(m.K)  through-thickness (T800 card, unverified)
    thermal_conductivity_axial: 7.0   # W/(m.K)  in-plane (T800 card, unverified)
    specific_heat: 900           # J/(kg.K)
    permeability: 1.0
    max_service_temp_c: 180      # degC  epoxy matrix (180 C class)

  M55J_UD_60:
    description: "Toray M55J unidirectional CFRP, ~60 % fibre volume, hoop-wound rotor retaining sleeve. The STIFFEST option: E1 305 GPa, but only 1900 MPa and a strain to failure of ~0.8 % - it buys retention per mm and gives away burst margin. TYPICAL PUBLISHED VALUES - verify with the winder. sigma is the TRANSVERSE value (fibre-graphitisation scaling, rho x0.5 of T800)."
    sigma: 160.0             # S/m  transverse; = 80 / 0.5 (assumed rho scaling)
    density: 1650            # kg/m3  rule of mixtures, Vf 0.60
    youngs_modulus_gpa: 305              # GPa  E1, along the fibres = hoop
    youngs_modulus_transverse_gpa: 7.0   # GPa  E2, across the fibres
    shear_modulus_gpa: 4.5               # GPa  G12, in-plane shear
    poisson_ratio: 0.30                  # -    nu12
    cte_ppm_k_1: -0.5   # ppm/K  ALONG the fibres = the hoop direction; carbon contracts when heated
    cte_ppm_k_2: 30.0   # ppm/K  ACROSS them (matrix-dominated). Typical UD 60 % Vf - TO BE VERIFIED WITH THE WINDER
    tensile_strength_mpa: 1900   # MPa  along the fibres; strain to failure ~0.8 %
    thermal_conductivity: 0.8    # W/(m.K)  through-thickness (T800 card, unverified)
    thermal_conductivity_axial: 7.0   # W/(m.K)  in-plane (T800 card, unverified)
    specific_heat: 900           # J/(kg.K)
    permeability: 1.0
    max_service_temp_c: 180      # degC  epoxy matrix (180 C class)



# ---------------------------------------------------------------------------
# COOLANTS / FLUIDS — cooling-system working fluids (liquids + air).
# EM-inert (sigma≈0, mu_r≈1).  Consumed by the thermal model's cooling BC:
# the convection coefficient h(v) (air, cylinder cross-flow) and the coolant
# energy balance T_out = T_in + P/(ṁ·cp) (liquid) read rho/cp/k/nu/Pr FROM HERE
# — this YAML is the single source of truth for fluid properties.
# Properties are handbook references near operating temperature.
# ---------------------------------------------------------------------------
coolant:

  air:
    description: "Air at ~300 K — natural / forced-convection coolant (gas)."
    phase: gas
    density: 1.16                 # kg/m³
    specific_heat: 1007           # cp  J/(kg·K)
    thermal_conductivity: 0.0263  # k   W/(m·K)
    kinematic_viscosity: 1.56e-5  # nu  m²/s
    prandtl: 0.707
    sigma: 0.0
    permeability: 1.0

  water:
    description: "Liquid water — water-jacket coolant."
    phase: liquid
    density: 1000                 # kg/m³
    specific_heat: 4186           # cp  J/(kg·K)
    thermal_conductivity: 0.60    # k   W/(m·K)
    kinematic_viscosity: 1.0e-6   # nu  m²/s
    prandtl: 7.0
    sigma: 0.0
    permeability: 1.0

  water_glycol_50:
    description: "50/50 water–ethylene-glycol — anti-freeze jacket coolant."
    phase: liquid
    density: 1070                 # kg/m³
    specific_heat: 3300           # cp  J/(kg·K)
    thermal_conductivity: 0.40    # k   W/(m·K)
    kinematic_viscosity: 3.0e-6   # nu  m²/s
    prandtl: 25.0
    sigma: 0.0
    permeability: 1.0

  oil:
    description: "Transformer / cooling oil — direct-contact coolant."
    phase: liquid
    density: 860                  # kg/m³
    specific_heat: 2000           # cp  J/(kg·K)
    thermal_conductivity: 0.14    # k   W/(m·K)
    kinematic_viscosity: 4.0e-5   # nu  m²/s
    prandtl: 280.0
    sigma: 0.0
    permeability: 1.0

  ethylene_glycol:
    description: "Pure ethylene glycol — high-boiling coolant."
    phase: liquid
    density: 1110                 # kg/m³
    specific_heat: 2400           # cp  J/(kg·K)
    thermal_conductivity: 0.25    # k   W/(m·K)
    kinematic_viscosity: 1.5e-5   # nu  m²/s
    prandtl: 150.0
    sigma: 0.0
    permeability: 1.0
