    prov:
      density: {"type": "datasheet", "src": "nist_water", "note": "20 C NIST value rounded (<= 0.4 %) - kept"}
      specific_heat: {"type": "datasheet", "src": "nist_water", "note": "20 C NIST value rounded (<= 0.4 %) - kept"}
      thermal_conductivity: {"type": "datasheet", "src": "nist_water", "note": "20 C NIST value rounded (<= 0.4 %) - kept"}
      kinematic_viscosity: {"type": "datasheet", "src": "nist_water", "note": "20 C NIST value rounded (<= 0.4 %) - kept"}
      prandtl: {"type": "datasheet", "src": "nist_water", "note": "20 C NIST value rounded (<= 0.4 %) - kept"}
