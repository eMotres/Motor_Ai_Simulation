# motor_ai_sim — static frontend + API reverse proxy (one origin).
# TLS terminates in front of this (Hetzner LB, caddy, or certbot-nginx on the
# host); this server block stays plain HTTP inside the compose network.
server {
    listen 80;
    server_name _;

    # security headers (the app is same-origin; GIS needs no exceptions here)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # static frontend
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri /index.html;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API — FEM solves stream progress and can run minutes; generous timeouts.
    location /api/ {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 20m;
    }
}
