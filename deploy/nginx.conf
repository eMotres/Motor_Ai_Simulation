# motor_ai_sim — static frontend + API reverse proxy (one origin).
# TLS terminates in front of this (host nginx + certbot on the AX42); this
# server block stays plain HTTP inside the compose network.
#
# NOT behind Cloudflare's orange cloud: the free tier cuts a proxied request at
# 100 s and a Ø200 PWM transient runs 93 minutes.  DNS-only (grey cloud) is
# fine; the long solves would otherwise have to become poll-only first.

# gzip — the JSON a field view or a duty result returns is tens of MB of ASCII
# numbers and compresses ~8:1.  NOT gzip_static: the api answers are dynamic.
# Explicitly NOT compressing .npz / images / fonts (already compressed).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml
    application/json application/javascript application/xml+rss
    application/wasm image/svg+xml;

server {
    listen 80;
    server_name _;

    # security headers (the app is same-origin; GIS needs no exceptions here).
    # NB: add_header does not inherit into a location that has its own, so the
    # three are repeated in /assets/ below — without that, every hashed asset
    # was served WITHOUT them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Client IP (docs/MCP_DISCOVERY.md "Client IP").  The host nginx OVERWRITES
    # X-Real-IP with the visitor's address; accept that header only from the
    # host's way in -- this network's gateway (host nginx -> 127.0.0.1:8080 ->
    # docker-proxy) and loopback -- so the $remote_addr passed on below is the
    # visitor.  Any other peer (another container on any bridge) keeps its own
    # address.  The set_real_ip_from lines are written at container start by
    # /docker-entrypoint.d/15-realip-gateway.sh (deploy/nginx-realip-gateway.sh),
    # which reads the gateway from the routing table; 127.0.0.1 only if none.
    include /etc/nginx/realip/trusted.conf;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    # static frontend
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri /index.html;
    }
    # index.html names the hashed bundle — never let a browser keep an old one
    # (owner 2026-09-25: a deploy was invisible until Ctrl+Shift+R).  no-cache =
    # revalidate every time (a 304 when unchanged), the /assets/ stay immutable.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # API — FEM solves run minutes to hours; generous timeouts.
    location /api/ {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 3600 s: the longest single request the product makes is a Ø200 PWM
        # transient.  Progress is POLLED, not streamed, so no proxy_buffering
        # off is needed — but the solve request itself still has to survive.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 20m;
    }
    # MCP server for external AI agents (docs/MCP_2026-09-28.md).  Stateless
    # streamable HTTP with plain JSON answers — no SSE, so no buffering tweaks.
    # The API authenticates the agent key itself (McpGate), not nginx.
    # Keep the trailing-slash spelling on the MCP endpoint.  308 preserves
    # POST and its JSON-RPC body for clients that discover /mcp/.
    location = /mcp/ {
        return 308 https://aerostator.com/mcp$is_args$args;
    }
    location = /mcp {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }
    # OAuth 2.1 for MCP connectors (Stage 2): discovery documents and the
    # authorization-server endpoints live in the API.  The consent PAGE is the
    # SPA at /agent-consent (falls through to location / above).
    location /.well-known/ {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    # A real llms.txt for LLM crawlers / agents (docs/MCP_DISCOVERY.md
    # "Plain HTTP"), answered by the API ahead of the SPA fallback above
    # (which would otherwise serve index.html as text/html).
    location = /llms.txt {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /oauth/ {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }
}
