# ============================================================
# Motor AI Sim — Bearing Library
# ============================================================
# The bearings a MACHINE is built with, and everything the SKF frictional-moment
# model needs to turn a speed and a load into watts.  A machine's bearings are
# named in its family configuration (`config/dies/<die>/<cfg>.yaml`, key
# `bearings`, written by PATCH /api/family/config/{die}/{cfg}/bearings) — this
# file is the CATALOGUE those names point at, exactly the way
# `materials_library.yaml` is the catalogue behind a steel or magnet name.
#
# SOURCES
# -------
#   * SKF, "The SKF model for calculating the frictional moment"
#     (cdn.skfmediahub.skf.com/api/public/0901d1968065e9e7) — tables 2 (rolling
#     and sliding constants, by bearing type and series) and 3 (seal constants,
#     by seal type and outside diameter).  M = M_rr + M_sl + M_seal + M_drag;
#     M_drag = 0 for grease, which is every card here that runs on grease.
#   * SKF main catalogue / super-precision catalogue for the dimensions, the
#     basic load ratings C / C0 and the speed limits.
#
# THE VALIDATED CASE (do not silently change the 61811-2RS1 card)
# ---------------------------------------------------------------
# `docs/measurements/2026-08-04_noload_decomposition_150mm.md` §4.1 fitted the
# measured free-run curve of the real 150 mm 24s/28p with the bearing torque
# PINNED to this model — nothing fitted — and the measurement returned
# 0.387 +/- 0.025 N.m against the model's 0.400 N.m for the pair of
# 61811-2RS1 at 2000 rpm.  Agreement to 3 %.  `tests/test_bearings.py` asserts
# that number, so the card below is a regression fixture as much as a catalogue
# entry.
#
# UNITS
# -----
#   d, D, B, d_m, d_s : mm            C, C0            : kN
#   nu40, nu100       : mm^2/s        n_limit_*        : rpm
#   stiffness_n_per_m : N/m           M (model output) : N.m
#   R1/R2/R3/S1/S2    : SKF's own, i.e. mm and rpm in, N.mm out
#
# PROVENANCE (catalog stage 1, 2026-09-28)
# ----------------------------------------
# Every card and lubricant carries a `catalog:` block — the common card
# envelope (motor_ai_sim.catalog): manufacturer, part number, status
# (draft | active | validated | deprecated), the ids of the sources below,
# per-field provenance `prov`, validation deltas and a revision.  The loaders
# (motor_ai_sim.bearings) ignore it; the numbers stay where they always were.
#
#   prov.<field>: {type: datasheet|measured|estimate|derived, src: <id>,
#                  verify: true, note: "..."}
#   A field with no prov entry = datasheet, from the card's FIRST source.
#   Nested fields are dotted: `friction.R1`.
#
# `verify: true` (formerly the comment "catalogue value to verify") marks a
# figure written from the best available reading of the published tables that
# has NOT been checked against the printed catalogue.  It is a real number, not
# a placeholder — but it is the first thing to check when an answer looks wrong.
# `type: estimate` (formerly "APPROXIMATE") is our own number, not the maker's.
# ============================================================

catalog_units:
  d: mm
  D: mm
  B: mm
  d_m: mm
  seal_ds: mm
  contact_angle_deg: deg
  C_kn: kN
  C0_kn: kN
  n_limit_grease_rpm: rpm
  n_limit_oil_air_rpm: rpm
  stiffness_n_per_m: N/m
  nu40: mm^2/s
  nu100: mm^2/s
  temp_range_c: degC
  seal_ks1: "SKF (N.mm)"
  seal_ks2: "SKF (N.mm)"
  friction.R1: "SKF (mm, rpm -> N.mm)"
  friction.S1: "SKF (mm, rpm -> N.mm)"

catalog_sources:
  skf_friction:
    doc: "SKF, The SKF model for calculating the frictional moment"
    url: "https://cdn.skfmediahub.skf.com/api/public/0901d1968065e9e7"
    page: "tables 2 (rolling/sliding) and 3 (seals)"
  skf_catalogue:
    doc: "SKF main catalogue / super-precision catalogue (dimensions, C, C0, speed limits)"
    url: "https://www.skf.com/group/products/rolling-bearings"
  skf_w638_2_2z:
    doc: "SKF product page W 638/2-2Z"
    url: "https://www.skf.com/group/products/rolling-bearings/ball-bearings/deep-groove-ball-bearings/productid-W%20638%2F2-2Z"
    read: "2026-09-28"
  task_ac_constants:
    doc: "Angular-contact friction constants supplied with the Ø200 design task (SKF table 2 row, not yet checked against the table)"
  skf_greases:
    doc: "SKF lubricant datasheets (LGMT 2, LGHP 2, LGLT 2; MT47 standard fill)"
    url: "https://www.skf.com/group/products/lubrication-solutions/lubricants"
  iso_vg:
    doc: "ISO 3448 viscosity grades (VG 10, VG 32) — nominal kinematic viscosity at 40 C"
  noload_150mm_2026_08_04:
    doc: "Free-run decomposition of the 150 mm 24s/28p"
    file: "docs/measurements/2026-08-04_noload_decomposition_150mm.md"
    page: "§4.1"
    read: "2026-08-04"

# ── GREASES AND OILS ────────────────────────────────────────
# Only the base-oil viscosity matters to the friction model: nu at the RUNNING
# temperature is what M_rr, Phi_ish and Phi_rs all ride on.  Two points
# (40 and 100 C, as every lubricant datasheet quotes them) fix the Walther /
# ASTM D341 log-log line, which the loader interpolates at the bearing's
# temperature.
lubricants:

  MT47:
    description: "SKF standard fill of 2RS1/2Z deep groove bearings — lithium soap, mineral base oil"
    kind: grease
    nu40: 70          # mm^2/s
    nu100: 8.6        # mm^2/s
    temp_range_c: [-30, 110]
    # NB at ~59 C this line gives nu = 30 mm^2/s, which is the running viscosity
    # the 2026-08-04 free-run decomposition used for the 61811-2RS1 pair.
    note: "the grease the sealed SKF bearings below are delivered with"
    catalog:
      manufacturer: SKF
      part_number: MT47
      status: active
      sources: [skf_greases]
      prov:
        nu40: {type: datasheet, src: skf_greases, verify: true, note: "catalogue value to verify"}
        nu100: {type: datasheet, src: skf_greases, verify: true, note: "catalogue value to verify"}
      revision: {n: 1, date: "2026-09-28", by: catalog-stage-1, why: "envelope added; verify comments moved to prov"}

  LGMT_2:
    description: "SKF LGMT 2 — general purpose industrial and automotive"
    kind: grease
    nu40: 110
    nu100: 11
    temp_range_c: [-30, 120]
    catalog:
      manufacturer: SKF
      part_number: "LGMT 2"
      status: active
      sources: [skf_greases]
      revision: {n: 1, date: "2026-09-28", by: catalog-stage-1, why: "envelope added"}

  LGHP_2:
    description: "SKF LGHP 2 — high performance polyurea, electric motor grease"
    kind: grease
    nu40: 96
    nu100: 10.5
    temp_range_c: [-40, 150]
    catalog:
      manufacturer: SKF
      part_number: "LGHP 2"
      status: active
      sources: [skf_greases]
      revision: {n: 1, date: "2026-09-28", by: catalog-stage-1, why: "envelope added"}

  LGLT_2:
    description: "SKF LGLT 2 — low temperature, EXTREMELY high speed (spindle grease)"
    kind: grease
    nu40: 15
    nu100: 3.7
    temp_range_c: [-55, 110]
    note: "the grease super-precision spindle bearings are filled with; its thin base oil is what lets n.dm reach ~1.4e6"
    catalog:
      manufacturer: SKF
      part_number: "LGLT 2"
      status: active
      sources: [skf_greases]
      revision: {n: 1, date: "2026-09-28", by: catalog-stage-1, why: "envelope added"}

  OIL_VG10:
    description: "ISO VG 10 spindle oil — the usual oil-air medium"
    kind: oil_air
    nu40: 10
    nu100: 2.6
    catalog:
      manufacturer: generic
      part_number: "ISO VG 10"
      status: active
      sources: [iso_vg]
      prov:
        nu100: {type: estimate, note: "typical VG 10 mineral oil; ISO 3448 fixes only the 40 C grade"}
      revision: {n: 1, date: "2026-09-28", by: catalog-stage-1, why: "envelope added"}

  OIL_VG32:
    description: "ISO VG 32 spindle / hydraulic oil"
    kind: oil_air
    nu40: 32
    nu100: 5.4
    catalog:
      manufacturer: generic
      part_number: "ISO VG 32"
      status: active
      sources: [iso_vg]
      prov:
        nu100: {type: estimate, note: "typical VG 32 mineral oil; ISO 3448 fixes only the 40 C grade"}
      revision: {n: 1, date: "2026-09-28", by: catalog-stage-1, why: "envelope added"}

# ── BEARINGS ────────────────────────────────────────────────
# `friction` carries the SKF constants that apply to THIS bearing, so a card is
# self-describing: nothing in the code picks a table row behind the card's back.
#
#   R1, S1                  radial-only forms (F_a = 0), SKF table 2:
#                             deep groove   G_rr = R1.d_m^1.96.F_r^0.54
#                                           G_sl = S1.d_m^-0.26.F_r^(5/3)
#   R1, R2, R3, S1, S2      the axial forms, SKF table 2:
#                             ang. contact  G_rr = R1.d_m^1.97.[F_r + F_g + R2.F_a]^0.54
#                                           G_sl = S1.d_m^0.26.[(F_r+F_g)^(4/3) + S2.F_a^(4/3)]
#                                           F_g  = R3.d_m^4.n^2   (ball centrifugal term)
#   K_z                     the geometry constant of Phi_rs (starvation):
#                             3.1 deep groove, 4.4 angular contact
#   mu_sl                   sliding coefficient, 0.05 for a grease-lubricated
#                           ball bearing
#   ball_density_ratio      OUR extension, not SKF's: F_g is a ball-mass term, so
#                           a Si3N4 ball (3.2 g/cm3) makes it 0.41x what a steel
#                           ball (7.85) makes it.  SKF publishes no separate R3
#                           for hybrids, so this is applied openly and reported
#                           in the result rather than folded into a constant.
#                           1.0 = steel, i.e. plain SKF.
#
# `seals` decides M_seal:
#   none          open bearing                                -> 0
#   shields       2Z / Z metal shields, they do not touch      -> 0
#   contact       2RS1 / RS1 rubber seals, BOTH seals of one bearing
#                 -> M_seal = K_S1 . d_s^beta + K_S2   [N.mm]  (SKF table 3)
#   low_friction  2RZ — a contact seal with a lighter lip; SKF gives it no row
#                 of its own here, so HALF the RS1 value is used and the result
#                 is flagged `seal_estimate: true`.
# d_s is the seal counterface diameter.  It is not published for most bearings;
# omit it and the loader takes d + 0.25(D - d), which is +/-2 mm (+/-8 % on
# M_seal) of the true value.

bearings:

  # ────────────────────────────────────────────────────────────────────────
  # THE VALIDATED CARD — 150 mm 24s/28p free-run decomposition, 2026-08-04
  # ────────────────────────────────────────────────────────────────────────
  61811-2RS1:
    description: "SKF 61811-2RS1 — deep groove, series 618 (thin section), contact seals both sides"
    type: deep_groove
    d: 55
    D: 72
    B: 9
    d_m: 63.5
    balls: steel
    seals: contact
    # SKF table 3, RS1 on deep groove ball bearings, 62 < D <= 80 mm.
    seal_ks1: 0.018
    seal_ks2: 20
    seal_beta: 2.25
    # PINNED, not derived: 59.5 mm is the counterface diameter the validated
    # decomposition used (its generic estimate d + 0.25(D-d) is 59.25).  Changing
    # it changes the number tests/test_bearings.py checks against the bench.
    seal_ds: 59.5
    default_lubricant: MT47
    n_limit_grease_rpm: 3800
    n_limit_oil_air_rpm: null    # sealed for life; oil-air does not apply
    C_kn: 9.56
    C0_kn: 8.15
    stiffness_n_per_m: 1.0e+8
    friction:
      # SKF table 2, series 617 / 618 / 628 / 637 / 638.
      R1: 4.7e-7
      S1: 6.50e-3
      K_z: 3.1
      mu_sl: 0.05
      ball_density_ratio: 1.0
    note: >-
      The bearings of the real 150 mm 24s/28p. Model vs measurement:
      0.400 N.m predicted for the pair at 2000 rpm, 0.387 +/- 0.025 N.m returned
      by the free-run fit (docs/measurements/2026-08-04_noload_decomposition_150mm.md).
      98 % of that torque is seal drag, so P_bearing is very nearly linear in speed.
    catalog:
      manufacturer: SKF
      part_number: 61811-2RS1
      status: validated
      sources: [skf_catalogue, skf_friction, noload_150mm_2026_08_04]
      prov:
        seal_ks1: {type: datasheet, src: skf_friction, note: "SKF table 3, RS1 on deep groove, 62 < D <= 80 mm"}
        seal_ks2: {type: datasheet, src: skf_friction, note: "SKF table 3, RS1 on deep groove, 62 < D <= 80 mm"}
        seal_beta: {type: datasheet, src: skf_friction, note: "SKF table 3, RS1 on deep groove, 62 < D <= 80 mm"}
        seal_ds: {type: measured, src: noload_150mm_2026_08_04, note: "PINNED: the counterface diameter the validated decomposition used (generic d + 0.25(D-d) = 59.25)"}
        n_limit_grease_rpm: {type: datasheet, src: skf_catalogue, verify: true, note: "catalogue value to verify — seal-limited, not ball-limited"}
        C_kn: {type: datasheet, src: skf_catalogue, verify: true, note: "catalogue value to verify"}
        C0_kn: {type: datasheet, src: skf_catalogue, verify: true, note: "catalogue value to verify"}
        stiffness_n_per_m: {type: estimate, note: "APPROXIMATE — a thin-section deep groove under light radial load"}
        friction.R1: {type: datasheet, src: skf_friction, note: "SKF table 2, series 617/618/628/637/638"}
        friction.S1: {type: datasheet, src: skf_friction, note: "SKF table 2, series 617/618/628/637/638"}
        friction.K_z: {type: datasheet, src: skf_friction, note: "3.1 deep groove"}
        friction.mu_sl: {type: datasheet, src: skf_friction, note: "grease-lubricated ball bearing"}
        friction.ball_density_ratio: {type: derived, note: "1.0 = steel balls (plain SKF)"}
      validation:
        - what: "bearing torque, pair @ 2000 rpm"
          ref: 0.387
          ref_tol: 0.025
          model: 0.400
          unit: N.m
          delta_pct: 3.4
          doc: "docs/measurements/2026-08-04_noload_decomposition_150mm.md §4.1"
          pinned_by: "tests/test_bearings.py"
      revision: {n: 1, date: "2026-09-28", by: catalog-stage-1, why: "envelope added; verify/APPROXIMATE comments moved to prov"}

  61811-2Z:
    description: "SKF 61811-2Z — deep groove, series 618 (thin section), metal shields both sides (the 150 mm motors, user 2026-09-08)"
    type: deep_groove
    d: 55
    D: 72
    B: 9
    d_m: 63.5
    balls: steel
    seals: shields          # 2Z shields do not touch the inner ring: M_seal = 0
    default_lubricant: MT47
    n_limit_grease_rpm: 8500
    n_limit_oil_air_rpm: null    # shielded, grease-filled
    C_kn: 9.56
    C0_kn: 8.15
    stiffness_n_per_m: 1.0e+8
    catalog:
      manufacturer: SKF
      part_number: 61811-2Z
      status: active
      sources: [skf_catalogue, skf_friction]
      prov:
        n_limit_grease_rpm: {type: datasheet, src: skf_catalogue, verify: true, note: "catalogue value to verify — shields lift the seal limit of the 2RS1 (3800)"}
        C_kn: {type: datasheet, src: skf_catalogue, verify: true, note: "catalogue value to verify (same rings and balls as 61811-2RS1)"}
        C0_kn: {type: datasheet, src: skf_catalogue, verify: true, note: "catalogue value to verify"}
        stiffness_n_per_m: {type: estimate, note: "APPROXIMATE — a thin-section deep groove under light radial load"}
        friction.R1: {type: datasheet, src: skf_friction, note: "SKF table 2, series 617/618/628/637/638 (the 61811-2RS1's rolling/sliding terms)"}
        friction.S1: {type: datasheet, src: skf_friction, note: "SKF table 2, series 617/618/628/637/638"}
        friction.K_z: {type: datasheet, src: skf_friction, note: "3.1 deep groove"}
        friction.mu_sl: {type: datasheet, src: skf_friction, note: "grease-lubricated ball bearing"}
        friction.ball_density_ratio: {type: derived, note: "1.0 = steel balls"}
      revision: {n: 1, date: "2026-09-28", by: catalog-stage-1, why: "envelope added; verify/APPROXIMATE comments moved to prov"}
    friction:
      # SKF table 2, series 617 / 618 / 628 / 637 / 638 — the rolling/sliding
      # terms are the 61811-2RS1's; only the seal drag (98 % of the 2RS1 pair's
      # measured torque) is gone.
      R1: 4.7e-7
      S1: 6.50e-3
      K_z: 3.1
      mu_sl: 0.05
      ball_density_ratio: 1.0
    note: >-
      Same rings and balls as the validated 61811-2RS1 card, with non-contact
      shields: no seal term, so the pair's torque at 2000 rpm falls from about
      0.40 N.m to the rolling + sliding share alone.  Not bench-validated.

  61814-2RS1:
    description: "SKF 61814-2RS1 — deep groove, series 618, contact seals both sides (the G2 motor)"
    type: deep_groove
    d: 70
    D: 90
    B: 10
    d_m: 80
    balls: steel
    seals: contact
    # SKF table 3, RS1 on deep groove; 80 < D <= 100 band. THE SAME CONSTANTS as
    # the verified 62 < D <= 80 row — catalogue value to verify against table 3.
    seal_ks1: 0.018
    seal_ks2: 20
    seal_beta: 2.25
    default_lubricant: MT47
    n_limit_grease_rpm: 3000
    n_limit_oil_air_rpm: null    # sealed for life
    C_kn: 11.9
    C0_kn: 11.4
    stiffness_n_per_m: 1.2e+8
    catalog:
      manufacturer: SKF
      part_number: 61814-2RS1
      status: active
      sources: [skf_catalogue, skf_friction]
      prov:
        seal_ks1: {type: datasheet, src: skf_friction, verify: true, note: "SKF table 3, 80 < D <= 100 band: the SAME constants as the verified 62 < D <= 80 row — catalogue value to verify against table 3"}
        seal_ks2: {type: datasheet, src: skf_friction, verify: true, note: "as seal_ks1 — to verify against table 3"}
        seal_beta: {type: datasheet, src: skf_friction, verify: true, note: "as seal_ks1 — to verify against table 3"}
        n_limit_grease_rpm: {type: datasheet, src: skf_catalogue, verify: true, note: "catalogue value to verify — seal-limited"}
        C_kn: {type: datasheet, src: skf_catalogue, verify: true, note: "catalogue value to verify"}
        C0_kn: {type: datasheet, src: skf_catalogue, verify: true, note: "catalogue value to verify"}
        stiffness_n_per_m: {type: estimate, note: "APPROXIMATE"}
        friction.R1: {type: datasheet, src: skf_friction, note: "SKF table 2, series 618"}
        friction.S1: {type: datasheet, src: skf_friction, note: "SKF table 2, series 618"}
        friction.ball_density_ratio: {type: derived, note: "1.0 = steel balls"}
      revision: {n: 1, date: "2026-09-28", by: catalog-stage-1, why: "envelope added; verify/APPROXIMATE comments moved to prov"}
    friction:
      R1: 4.7e-7
      S1: 6.50e-3
      K_z: 3.1
      mu_sl: 0.05
      ball_density_ratio: 1.0
    note: >-
      Same family and the same seal drag mechanism as the 61811 above, one size
      up. On a sealed bearing the seals are the loss: at 3000 rpm they are far
      more than the rolling term, so a speed the seal can take is the design
      question, not the load rating.

  618/8-2Z:
    description: "SKF 618/8-2Z — miniature deep groove, series 618, metal shields both sides (the 40 mm motor)"
    type: deep_groove
    d: 8
    D: 16
    B: 4
    d_m: 12
    balls: steel
    seals: shields          # 2Z shields do not touch the inner ring: M_seal = 0
    default_lubricant: MT47
    n_limit_grease_rpm: 45000
    n_limit_oil_air_rpm: null    # shielded, grease-filled
    C_kn: 1.33
    C0_kn: 0.585
    stiffness_n_per_m: 1.5e+7
    catalog:
      manufacturer: SKF
      part_number: 618/8-2Z
      status: active
      sources: [skf_catalogue, skf_friction]
      prov:
        n_limit_grease_rpm: {type: datasheet, src: skf_catalogue, verify: true, note: "catalogue value to verify"}
        C_kn: {type: datasheet, src: skf_catalogue, verify: true, note: "catalogue value to verify"}
        C0_kn: {type: datasheet, src: skf_catalogue, verify: true, note: "catalogue value to verify"}
        stiffness_n_per_m: {type: estimate, note: "APPROXIMATE — a miniature bearing is SOFT, and on a small machine it, not the shaft, sets the first critical speed"}
        friction.R1: {type: datasheet, src: skf_friction, note: "SKF table 2, series 618"}
        friction.S1: {type: datasheet, src: skf_friction, note: "SKF table 2, series 618"}
        friction.ball_density_ratio: {type: derived, note: "1.0 = steel balls"}
      revision: {n: 1, date: "2026-09-28", by: catalog-stage-1, why: "envelope added; verify/APPROXIMATE comments moved to prov"}
    friction:
      R1: 4.7e-7
      S1: 6.50e-3
      K_z: 3.1
      mu_sl: 0.05
      ball_density_ratio: 1.0
    note: >-
      Shielded, so there is no seal term at all and the whole loss is the rolling
      term: a few milliwatts. The opposite regime to the sealed cards above.

  W 638/2-2Z:
    description: "SKF W 638/2-2Z — stainless steel miniature deep groove, series 638, metal shields both sides, non-contact (skf.com)"
    type: deep_groove
    d: 2
    D: 5
    B: 2.3
    d_m: 3.5                    # not published; (d+D)/2, same convention as every other card here
    balls: steel                # stainless steel rings/balls; same density category as plain bearing steel
    seals: shields               # "Sealing: Shield on both sides / Sealing type: Non-contact" -> M_seal = 0
    default_lubricant: MT47      # page states "Lubricant: Grease"; SKF's standard 2Z fill, same as the other 2Z cards
    n_limit_grease_rpm: 100000    # SKF "Limiting speed" (mechanical). Reference (thermal) speed is 200 000 r/min — see note.
    n_limit_oil_air_rpm: null    # shielded, grease-filled; no oil-air rating published
    C_kn: 0.094                  # SKF "Basic dynamic load rating"
    C0_kn: 0.025                 # SKF "Basic static load rating"
    stiffness_n_per_m: 2.0e+6
    catalog:
      manufacturer: SKF
      part_number: W 638/2-2Z
      status: active
      sources: [skf_w638_2_2z, skf_friction]
      prov:
        d_m: {type: derived, note: "not published; (d+D)/2, same convention as every other card here"}
        default_lubricant: {type: datasheet, src: skf_w638_2_2z, note: "page states 'Lubricant: Grease'; SKF's standard 2Z fill, same as the other 2Z cards"}
        n_limit_grease_rpm: {type: datasheet, src: skf_w638_2_2z, note: "SKF 'Limiting speed' (mechanical); reference (thermal) speed is 200 000 r/min"}
        C_kn: {type: datasheet, src: skf_w638_2_2z, note: "SKF 'Basic dynamic load rating'"}
        C0_kn: {type: datasheet, src: skf_w638_2_2z, note: "SKF 'Basic static load rating'"}
        stiffness_n_per_m: {type: estimate, note: "APPROXIMATE, NOT SKF-published (SKF publishes no bearing stiffness; every stiffness_n_per_m in this file is our own estimate). Scaled down from 618/8-2Z's 1.5e7 N/m by the much smaller d_m/section (3.5 vs 12 mm); order-of-magnitude only, first thing to check if a rotordynamics answer on this bearing looks wrong."}
