# motor_ai_sim — one-node deploy (Hetzner or any docker host).
# From the repo root:
#   cp .env.example deploy/.env    # then fill the values
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      AUTH_ENFORCE: "1"
      ADMIN_EMAILS: ${ADMIN_EMAILS:?set in deploy/.env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # persistent state: users.json, .auth_secret, motor_config.yaml, the
      # family catalog (config/dies), materials — survives image updates.
      - motor_config:/app/config
    # solver appetite: uncomment to cap
    # cpus: "12"
    # mem_limit: 32g

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # same-origin default: nginx proxies /api -> api:8001
        VITE_API_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  motor_config:
