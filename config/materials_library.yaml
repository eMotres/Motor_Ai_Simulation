    alpha_br_pct_per_k: -0.112     # %/K  (Br)
    beta_hcj_pct_per_k: -0.463     # %/K  (Hcj / knee field)
    Br: 1.4279           # T — remanence at H=0
    Hc: 1082196        # A/m — normal coercivity = Br / (mu0 * mu_rec)
