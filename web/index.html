<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/brand/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/aerostator-logo-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f6f3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme before first paint: the app is LIGHT unless the visitor chose dark (theme.ts
         loadThemeMode, key app.themeMode).  The pre-rendered block and index.css both key on
         html[data-theme]; neither follows the OS colour scheme, so nothing flips on mount. -->
    <script data-theme-init>
      (function () {
        var dark = false;
        try { dark = localStorage.getItem('app.themeMode') === 'dark'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <!-- First visit with a Chinese browser (WeChat, zh language list or a China time zone):
         go from / to the pre-rendered Chinese page BEFORE the bundle loads, so even the
         static block is Chinese when the bundle is slow or blocked.  A saved choice
         (localStorage ui.locale) wins; ?lang=en saves "en" and stays.  Only "/" is ever
         redirected and the target is /zh-cn/, so it can never loop.  Plain ES5 on purpose;
         src/i18n/__tests__/chinaAccess.test.mjs runs this exact text from the built page. -->
    <script data-first-visit-redirect>
      (function () {
        try {
          var loc = window.location;
          if (loc.pathname !== '/') return;
          var q = loc.search || '';
          if (/[?&]lang=en(&|$)/.test(q)) {
            try { localStorage.setItem('ui.locale', 'en'); } catch (e) {}
            return;
          }
          var saved = null;
          try { saved = localStorage.getItem('ui.locale'); } catch (e) {}
          if (saved) return;
          if (/[?&](verify|reset|continue|signin|signup)=/.test(q)) return;
          var zh = /(^|[^a-z])Language\/zh/i.test(navigator.userAgent || '');
          var langs = navigator.languages && navigator.languages.length
            ? navigator.languages : [navigator.language || ''];
          for (var i = 0; !zh && i < langs.length; i++) {
            zh = /^zh([-_]|$)/i.test(String(langs[i]).replace(/^\s+|\s+$/g, ''));
          }
          if (!zh) {
            var tz = '';
            try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
            zh = /^Asia\/(Shanghai|Chongqing|Harbin|Urumqi|Kashgar|Hong_Kong|Macau)$/.test(tz);
          }
          if (zh) loc.replace('/zh-cn/' + q + (loc.hash || ''));
        } catch (e) {}
      })();
    </script>
    <!-- Inter is self-hosted (public/fonts, @font-face in src/index.css): nothing here may
         depend on a third-party host, many of which are blocked in some countries. -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>AeroStator Core — Motor Technology Portal</title>
    <meta name="description" content="AeroStator Core — select, configure, price and order high-performance electric motors for aerospace, robotics, EV and marine applications." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- No "taking a long time" note any more (owner 2026-10-18: it frightens users): the pre-rendered block stays
         readable and its links work until the app replaces it. -->
  </body>
</html>
