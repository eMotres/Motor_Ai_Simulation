# EU server: /etc/motres/rsyncd-motres.conf for deploy/systemd/motres-rsyncd-library.service.
# One READ-ONLY module, reachable only over WireGuard from the US host, showing only the library allow-list
# (src/motor_ai_sim/regions/catalog_manifest.py LIBRARY_DIRS / LIBRARY_FILES).  The US job asks for exactly the files of the
# signed manifest (--files-from); the module is the second fence, not the first.
address = 10.77.0.1
port = 873
use chroot = yes
uid = root
gid = root
max connections = 2
log file = /var/log/motres-rsyncd.log

[motres-library]
    path = /srv/motres/shared
    comment = AeroStator open library (read-only)
    read only = yes
    write only = no
    list = no
    hosts allow = 10.77.0.2
    hosts deny = *
    refuse options = delete delete-before delete-during delete-after delete-delay delete-excluded
    include from = /etc/motres/rsyncd-motres.include
    exclude = *
