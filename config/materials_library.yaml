      - {"id": "iec60028", "doc": "IEC 60028:1925 International standard of resistance for copper: annealed copper at 20 C has resistivity 1/58 Ohm mm2/m (58.0 MS/m), density 8.89 g/cm3, constant-mass temperature coefficient 0.00393 1/K at 20 C", "read": "2026-09-29"}
      - {"id": "cda_c11000", "doc": "Copper Development Association, UNS C11000 (ETP) typical properties: density 0.321 lb/in3, thermal conductivity 226 Btu ft/(h ft2 F) = 391 W/mK, E 17 000 ksi = 117 GPa, specific heat 0.092 Btu/lb F = 385 J/kgK, annealed yield ~10 ksi = 69 MPa (as reproduced by AZoM article 6312)", "url": "https://www.azom.com/article.aspx?ArticleID=6312", "read": "2026-09-29"}
    prov:
      youngs_modulus_gpa: {"type": "datasheet", "src": "cda_c11000", "note": "17 000 ksi = 117 GPa (matches)"}
      yield_strength_mpa: {"type": "datasheet", "src": "cda_c11000", "note": "annealed ~69 MPa (matches 70)"}
      specific_heat: {"type": "datasheet", "src": "cda_c11000", "note": "385 (matches)"}
      thermal_conductivity: {"type": "datasheet", "src": "cda_c11000"}
      cte_ppm_k: {"type": "estimate", "note": "17.0; CDA quotes 17.6e-6/K as the 20-300 C mean - kept, verify the range used", "verify": true, "source": "none"}
      poisson_ratio: {"type": "estimate", "note": "0.34 handbook figure", "verify": true, "source": "none"}
      permeability: {"type": "estimate", "note": "diamagnetic copper, mu_r ~ 0.99999; value kept", "verify": true, "source": "none"}
    description: "Pure copper — rectangular Litz wire"
    sigma: 58000000    # S/m at 20 °C
    density: 8890
    # --- mechanical (added 2026-09-05 for the rotor structural solve) ---
    youngs_modulus_gpa: 117        # GPa  annealed C11000
    poisson_ratio: 0.34            # -
    cte_ppm_k: 17.0   # ppm/K  annealed C11000 (user 2026-09-07)
    yield_strength_mpa: 70         # MPa  annealed (soft) copper, 0.2 % proof
    thermal_conductivity: 391
    specific_heat: 385
    permeability: 0.999991
    wire_type: rectangular
    # Temperature-dependent conductivity: sigma(T) = sigma0 / (1 + 0.00393*(T - 20)), IEC 60028
    thermal_alpha: 0.00393   # 1/°C

