ngspice:
  compat: psa
  # The L1 wrapper (junction = TEMP through a 1 uOhm E-source loop) does NOT
  # converge in an ngspice transient ("timestep too small" at the internal
  # gate at the first turn-off; gear/xmu/looser tolerances/ps mode/slower
  # gate edge tried 2026-09-23), and its DC point needs a voltage drive.
  # The L3 model with ALL thermal pins (Tj, Ttop, Tbottom) held at T_j by
  # voltage sources is the same electrical core, isothermal at T_j, and runs
  # (7 s per double pulse).  The harness uses L3 for this part.
  level: L3
