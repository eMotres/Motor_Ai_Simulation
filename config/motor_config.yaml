  out_band: air
  rotor_core: B15AHV950M
  magnet: F52SH_120C
  shaft: Aluminium_6061
  slot_insulation: Nomex
  wire_insulation: polyimide
custom_materials: {}
winding:
  n_coils_per_phase: 4
  connection: 2S-2P
  n_parallel: 2
  n_series: 2
  layers: 1
simulation:
  max_current: 360.6244584051392
  frequency: 198.33
  rpm: 850.0
  phase_offset_deg: 16.0
  steps_per_period: 40
  demag: true
