# PROPOSAL, NOT WIRED IN.  Nothing loads this file: deploy/Dockerfile.web copies only deploy/nginx.conf.  It is for the owner to
# review; applying it is a separate decision and a web container deploy.
#
# What it adds: a per-address request rate at the edge, in front of the API's own limits (routes/auth_local.py and
# auth_email.py count failures, mails and sign-ups; routes/oauth.py counts what writes the OAuth store).  The API's limits live
# in one process and restart with it; these do not.  The rates sit well above what a person or an office behind one address
# does, so nobody should ever meet them in normal use:
#
#   login            one POST per attempt; 10 a minute with a burst of 20
#   register         one POST per sign-up plus resends; 5 a minute with a burst of 10
#   account links    the mailed page (GET) and its form (POST), reset, resend; 20 a minute with a burst of 20
#   OAuth            one authorize and at most one register per connection; 30 and 10 a minute with a burst of 20
#
# $binary_remote_addr is the visitor here: the server block takes the address from the host nginx (real_ip_header X-Real-IP,
# deploy/nginx.conf).  Without that line every visitor would share the gateway's address, so keep them together.
#
# Each 10 MB zone holds about 160 000 addresses.
#
# HOW TO APPLY, after review:
#   1. Put part 1 at the top of deploy/nginx.conf, outside the server block (the file is included in the http context).
#   2. Put part 2 inside the server block, beside the /api/ location.  Exact and regex locations beat the /api/ prefix, and they
#      do not match the worker regex above it.
#   3. `nginx -t` in the web container, then `nginx -s reload`.  To back out, remove both parts and reload.

# ── part 1: http context ────────────────────────────────────────────────────────────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=auth_login:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_links:10m    rate=20r/m;
limit_req_zone $binary_remote_addr zone=oauth_auth:10m    rate=30r/m;
limit_req_zone $binary_remote_addr zone=oauth_reg:10m     rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;

# ── part 2: server block ────────────────────────────────────────────────────────────────────────────────────────────────────
# add_header does not inherit into a location that has its own, so each location repeats the headers of the /api/ location.
# The body limits are the API's small JSON and form posts; the timeouts are a short request's, not a solve's.

location = /api/auth/login {
    limit_req zone=auth_login burst=20 nodelay;
    proxy_pass http://motres_api;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
}

location ~ ^/api/auth/register(?:/resend|/change-email)?$ {
    limit_req zone=auth_register burst=10 nodelay;
    proxy_pass http://motres_api;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
}

# Confirmation and reset: the mailed link pages, their forms and the JSON endpoints of the web app.
location ~ ^/api/auth/(?:verify|reset/request|reset/confirm|link/.+)$ {
    limit_req zone=auth_links burst=20 nodelay;
    proxy_pass http://motres_api;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
}

location = /oauth/authorize {
    limit_req zone=oauth_auth burst=20 nodelay;
    proxy_pass http://motres_api;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
}

location = /oauth/register {
    limit_req zone=oauth_reg burst=20 nodelay;
    proxy_pass http://motres_api;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
}
